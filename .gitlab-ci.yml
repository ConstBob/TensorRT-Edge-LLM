pages:
  image: 
    name: python:3.10-slim
    entrypoint: ['/bin/bash']
  stage: setup
  tags:
    - cpu-k8s
  before_script:
  - apt update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y wget make
  - wget https://www.doxygen.nl/files/doxygen-1.14.0.linux.bin.tar.gz
  - tar -xzf doxygen-1.14.0.linux.bin.tar.gz
  - cd doxygen-1.14.0
  - make install && cd ..
  script:
  - mkdir public
  - cd docs
  - pip install -r requirements.txt
  - doxygen
  - echo "Sphinx is building documentation now... "
  - sphinx-build -M html ./source/ ./build --silent > doc_build.log 2>&1
  - cp -r build/html/* ../public/
  variables:
    ENV_NAME: $CI_COMMIT_REF_NAME
    URL_SLUG: $CI_COMMIT_REF_SLUG
  rules:
  - if: $CI_COMMIT_BRANCH == "main"
    variables:
      URL_SLUG: ""
  - if: $CI_COMMIT_BRANCH =~ /^release/
  artifacts:
    paths:
    - public
    - docs/doc_build.log
    name: TensorRT_EdgeLLM_API_Reference
    when: always
    expire_in: 3 days
  pages:
    path_prefix: ${URL_SLUG}
    expire_in: never
  environment:
    name: ${ENV_NAME}
    url: $CI_PAGES_URL/${URL_SLUG}
  allow_failure: true
  timeout: 3h

merge_request_pages_preview:
  stage: setup
  trigger:
    include:
      - local: .gitlab/ci/pages-merge-request.yml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    
