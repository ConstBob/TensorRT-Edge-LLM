variables:
  TRT_BRANCH: "main"
  BOARD_USER: "nvidia"
  CACHE_DIR: "/scratch.edge_llm_cache/L0/$CI_PIPELINE_ID"

workflow:
  rules:
    # Skip draft MRs completely
    - if: $CI_MERGE_REQUEST_TITLE =~ /^(\[Draft\]|\(Draft\)|Draft:)/
      when: never
    # Run for non-draft MRs
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - when: never

stages:
- pre_commit_checks
- build
- test

# Pre-commit code quality checks
pre_commit_checks:
  stage: pre_commit_checks
  variables:
    PLATFORM: tensorrt-runner
    CUDA_VERSION: "12.9"
    IMAGE: urm.nvidia.com/sw-tensorrt-docker/tensorrt-base:$TRT_BRANCH-cross-aarch64-jp6-cuda$CUDA_VERSION
  tags:
    - cpu-k8s
  script:
    - echo "Installing dependencies"
    - apt update
    - apt install -y python3 python3-pip git curl
    - echo "Installing pre-commit hooks"
    - pip3 install pre-commit
    - pre-commit install
    - echo "Running pre-commit checks on all files"
    - pre-commit run --all-files || (echo "❌ Pre-commit checks failed!" && echo "💡 To fix this locally, run:" && echo "   pip install pre-commit" && echo "   pre-commit install" && echo "   pre-commit run --all-files" && exit 1)
    - echo "✅ Pre-commit checks passed!"
  interruptible: true



# Building and testing with A30 Linux
a30_model_export:
  stage: build
  variables:
    PLATFORM: tensorrt-runner
    CUDA_VERSION: "12.9"
    IMAGE: urm.nvidia.com/sw-tensorrt-docker/tensorrt-base:$TRT_BRANCH-native-x86_64-ubuntu24.04-cuda$CUDA_VERSION
    CACHE_DIR: "/scratch.edge_llm_cache/L0/$CI_PIPELINE_ID/a30_model_export"
  tags:
    - a30-edgellm-nvks
  image: "$IMAGE"
  script:
    - mkdir -p $CACHE_DIR
    - echo "Installing dependencies"
    - apt update
    - apt install -y python3 python3-pip git curl
    - echo "Testing model export"
    - ls /scratch.trt_llm_data
    - export LLM_SDK_DIR=$(pwd)
    - echo "Installing package dependencies"
    - cd $LLM_SDK_DIR
    - pip3 install build
    - python3 -m build --wheel --outdir dist .
    - pip3 install dist/*.whl
    - echo "Installing pytest dependencies"
    - pip3 install -r tests/requirements.txt
    - echo "Setting up test environment"
    - export ONNX_DIR=$CACHE_DIR/onnx_models
    - export TORCH_DIR=/scratch.trt_llm_data/llm-models
    - export TEST_LOG_DIR=$CACHE_DIR/logs
    - mkdir -p $ONNX_DIR
    - mkdir -p $TEST_LOG_DIR
    - echo "Running L0 export tests with pytest"
    - python3 -m pytest tests --priority=l0_export -v --color=yes --html=$TEST_LOG_DIR/test_report_l0_export.html --self-contained-html --junitxml=$TEST_LOG_DIR/test_report_l0_export.xml
    - ls -la $CACHE_DIR/../
    - ls -la $CACHE_DIR
    - echo "Models exported to cache directory $CACHE_DIR"
    - ls -la $CACHE_DIR/onnx_models
    - echo "Remove useless folders"
    - rm -rf $CACHE_DIR/onnx_models/*quantized*
    - echo "Command execution logs and pytest reports saved to $TEST_LOG_DIR"
    - ls -la $TEST_LOG_DIR
    - df -h /scratch.edge_llm_cache
    - mount | grep "/scratch.edge_llm_cache"
  interruptible: true

# Cross build for JP6 Orin
jp6_cross_build:
  stage: build
  variables:
    PLATFORM: tensorrt-runner
    CUDA_VERSION: "12.9"
    TRT_VERSION: "10.13.3.9"
    IMAGE: urm.nvidia.com/sw-tensorrt-docker/tensorrt-base:$TRT_BRANCH-cross-aarch64-jp6-cuda$CUDA_VERSION
    CACHE_DIR: "/scratch.edge_llm_cache/L0/$CI_PIPELINE_ID/jp6_cross_build"
  tags:
    - a30-edgellm-nvks
  image: "$IMAGE"
  script:
    - mkdir -p $CACHE_DIR
    - echo "Installing dependencies"
    - apt update
    - apt install -y python3 python3-pip git curl
    - echo "Checking cached dependencies"
    - export TRT_CACHE_PATH="trt_softwares/TensorRT-$TRT_VERSION/TensorRT-$TRT_VERSION.jp6.cuda-$CUDA_VERSION"
    - mkdir -p $TRT_CACHE_PATH
    - cp -r /scratch.edge_llm_cache/trt_softwares/TensorRT-$TRT_VERSION/TensorRT-$TRT_VERSION.jp6.cuda-$CUDA_VERSION/* $TRT_CACHE_PATH/
    - echo "All cached dependencies found"
    - echo "Copying 3rdParty dependencies from cache"
    - cp -r /scratch.edge_llm_cache/3rdParty .
    - echo "Using TensorRT JP6 package directly from cache"
    - export LLM_SDK_DIR=$(pwd)
    - echo "Building TensorRT Edge-LLM SDK"
    - rm -rf build-jp6
    - mkdir -p build-jp6
    - cd build-jp6
    - cmake .. -DTRT_PACKAGE_DIR=$TRT_CACHE_PATH -DCMAKE_TOOLCHAIN_FILE=cmake/aarch64_linux_toolchain.cmake -DEMBEDDED_TARGET=orin -DBUILD_UNIT_TESTS=ON
    - make -j16
    - echo "Built TensorRT Edge-LLM SDK"
    - echo "Copying build artifacts to cache directory"
    - cp -r $LLM_SDK_DIR/build-jp6 $CACHE_DIR/build
    - echo "Build artifacts saved to $CACHE_DIR"
    - ls -la $CACHE_DIR
  interruptible: true


orin_test:
  stage: test
  dependencies:
    - jp6_cross_build
    - a30_model_export
  variables:
    CUDA_VERSION: "12.9"
    TRT_VERSION: "10.13.3.9"
    TRT_CACHE_PATH: "/scratch.edge_llm_cache/trt_softwares/TensorRT-$TRT_VERSION/TensorRT-$TRT_VERSION.jp6.cuda-$CUDA_VERSION"
  tags:
    - p3730-k8s
  image: "ubuntu:24.04"
  script:
    - echo "Installing dependencies"
    - apt update
    - apt install -y openssh-client sshpass rsync nfs-common python3 python3-pip python3-venv
    - echo "Copying password to device scripts"
    - sed -i -e "s/{BOARDPASSWORD}/${BOARD_PASSWORD_NVKS}/g" .gitlab/ci/scripts/device_init.sh
    # clean up the packages in the board
    - sshpass -p "$BOARD_PASSWORD_NVKS" ssh -o StrictHostKeyChecking=no $BOARD_USER@192.168.55.1 'bash -s' < .gitlab/ci/scripts/device_init.sh
    - if [ $? -ne 0 ]; then echo "Error occurred during initializing"; exit 1; fi
    - echo "Syncing tensorrt-edge-llm source to the board"
    - sshpass -p "$BOARD_PASSWORD_NVKS" rsync -av -e "ssh -o StrictHostKeyChecking=no" . $BOARD_USER@192.168.55.1:/home/$BOARD_USER/tensorrt-edge-llm
    - echo "Syncing JP6 build artifacts from cache to board"
    - sshpass -p "$BOARD_PASSWORD_NVKS" rsync -av -e "ssh -o StrictHostKeyChecking=no" $CACHE_DIR/jp6_cross_build/build $BOARD_USER@192.168.55.1:/home/$BOARD_USER/tensorrt-edge-llm
    - echo "Creating TensorRT directory structure on Orin device"
    - sshpass -p "$BOARD_PASSWORD_NVKS" ssh -o StrictHostKeyChecking=no $BOARD_USER@192.168.55.1 "mkdir -p /home/$BOARD_USER/tensorrt-edge-llm/trt_softwares/TensorRT-$TRT_VERSION"
    - echo "Syncing TensorRT JP6 libraries to device"
    - sshpass -p "$BOARD_PASSWORD_NVKS" rsync -av -e "ssh -o StrictHostKeyChecking=no" $TRT_CACHE_PATH $BOARD_USER@192.168.55.1:/home/$BOARD_USER/tensorrt-edge-llm/trt_softwares/TensorRT-$TRT_VERSION/
    - echo "Setting up TensorRT environment on device"
    - sshpass -p "$BOARD_PASSWORD_NVKS" ssh -o StrictHostKeyChecking=no $BOARD_USER@192.168.55.1 "echo 'export TRT_CACHE_PATH=/home/$BOARD_USER/tensorrt-edge-llm/trt_softwares/TensorRT-$TRT_VERSION/TensorRT-$TRT_VERSION.jp6.cuda-$CUDA_VERSION' >> /home/$BOARD_USER/.bashrc"
    - sshpass -p "$BOARD_PASSWORD_NVKS" ssh -o StrictHostKeyChecking=no $BOARD_USER@192.168.55.1 "echo 'export LD_LIBRARY_PATH=\$LD_LIBRARY_PATH:/home/$BOARD_USER/tensorrt-edge-llm/trt_softwares/TensorRT-$TRT_VERSION/TensorRT-$TRT_VERSION.jp6.cuda-$CUDA_VERSION/lib' >> /home/$BOARD_USER/.bashrc"
    - echo "Syncing models to the board"
    - sshpass -p "$BOARD_PASSWORD_NVKS" rsync -av -e "ssh -o StrictHostKeyChecking=no" $CACHE_DIR/a30_model_export/onnx_models $BOARD_USER@192.168.55.1:/home/$BOARD_USER/tensorrt-edge-llm
    - sshpass -p "$BOARD_PASSWORD_NVKS" ssh -o StrictHostKeyChecking=no $BOARD_USER@192.168.55.1 "ls -la /home/$BOARD_USER/tensorrt-edge-llm/"
    - sshpass -p "$BOARD_PASSWORD_NVKS" ssh -o StrictHostKeyChecking=no $BOARD_USER@192.168.55.1 "ls -la /home/$BOARD_USER/tensorrt-edge-llm/onnx_models"
    - echo "Creating Python virtual environment"
    - python3 -m venv venv
    - source venv/bin/activate
    - echo "Installing pytest dependencies in virtual environment"
    - pip install -r tests/requirements.txt
    - export LLM_SDK_DIR=$(pwd)
    - echo "Creating remote directories"
    - sshpass -p "$BOARD_PASSWORD_NVKS" ssh -o StrictHostKeyChecking=no $BOARD_USER@192.168.55.1 "mkdir -p /home/$BOARD_USER/tensorrt-edge-llm/engines"
    - echo "Creating remote directories"
    - sshpass -p "$BOARD_PASSWORD_NVKS" ssh -o StrictHostKeyChecking=no $BOARD_USER@192.168.55.1 "mkdir -p /home/$BOARD_USER/tensorrt-edge-llm/logs"
    - echo "Running L0 pipeline tests on Orin with pytest (remote execution mode)"
    - export ONNX_DIR=/home/$BOARD_USER/tensorrt-edge-llm/onnx_models
    - export ENGINE_DIR=/home/$BOARD_USER/tensorrt-edge-llm/engines
    - export TEST_LOG_DIR=$CACHE_DIR/orin_test/logs
    - mkdir -p $TEST_LOG_DIR
    - source venv/bin/activate && python -m pytest tests/ --priority=l0_pipeline_orin --execution-mode=remote --remote-host=192.168.55.1 --remote-user=$BOARD_USER --remote-password="$BOARD_PASSWORD_NVKS" --remote-workspace=/home/$BOARD_USER/tensorrt-edge-llm -v --color=yes --html=$TEST_LOG_DIR/test_report_l0_pipeline_orin.html --self-contained-html --junitxml=$TEST_LOG_DIR/test_report_l0_pipeline_orin.xml
    - if [ $? -ne 0 ]; then echo "Error occurred during testing"; exit 1; fi
    - echo "Command execution logs and pytest reports saved to $TEST_LOG_DIR"
    - ls -la $TEST_LOG_DIR
    - echo "Copying engine files back to cache directory"
    - mkdir -p $CACHE_DIR/orin_test/engines
    - sshpass -p "$BOARD_PASSWORD_NVKS" rsync -av --no-owner --no-group -e "ssh -o StrictHostKeyChecking=no" $BOARD_USER@192.168.55.1:/home/$BOARD_USER/tensorrt-edge-llm/engines/ $CACHE_DIR/orin_test/engines/ || echo "No engines to copy back"
    - echo "Engine files copied to cache:$CACHE_DIR/orin_test/engines/"
    - ls -la $CACHE_DIR/orin_test/engines/ || echo "No engines generated"
  interruptible: true


a30_build_and_test:
  stage: test
  dependencies:
    - a30_model_export
  variables:
    PLATFORM: tensorrt-runner
    CUDA_VERSION: "12.9"
    TRT_VERSION: "10.13.3.9"
    IMAGE: urm.nvidia.com/sw-tensorrt-docker/tensorrt-base:$TRT_BRANCH-native-x86_64-ubuntu24.04-cuda$CUDA_VERSION
  tags:
    - a30-edgellm-nvks
  image: "$IMAGE"
  script:
    - echo "Installing dependencies"
    - apt update
    - apt install -y python3 python3-pip git curl
    - echo "Checking cached dependencies"
    - export TRT_CACHE_PATH="/scratch.edge_llm_cache/trt_softwares/TensorRT-$TRT_VERSION/TensorRT-$TRT_VERSION.x86_64.cuda-$CUDA_VERSION"
    - if [ ! -d "/scratch.edge_llm_cache/3rdParty" ]; then echo "3rdParty cache not found at /scratch.edge_llm_cache/3rdParty"; exit 1; fi
    - if [ ! -d "$TRT_CACHE_PATH" ]; then echo "TensorRT x86_64 cache not found at $TRT_CACHE_PATH"; exit 1; fi
    - echo "All cached dependencies found"
    - echo "Copying 3rdParty dependencies from cache"
    - cp -r /scratch.edge_llm_cache/3rdParty .
    - echo "Using TensorRT x86_64 package directly from cache"
    - export LLM_SDK_DIR=$(pwd)
    - cd $LLM_SDK_DIR
    - echo "Installing pytest dependencies"
    - pip3 install -r tests/requirements.txt
    - echo "Setting up test environment"
    - export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$TRT_CACHE_PATH/lib
    - export ONNX_DIR=$CACHE_DIR/a30_model_export/onnx_models
    - export ENGINE_DIR=$CACHE_DIR/a30_build_and_test/engines
    - export TEST_LOG_DIR=$CACHE_DIR/a30_build_and_test/logs
    - mkdir -p $ENGINE_DIR $TEST_LOG_DIR
    - echo "Reading models from cache directory:$ONNX_DIR"
    - ls -la $ONNX_DIR/ || echo "Warning:Cache directory not accessible or empty"
    - echo "Running L0 pipeline tests with pytest"
    - python3 -m pytest tests/ --priority=l0_pipeline_a30 -v --color=yes --html=$TEST_LOG_DIR/test_report_l0_pipeline_a30.html --self-contained-html --junitxml=$TEST_LOG_DIR/test_report_l0_pipeline_a30.xml
    - echo "Command execution logs and pytest reports saved to $TEST_LOG_DIR"
    - ls -la $TEST_LOG_DIR
    - rm -rf $ENGINE_DIR
  interruptible: true

