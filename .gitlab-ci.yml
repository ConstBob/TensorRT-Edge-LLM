variables:
  TRT_BRANCH: "main"

workflow:
  rules:
    # Skip draft MRs completely
    - if: $CI_MERGE_REQUEST_TITLE =~ /^(\[Draft\]|\(Draft\)|Draft:)/
      when: never
    # Run for non-draft MRs
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

stages:
- pre_commit_checks
- build
- export
- test

# Pre-commit code quality checks
pre_commit_checks:
  stage: pre_commit_checks
  variables:
    PLATFORM: tensorrt-runner
    CUDA_VERSION: "12.9"
    IMAGE: urm.nvidia.com/sw-tensorrt-docker/tensorrt-base:$TRT_BRANCH-cross-aarch64-jp6-cuda$CUDA_VERSION
  tags:
    - cpu-k8s
  script:
    - echo "Installing dependencies"
    - apt update
    - apt install -y python3 python3-pip git curl
    - echo "Installing pre-commit hooks"
    - pip3 install pre-commit
    - pre-commit install
    - echo "Running pre-commit checks on all files"
    - pre-commit run --all-files || (echo "❌ Pre-commit checks failed!" && echo "💡 To fix this locally, run:" && echo "   pip install pre-commit" && echo "   pre-commit install" && echo "   pre-commit run --all-files" && exit 1)
    - echo "✅ Pre-commit checks passed!"
  interruptible: true

# Building and testing with A10 Linux
linux_native_build_and_test:
  stage: build
  variables:
    PLATFORM: tensorrt-runner
    CUDA_VERSION: "12.9"
    IMAGE: urm.nvidia.com/sw-tensorrt-docker/tensorrt-base:$TRT_BRANCH-native-x86_64-ubuntu24.04-cuda$CUDA_VERSION
    TRT_LINK: "http://cuda-repo/release-candidates/Libraries/TensorRT/v10.13/10.13.2.2-53e0399a/12.9-r575/Linux-x64-manylinux_2_28/tar/TensorRT-10.13.2.2.Linux.x86_64-gnu.cuda-12.9.tar.gz"
  tags:
    - linux-a10-k8s
  image: "$IMAGE"
  script:
    - echo "Installing dependencies"
    - apt update
    - apt install -y python3 python3-pip git curl
    - echo "Setting up git submodule"
    - git submodule update --init --recursive
    - echo "Downloading TensorRT package"
    - wget -q $TRT_LINK
    - mkdir -p TensorRT-linux
    - tar -xvf TensorRT-*.tar.gz -C TensorRT-linux --strip-components=1
    - export LLM_SDK_DIR=$(pwd)
    - echo "Building TensorRT Edge LLM SDK"
    - mkdir -p build
    - cd build
    - cmake .. -DTRT_PACKAGE_DIR=$LLM_SDK_DIR/TensorRT-linux -DCUDA_VERSION=$CUDA_VERSION -DBUILD_UNIT_TESTS=ON
    - make -j16
    - echo "Built TensorRT Edge LLM SDK"
    - echo "Running unit tests"
    - export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$LLM_SDK_DIR/TensorRT-linux/lib
    - ./unitTest
    - echo "Done running unit tests"
  interruptible: true


# Cross build for JP6 Orin
jp6_cross_build:
  stage: build
  variables:
    PLATFORM: tensorrt-runner
    CUDA_VERSION: "12.9"
    IMAGE: urm.nvidia.com/sw-tensorrt-docker/tensorrt-base:$TRT_BRANCH-cross-aarch64-jp6-cuda$CUDA_VERSION
    TRT_LINK: "http://cuda-repo/release-candidates/Libraries/TensorRT/v10.13/10.13.2.2-53e0399a/12.9-r575/jp6-aarch64/tar/TensorRT-10.13.2.2.jp6.aarch64-gnu.cuda-12.9.tar.gz"
  tags:
    - cpu-k8s
  image: "$IMAGE"
  script:
    - echo "Installing dependencies"
    - apt update
    - apt install -y python3 python3-pip git curl
    - echo "Setting up git submodule"
    - git submodule update --init --recursive
    - echo "Downloading TensorRT package"
    - wget -q $TRT_LINK
    - mkdir -p TensorRT-jp6
    - tar -xvf TensorRT-*.tar.gz -C TensorRT-jp6 --strip-components=1
    - export LLM_SDK_DIR=$(pwd)
    - echo "Building TensorRT Edge LLM SDK"
    - mkdir -p build-jp6
    - cd build-jp6
    - cmake .. -DTRT_PACKAGE_DIR=$LLM_SDK_DIR/TensorRT-jp6 -DCMAKE_TOOLCHAIN_FILE=cmake/aarch64_cross_toolchain.cmake -DAUTO_TARGET=orin -DBUILD_UNIT_TESTS=ON
    - make -j16
    - echo "Built TensorRT Edge LLM SDK"
  interruptible: true
  artifacts:
    paths:
      - build-jp6
      - TensorRT-jp6
    expire_in: 30 minutes

orin_unit_test:
  stage: test
  dependencies:
    - jp6_cross_build
  tags:
    - p3730-k8s
  image: "ubuntu:24.04"
  script:
    - echo "Installing dependencies"
    - apt update
    - apt install -y openssh-client sshpass rsync nfs-common
    - echo "Copying password to device scripts"
    - sed -i -e "s/{BOARDPASSWORD}/${BOARD_PASSWORD_NVKS}/g" .gitlab/ci/scripts/device_init.sh
    - sed -i -e "s/{BOARDPASSWORD}/${BOARD_PASSWORD_NVKS}/g" .gitlab/ci/scripts/device_run.sh
    # clean up the packages in the board
    - sshpass -p "$BOARD_PASSWORD_NVKS" ssh -o StrictHostKeyChecking=no nvidia@192.168.55.1 'bash -s' < .gitlab/ci/scripts/device_init.sh
    - if [ $? -ne 0 ]; then echo "Error occurred during initializing"; exit 1; fi
    - echo "Syncing tensorrt-edge-llm source to the board"
    - sshpass -p "$BOARD_PASSWORD_NVKS" rsync -av -e "ssh -o StrictHostKeyChecking=no" . nvidia@192.168.55.1:/home/nvidia/tensorrt-edge-llm
    # run test
    - sshpass -p "$BOARD_PASSWORD_NVKS" ssh -o StrictHostKeyChecking=no nvidia@192.168.55.1 'bash -s' < .gitlab/ci/scripts/device_run.sh
    - if [ $? -ne 0 ]; then echo "Error occurred during testing"; exit 1; fi

  interruptible: true
