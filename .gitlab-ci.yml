variables:
  TRT_BRANCH: "main"
  EDGE_LLM_CACHE_DIR: "/scratch.edge_llm_cache"
  CACHE_BASE_DIR: "$EDGE_LLM_CACHE_DIR/L0"
  PIPELINE_CACHE_DIR: "$CACHE_BASE_DIR/$CI_PIPELINE_ID"
  TORCH_DIR: "/scratch.trt_llm_data/llm-models"
  TRT_VERSION: "10.13.3.9"

workflow:
  rules:
    # Skip draft MRs completely
    - if: $CI_MERGE_REQUEST_TITLE =~ /^(\[Draft\]|\(Draft\)|Draft:)/
      when: never
    # Run for non-draft MRs
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Run for main/release branches
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^release/

.export_onnx_template:
  script:
    - echo "Pipeline start time:$(date)"
    - mkdir -p $ONNX_DIR $TEST_LOG_DIR
    - echo "Installing dependencies"
    - export DEBIAN_FRONTEND=noninteractive
    - apt update -qq >/dev/null 2>&1
    - apt install -y -qq python3 python3-pip git curl >/dev/null 2>&1
    - echo "Testing model export"
    - ls /scratch.trt_llm_data
    - export LLM_SDK_DIR=$(pwd)
    - echo "Installing package dependencies"
    - cd $LLM_SDK_DIR
    - pip3 install -q build
    - python3 -m build --wheel --outdir dist .
    - pip3 install dist/*.whl
    - echo "Installing pytest dependencies"
    - pip3 install -q -r tests/requirements.txt
    - echo "Setting up test environment"
    - echo "Running L0 export tests with pytest. Time:$(date)"
    - python3 -m pytest tests --priority=$PRIORITY -v --color=yes --html=$TEST_LOG_DIR/test_report_$PRIORITY.html --self-contained-html --junitxml=$TEST_LOG_DIR/test_report_$PRIORITY.xml
    - echo "Models exported to cache directory $ONNX_DIR"
    - ls -la $ONNX_DIR
    - echo "Command execution logs and pytest reports saved to $TEST_LOG_DIR"
    - echo "Pipeline end time:$(date)"
  interruptible: true

.x86_test_template:
  script:
    - echo "Pipeline start time:$(date)"
    - mkdir -p $TEST_LOG_DIR $ENGINE_DIR
    - rm -rf $TEST_LOG_DIR/* $ENGINE_DIR/*
    - chmod -R 777 $TEST_LOG_DIR
    - echo "Installing dependencies"
    - export DEBIAN_FRONTEND=noninteractive
    - apt update -qq >/dev/null 2>&1
    - apt install -y -qq python3 python3-pip git >/dev/null 2>&1
    - echo "Checking TRT x86_64 package"
    - if [ ! -d "$TRT_PACKAGE_DIR" ]; then echo "TensorRT x86_64 cache not found at $TRT_PACKAGE_DIR"; exit 1; fi
    - echo "Using TensorRT x86_64 package directly from cache"
    - export LLM_SDK_DIR=$(pwd)
    - git submodule update --init --recursive
    - echo "Installing pytest dependencies"
    - pip3 install -q -r tests/requirements.txt
    - echo "Installing accuracy dependencies"
    - pip3 install -q -r examples/accuracy/requirements.txt
    - echo "Setting up test environment"
    - echo "Running L0 pipeline tests with pytest. Time:$(date)"
    - python3 -m pytest tests/ --priority=$PRIORITY -v --color=yes --html=$TEST_LOG_DIR/test_report_$PRIORITY.html --self-contained-html --junitxml=$TEST_LOG_DIR/test_report_$PRIORITY.xml
    - echo "Command execution logs and pytest reports saved to $TEST_LOG_DIR"
    - ls -la $TEST_LOG_DIR
    - echo "Pipeline end time:$(date)"
  
.device_test_template:
  script:
    - echo "Pipeline start time:$(date)"
    - mkdir -p $TEST_LOG_DIR
    - rm -rf $TEST_LOG_DIR/*
    - chmod -R 777 $TEST_LOG_DIR
    - echo "Installing dependencies"
    - export DEBIAN_FRONTEND=noninteractive
    - apt update -qq >/dev/null 2>&1
    - apt install -y -qq git openssh-client sshpass rsync python3 python3-pip python3-venv >/dev/null 2>&1
    - echo "Copying password to device scripts"
    - sed -i -e "s/{BOARDPASSWORD}/${BOARD_PASSWORD_NVKS}/g" .gitlab/ci/scripts/device_init.sh
    # clean up the packages in the board
    - sshpass -p "$BOARD_PASSWORD_NVKS" ssh -o StrictHostKeyChecking=no $BOARD_USER@192.168.55.1 'bash -s' < .gitlab/ci/scripts/device_init.sh
    - if [ $? -ne 0 ]; then echo "Error occurred during initializing"; exit 1; fi
    - export LLM_SDK_DIR=$(pwd)
    - git submodule update --init --recursive
    - export REMOTE_WORKSPACE=/home/$BOARD_USER/tensorrt-edge-llm
    - export ENGINE_DIR=$REMOTE_WORKSPACE/engines
    - echo "Creating remote directories and syncing repo from host to board"
    - sshpass -p "$BOARD_PASSWORD_NVKS" ssh -o StrictHostKeyChecking=no $BOARD_USER@192.168.55.1 "mkdir -p $REMOTE_WORKSPACE $ENGINE_DIR"
    - sshpass -p "$BOARD_PASSWORD_NVKS" rsync -av -e "ssh -o StrictHostKeyChecking=no" $LLM_SDK_DIR/ $BOARD_USER@192.168.55.1:$REMOTE_WORKSPACE/
    - echo "Setting file permissions to 755 to prevent permission issues"
    - sshpass -p "$BOARD_PASSWORD_NVKS" ssh -o StrictHostKeyChecking=no $BOARD_USER@192.168.55.1 "chmod -R 755 $REMOTE_WORKSPACE"
    - echo "Installing pytest dependencies in a virtual environment"
    - python3 -m venv venv && source venv/bin/activate
    - pip3 install -q -r tests/requirements.txt
    - echo "Installing accuracy dependencies"
    - pip3 install -q -r examples/accuracy/requirements.txt
    - echo "Setup complete. Running L0 pipeline tests on device with pytest. Time:$(date)"
    - python3 -m pytest tests/ --priority=$PRIORITY --execution-mode=remote --remote-host=192.168.55.1 --remote-user=$BOARD_USER --remote-password="$BOARD_PASSWORD_NVKS" --remote-workspace=$REMOTE_WORKSPACE -v --color=yes --html=$TEST_LOG_DIR/test_report_$PRIORITY.html --self-contained-html --junitxml=$TEST_LOG_DIR/test_report_$PRIORITY.xml
    - if [ $? -ne 0 ]; then echo "Error occurred during testing"; exit 1; fi
    - echo "Command execution logs and pytest reports saved to $TEST_LOG_DIR. Cleaning up remote workspace."
    - sshpass -p "$BOARD_PASSWORD_NVKS" ssh -o StrictHostKeyChecking=no $BOARD_USER@192.168.55.1 "rm -rf $REMOTE_WORKSPACE"
    - ls -la $TEST_LOG_DIR
    - deactivate
    - echo "Pipeline end time:$(date)"

stages:
- setup
- test

# Pre-commit code quality checks
pre_commit_checks:
  stage: setup
  variables:
    CUDA_VERSION: "12.9"
  tags:
    - cpu-k8s
  script:
    - echo "Installing dependencies"
    - export DEBIAN_FRONTEND=noninteractive
    - apt update -qq >/dev/null 2>&1
    - apt install -y -qq python3 python3-pip python3-venv git >/dev/null 2>&1
    - echo "Installing pre-commit hooks"
    - python3 -m venv venv && source venv/bin/activate
    - pip3 install -q pre-commit
    - pre-commit install
    - echo "Running pre-commit checks on all files"
    - pre-commit run --all-files || (echo "❌ Pre-commit checks failed!" && echo "💡 To fix this locally, run:" && echo "   pip install pre-commit" && echo "   pre-commit install" && echo "   pre-commit run --all-files" && exit 1)
    - echo "✅ Pre-commit checks passed!"
    - deactivate
    - echo "Pipeline end time:$(date)"
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

cache_cleanup:
  stage: setup
  tags:
    - a30-edgellm-nvks
  script:
    - echo "Pipeline start time:$(date)"
    - echo "Starting cache cleanup for directories older than 3 days in $CACHE_BASE_DIR"
    - echo "Current contents in $CACHE_BASE_DIR:"
    - ls -la "$CACHE_BASE_DIR" || echo "Directory is empty or inaccessible"
    - echo "Removing directories older than 3 days..."
    - find "$CACHE_BASE_DIR" -maxdepth 1 -type d -mtime +3 -not -path "$CACHE_BASE_DIR" -exec rm -rf {} \; -print
    - echo "Cleanup completed. Remaining contents in $CACHE_BASE_DIR:"
    - ls -la "$CACHE_BASE_DIR" || echo "Directory is empty or inaccessible"
    - echo "Pipeline end time:$(date)"
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Model export for Ampere (fp16 or int4)
ampere_model_export:
  stage: test
  variables:
    CUDA_VERSION: "12.9"
    IMAGE: urm.nvidia.com/sw-tensorrt-docker/tensorrt-base:$TRT_BRANCH-native-x86_64-ubuntu24.04-cuda$CUDA_VERSION
    TEST_CACHE_DIR: "$PIPELINE_CACHE_DIR/ampere_model_export"
    PRIORITY: l0_export_ampere
    ONNX_DIR: "$TEST_CACHE_DIR/onnx"
    TEST_LOG_DIR: "$TEST_CACHE_DIR/logs"
  tags:
    - a30-edgellm-nvks
  image: "$IMAGE"
  extends: .export_onnx_template
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

