variables:
  TRT_BRANCH: "main"
  EDGE_LLM_CACHE_DIR: "/scratch.edge_llm_cache"
  RUNNER_USAGE_DIR: "$EDGE_LLM_CACHE_DIR/runner_usage"
  TORCH_DIR: "/scratch.trt_llm_data/llm-models"
  HF_CHECKPOINT_DOWNLOAD_DIR: "$EDGE_LLM_CACHE_DIR/checkpoints/huggingface"
  HF_HOME: "$HF_CHECKPOINT_DOWNLOAD_DIR/.cache"
  EDGE_LLM_ALLOW_HF_DOWNLOAD: "1"
  # Pre-quantized checkpoint store (export jobs read pre-quant models from here).
  # Bump the modelopt version here to roll all L1 export jobs forward at once.
  QUANT_CHECKPOINT_DIR: "/scratch.edge_llm_data/onnx_models/modelopt-0.45.0/quantization_checkpoint"
  TRT_VERSION: "10.16.0.72"
  TRT_WHEEL_GLOB: "tensorrt-$TRT_VERSION*-cp312*"
  TRT10_X86_VERSION: "10.16.0.72"
  TRT10_THOR_VERSION: "10.16.0.72"
  TRT11_VERSION: "11.0.0.114"
  WHEEL_IMAGE_UBUNTU2204_CU13: "artifactory.nvidia.com/sw-tensorrt-docker-local/tensorrt-base:main-native-x86_64-ubuntu22.04-cuda13.0"
  WHEEL_IMAGE_UBUNTU2404_CU13: "artifactory.nvidia.com/sw-tensorrt-docker-local/tensorrt-base:main-native-x86_64-ubuntu24.04-cuda13.2"
  WHEEL_IMAGE_JETPACK70: "urm.nvidia.com/sw-tensorrt-docker/tensorrt-base:main-cross-aarch64-ubuntu24.04-cuda13.2"
  WHEEL_IMAGE_JETPACK71: "urm.nvidia.com/sw-tensorrt-docker/tensorrt-base:main-cross-aarch64-ubuntu24.04-cuda13.2"
  WHEEL_IMAGE_JETPACK72: "urm.nvidia.com/sw-tensorrt-docker/tensorrt-base:main-cross-aarch64-ubuntu24.04-cuda13.2"
  WHEEL_IMAGE_DRIVE72: "urm.nvidia.com/sw-tensorrt-docker/tensorrt-base:main-cross-aarch64-d7l-cuda13.3-n1auto"
  WHEEL_IMAGE_DGX_SPARK: "ubuntu:24.04"
  WHEEL_TRT10_X86_UBUNTU2204_CU13_DIR: "$EDGE_LLM_CACHE_DIR/trt_softwares/TensorRT-$TRT10_X86_VERSION/TensorRT-$TRT10_X86_VERSION.x86_64.cuda-13.2"
  WHEEL_TRT10_X86_UBUNTU2404_CU13_DIR: "$EDGE_LLM_CACHE_DIR/trt_softwares/TensorRT-$TRT10_X86_VERSION/TensorRT-$TRT10_X86_VERSION.x86_64.cuda-13.2"
  WHEEL_TRT11_X86_UBUNTU2404_CU13_DIR: "$EDGE_LLM_CACHE_DIR/trt_softwares/TensorRT-$TRT11_VERSION/TensorRT-$TRT11_VERSION.x86_64.cuda-13.2"
  WHEEL_TRT10_JETPACK72_DIR: "$EDGE_LLM_CACHE_DIR/trt_softwares/TensorRT-$TRT10_THOR_VERSION/TensorRT-$TRT10_THOR_VERSION.aarch64.cuda-13.2"
  WHEEL_TRT10_JETPACK70_DIR: "$EDGE_LLM_CACHE_DIR/trt_softwares/TensorRT-$TRT10_THOR_VERSION/TensorRT-$TRT10_THOR_VERSION.d7l.cuda-13.2"
  WHEEL_TRT10_JETPACK71_DIR: "$EDGE_LLM_CACHE_DIR/trt_softwares/TensorRT-$TRT10_THOR_VERSION/TensorRT-$TRT10_THOR_VERSION.d7l.cuda-13.2"
  WHEEL_TRT10_DRIVE72_DIR: "$EDGE_LLM_CACHE_DIR/trt_softwares/TensorRT-$TRT10_THOR_VERSION/TensorRT-$TRT10_THOR_VERSION.d7l.cuda-13.2"
  L0_STORAGE_IMAGE: "python:3.12-alpine"
  DEVICE_CONTROLLER_IMAGE: "artifactory.nvidia.com/sw-tensorrt-docker-local/tensorrt-osbase:native-x86_64-ubuntu24.04"
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar" # Defines the location of the analysis task cache
  GIT_DEPTH: "0" # Tells git to fetch all the branches of the project, required by the analysis task
  CI_PIP_INSTALL_TIMEOUT_SECONDS: "1200"
  CI_DOWNLOAD_TIMEOUT_SECONDS: "300"
  CI_GIT_TIMEOUT_SECONDS: "300"
  EDGE_LLM_PIPELINE_NAME: ""

default:
  interruptible: true
  after_script:
    - !reference [.cleanup_engine_storage, after_script]
    - !reference [.record_runner_usage, after_script]

workflow:
  name: "$EDGE_LLM_PIPELINE_NAME"
  auto_cancel:
    on_new_commit: none
  rules:
    # Skip draft MRs completely
    - if: $CI_MERGE_REQUEST_TITLE =~ /^(\[Draft\]|\(Draft\)|Draft:)/
      when: never
    # Run the complete non-publishing wheel release path only when a maintainer
    # explicitly starts it from a protected rehearsal branch.
    - if: >-
        $CI_PIPELINE_SOURCE == "web" &&
        $CI_COMMIT_BRANCH =~ /^rehearsal\// &&
        $CI_COMMIT_REF_PROTECTED == "true" &&
        $EDGELLM_WHEEL_RELEASE_REHEARSAL == "true"
      variables:
        EDGE_LLM_PIPELINE_NAME: "Wheel release rehearsal"
    # Run explicitly selected L1 pipelines, including existing schedules.
    - if: $L1 == "true"
      variables:
        EDGE_LLM_PIPELINE_NAME: "L1"
    # Run scheduled L0 stability pipelines only when explicitly selected.
    - if: $CI_PIPELINE_SOURCE == "schedule" && $L0_STABILITY == "true"
      variables:
        EDGE_LLM_PIPELINE_NAME: "L0 Stability"
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    # Keep the MR pipeline and prechecks, but let job rules omit L0 work.
    # The label is the primary opt-out; the MR title remains a compatibility fallback.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /(^|,)\[skip tests\](,|$)/
      variables:
        EDGE_LLM_SKIP_TESTS: "true"
      auto_cancel:
        on_new_commit: interruptible
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /\[skip tests\]/
      variables:
        EDGE_LLM_SKIP_TESTS: "true"
      auto_cancel:
        on_new_commit: interruptible
    # Run for non-draft MRs (L0 tests).
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      auto_cancel:
        on_new_commit: interruptible
    # Run for main/release branches
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^release/
    - if: $GITHUB_PR && $GITHUB_REPO

include:
  - local: '.gitlab/ci/templates.yml'
  - local: '.gitlab/ci/precheck-jobs.yml'
  - local: '.gitlab/ci/setup-jobs.yml'
  - local: '.gitlab/ci/cutedsl-jobs.yml'
  - local: '.gitlab/ci/wheel-jobs.yml'
  - local: '.gitlab/ci/wheel-generated.yml'
  - local: '.gitlab/ci/wheel-release-jobs.yml'
  - local: '.gitlab/ci/l0-jobs.yml'
  - local: '.gitlab/ci/l1-jobs.yml'
  - local: '.gitlab/ci/sonar-jobs.yml'
  - local: '.gitlab/ci/pages-jobs.yml'
  - local: '.gitlab/ci/.github-pr-jobs.yml'
  - local: '.gitlab/ci/local-board-jobs.yml'
  - local: '.gitlab/ci/experimental-docker-jobs.yml'

# `precheck` is a hard gate. Later `needs` chains must remain rooted in a job
# that waits for this stage to complete successfully.
stages:
- precheck
- setup
- wheel-build
- wheel-assemble
- l0_test
- l1_test
- sonar
- publish
