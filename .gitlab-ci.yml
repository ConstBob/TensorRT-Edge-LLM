# Cross build for JP6 Orin
jp6_cross_build:
  stage: test
  variables:
    PLATFORM: tensorrt-runner
    CUDA_VERSION: "12.9"
    IMAGE: urm.nvidia.com/sw-tensorrt-docker/tensorrt-base:$TRT_BRANCH-cross-aarch64-jp6-cuda$CUDA_VERSION
    TRT_CACHE_PATH: "$EDGE_LLM_CACHE_DIR/trt_softwares/TensorRT-$TRT_VERSION/TensorRT-$TRT_VERSION.jp6.cuda-$CUDA_VERSION"
    TEST_CACHE_DIR: "$PIPELINE_CACHE_DIR/jp6_cross_build"
  tags:
    - a30-edgellm-nvks
  image: "$IMAGE"
  script:
    - echo "Pipeline start time:$(date)"
    - mkdir -p $TEST_CACHE_DIR
    - echo "Installing dependencies"
    - apt update
    - apt install -y python3 python3-pip git curl
    - echo "Checking cached dependencies"
    - export LLM_SDK_DIR=$(pwd)
    - git submodule update --init --recursive
    - echo "Building TensorRT Edge-LLM SDK"
    - mkdir -p build-jp6
    - cd build-jp6
    - cmake .. -DTRT_PACKAGE_DIR=$TRT_CACHE_PATH -DCMAKE_TOOLCHAIN_FILE=cmake/aarch64_linux_toolchain.cmake -DEMBEDDED_TARGET=orin -DBUILD_UNIT_TESTS=ON
    - make -j16
    - echo "Built TensorRT Edge-LLM SDK for Orin"
    - echo "Copying build artifacts to cache directory"
    - cp -r $LLM_SDK_DIR/build-jp6 $TEST_CACHE_DIR/build
    - echo "Build artifacts saved to $TEST_CACHE_DIR"
    - echo "Pipeline end time:$(date)"
  interruptible: true

orin_test:
  stage: test
  needs:
    - jp6_cross_build
    - ampere_model_export
  variables:
    BOARD_USER: "tensorrt_user"
    CUDA_VERSION: "12.9"
    TRT_VERSION: "10.13.3.9"
    TRT_CACHE_PATH: "$EDGE_LLM_CACHE_DIR/trt_softwares/TensorRT-$TRT_VERSION/TensorRT-$TRT_VERSION.jp6.cuda-$CUDA_VERSION"
    TEST_CACHE_DIR: "$PIPELINE_CACHE_DIR/orin_test"
  tags:
    - p3730-k8s
  image: "ubuntu:24.04"
  script:
    - echo "Pipeline start time:$(date)"
    - mkdir -p $TEST_CACHE_DIR
    - echo "Installing dependencies"
    - apt update
    - apt install -y openssh-client sshpass rsync nfs-common python3 python3-pip python3-venv
    - echo "Copying password to device scripts"
    - sed -i -e "s/{BOARDPASSWORD}/${BOARD_PASSWORD_NVKS}/g" .gitlab/ci/scripts/device_init.sh
    # clean up the packages in the board
    - sshpass -p "$BOARD_PASSWORD_NVKS" ssh -o StrictHostKeyChecking=no $BOARD_USER@192.168.55.1 'bash -s' < .gitlab/ci/scripts/device_init.sh
    - if [ $? -ne 0 ]; then echo "Error occurred during initializing"; exit 1; fi
    - export LLM_SDK_DIR=$(pwd)
    - export REMOTE_WORKSPACE=/home/$BOARD_USER/tensorrt-edge-llm
    - echo "Creating remote directories and syncing JP6 build artifacts and TRT libraries from host to board"
    - sshpass -p "$BOARD_PASSWORD_NVKS" ssh -o StrictHostKeyChecking=no $BOARD_USER@192.168.55.1 "mkdir -p $REMOTE_WORKSPACE/build  $REMOTE_WORKSPACE/examples $REMOTE_WORKSPACE/unittests $REMOTE_WORKSPACE/tests"
    - sshpass -p "$BOARD_PASSWORD_NVKS" rsync -av -e "ssh -o StrictHostKeyChecking=no" $PIPELINE_CACHE_DIR/jp6_cross_build/build/ $BOARD_USER@192.168.55.1:$REMOTE_WORKSPACE/build/
    - sshpass -p "$BOARD_PASSWORD_NVKS" rsync -av -e "ssh -o StrictHostKeyChecking=no" $LLM_SDK_DIR/examples/ $BOARD_USER@192.168.55.1:$REMOTE_WORKSPACE/examples/
    - sshpass -p "$BOARD_PASSWORD_NVKS" rsync -av -e "ssh -o StrictHostKeyChecking=no" $LLM_SDK_DIR/unittests/ $BOARD_USER@192.168.55.1:$REMOTE_WORKSPACE/unittests/
    - sshpass -p "$BOARD_PASSWORD_NVKS" rsync -av -e "ssh -o StrictHostKeyChecking=no" $LLM_SDK_DIR/tests/ $BOARD_USER@192.168.55.1:$REMOTE_WORKSPACE/tests/
    - echo "Setting up environment variables on board"
    - sshpass -p "$BOARD_PASSWORD_NVKS" ssh -o StrictHostKeyChecking=no $BOARD_USER@192.168.55.1 "echo 'export LD_LIBRARY_PATH=\$LD_LIBRARY_PATH:$TRT_CACHE_PATH/lib' >> /home/$BOARD_USER/.bashrc"
    - echo "Creating Python virtual environment on host"
    - python3 -m venv venv
    - source venv/bin/activate
    - echo "Installing pytest dependencies in virtual environment"
    - pip install -r tests/requirements.txt
    - export ONNX_DIR=$PIPELINE_CACHE_DIR/ampere_model_export/onnx
    - export ENGINE_DIR=$REMOTE_WORKSPACE/engines
    - export TEST_LOG_DIR=$TEST_CACHE_DIR/logs
    - mkdir -p $TEST_LOG_DIR
    - echo "Setup complete. Running L0 pipeline tests on Orin with pytest. Time:$(date)"
    - source venv/bin/activate && python -m pytest tests/ --priority=l0_pipeline_orin --execution-mode=remote --remote-host=192.168.55.1 --remote-user=$BOARD_USER --remote-password="$BOARD_PASSWORD_NVKS" --remote-workspace=/home/$BOARD_USER/tensorrt-edge-llm -v --color=yes --html=$TEST_LOG_DIR/test_report_l0_pipeline_orin.html --self-contained-html --junitxml=$TEST_LOG_DIR/test_report_l0_pipeline_orin.xml
    - if [ $? -ne 0 ]; then echo "Error occurred during testing"; exit 1; fi
    - echo "Command execution logs and pytest reports saved to $TEST_LOG_DIR. Cleaning up remote workspace."
    - sshpass -p "$BOARD_PASSWORD_NVKS" ssh -o StrictHostKeyChecking=no $BOARD_USER@192.168.55.1 "rm -rf $REMOTE_WORKSPACE"
    - echo "Pipeline end time:$(date)"
  interruptible: true


a30_build_and_test:
  stage: test
  needs:
    - ampere_model_export
  variables:
    PLATFORM: tensorrt-runner
    CUDA_VERSION: "12.9"
    IMAGE: urm.nvidia.com/sw-tensorrt-docker/tensorrt-base:$TRT_BRANCH-native-x86_64-ubuntu24.04-cuda$CUDA_VERSION
    TEST_CACHE_DIR: "$PIPELINE_CACHE_DIR/a30_build_and_test"
  tags:
    - a30-edgellm-nvks
  image: "$IMAGE"
  script:
    - echo "Pipeline start time:$(date)"
    - mkdir -p $TEST_CACHE_DIR
    - echo "Installing dependencies"
    - apt update
    - apt install -y python3 python3-pip git curl
    - echo "Checking TRT x86_64 package"
    - export TRT_CACHE_PATH="$EDGE_LLM_CACHE_DIR/trt_softwares/TensorRT-$TRT_VERSION/TensorRT-$TRT_VERSION.x86_64.cuda-$CUDA_VERSION"
    - if [ ! -d "$TRT_CACHE_PATH" ]; then echo "TensorRT x86_64 cache not found at $TRT_CACHE_PATH"; exit 1; fi
    - echo "Using TensorRT x86_64 package directly from cache"
    - export LLM_SDK_DIR=$(pwd)
    - git submodule update --init --recursive
    - echo "Installing pytest dependencies"
    - pip3 install -r tests/requirements.txt
    - echo "Setting up test environment"
    - export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$TRT_CACHE_PATH/lib
    - export ONNX_DIR=$PIPELINE_CACHE_DIR/ampere_model_export/onnx
    - export ENGINE_DIR=$TEST_CACHE_DIR/engines
    - export TEST_LOG_DIR=$TEST_CACHE_DIR/logs
    - mkdir -p $ENGINE_DIR $TEST_LOG_DIR
    - echo "Running L0 pipeline tests with pytest. Time:$(date)"
    - python3 -m pytest tests/ --priority=l0_pipeline_a30 -v --color=yes --html=$TEST_LOG_DIR/test_report_l0_pipeline_a30.html --self-contained-html --junitxml=$TEST_LOG_DIR/test_report_l0_pipeline_a30.xml
    - echo "Command execution logs and pytest reports saved to $TEST_LOG_DIR"
    - ls -la $TEST_LOG_DIR
    - echo "Pipeline end time:$(date)"
  interruptible: true

