# L0 Pipeline Tests - Drive Thor 1 (SM110 Blackwell)
# Lightweight: FP8 base LLM plus ASR/TTS smoke coverage
# Model families: Qwen2.5, Qwen3-ASR, Qwen3-TTS

tests:
  - tests/defs/test_common.py::test_build_project
  - tests/defs/test_common.py::test_unit_tests

  # === Qwen2.5-0.5B FP8 (base FP8 LLM + MMLU accuracy) ===
  - tests/defs/test_llm_pipeline.py::test_engine_build[Qwen2.5-0.5B-Instruct-FP8-fp8-mxsl4096-mxbs4-mxil2048]
  - tests/defs/test_llm_pipeline.py::test_inference[Qwen2.5-0.5B-Instruct-FP8-fp8-mxsl4096-mxbs4-mxil2048-llm_basic]
  - tests/defs/test_llm_pipeline.py::test_inference[Qwen2.5-0.5B-Instruct-FP8-fp8-mxsl4096-mxbs4-mxil2048-mmlu_0-bs4]

  # === Qwen3-ASR-0.6B FP16 (audio encoder + LLM) ===
  - tests/defs/test_audio_pipeline.py::TestASRPipeline::test_engine_build[Qwen3-ASR-0.6B-fp16-mxsl4096-mxbs1-mxil1024-mnts100-mxts3000]
  - tests/defs/test_audio_pipeline.py::TestASRPipeline::test_inference[Qwen3-ASR-0.6B-fp16-mxsl4096-mxbs1-mxil1024-mnts100-mxts3000-asr_basic]

  # === Qwen3-TTS-12Hz-0.6B-CustomVoice FP16 (Talker + CodePredictor + Code2Wav) ===
  - tests/defs/test_audio_pipeline.py::TestTTSPipeline::test_engine_build[Qwen3-TTS-12Hz-0.6B-CustomVoice-fp16-mxsl4096-mxbs1-mxil4096]
  - tests/defs/test_audio_pipeline.py::TestTTSPipeline::test_inference[Qwen3-TTS-12Hz-0.6B-CustomVoice-fp16-mxsl4096-mxbs1-mxil4096-tts_basic]

  # === SM110 NVFP4 MoE plugin accuracy (Qwen3 + Nemotron, decode + prefill) ===
  # NOTE: These currently skip in this CI job because pytest runs on the x86
  # GitLab runner via .device_test_template and the test requires
  # torch.cuda.get_device_capability() == (11, 0). Entries are listed here so
  # they auto-activate once on-board Python (torch + tensorrt + numpy + pytest)
  # is provisioned on the Thor CI image and the test is invoked via a
  # remote_config SSH wrapper. Plugin .so path can be overridden with
  # EDGELLM_NVFP4_MOE_PLUGIN_SO; otherwise the test discovers build*/.
  # Per-scope scale-mode bisection tests (small shape, h=256/i=128)
  - tests/python-unittests/test_nvfp4_moe_sm110_plugin_accuracy.py::test_sm110_plugin_scale_all_ones_accuracy
  - tests/python-unittests/test_nvfp4_moe_sm110_plugin_accuracy.py::test_sm110_plugin_scale_input_only_accuracy
  - tests/python-unittests/test_nvfp4_moe_sm110_plugin_accuracy.py::test_sm110_plugin_scale_down_only_accuracy
  - tests/python-unittests/test_nvfp4_moe_sm110_plugin_accuracy.py::test_sm110_plugin_scale_alpha_only_accuracy
  - tests/python-unittests/test_nvfp4_moe_sm110_plugin_accuracy.py::test_sm110_plugin_scale_full_non_uniform_accuracy
  # Per-model decode + prefill tests (real Qwen3/Nemotron MoE shapes)
  - tests/python-unittests/test_nvfp4_moe_sm110_plugin_accuracy.py::test_sm110_plugin_qwen3_decode_accuracy
  - tests/python-unittests/test_nvfp4_moe_sm110_plugin_accuracy.py::test_sm110_plugin_qwen3_prefill_accuracy
  - tests/python-unittests/test_nvfp4_moe_sm110_plugin_accuracy.py::test_sm110_plugin_nemotron_decode_accuracy
  - tests/python-unittests/test_nvfp4_moe_sm110_plugin_accuracy.py::test_sm110_plugin_nemotron_prefill_accuracy
