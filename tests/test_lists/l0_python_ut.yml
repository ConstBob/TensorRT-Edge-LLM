# L0 Python Unit Tests - Low-level component tests
#
# These tests verify individual components and kernels at a low level.
# They require:
#   - CUDA-capable GPU
#   - Built plugin library (for plugin tests)

tests:
  - tests/defs/test_common.py::test_build_project

  # Plugin Attention Tests
  # Tests custom attention plugin against numpy reference
  # Requires: build/libNvInfer_edgellm_plugin.so
  - tests/python-unittests/test_attention_plugin.py::TestAttentionPluginVsNumpy::test_plugin_vs_numpy_prefill
  - tests/python-unittests/test_attention_plugin.py::TestAttentionPluginVsNumpy::test_plugin_vs_numpy_decode
  - tests/python-unittests/test_attention_plugin.py::TestAttentionPluginVsNumpy::test_plugin_vs_numpy_tree_attention

  # Experimental Server Tool Calling Tests
  - tests/python-unittests/test_tool_chat_template.py::test_formats_tool_template
  - tests/python-unittests/test_tool_calling.py::test_validates_tool_request
  - tests/python-unittests/test_tool_calling.py::test_parses_tool_calls
  - tests/python-unittests/test_tool_calling.py::test_builds_tool_response_shapes

  # Experimental Server Logit Bias Validation Tests
  - tests/python-unittests/test_experimental_server_logit_bias.py::test_normalize_logit_bias_accepts_integer_like_keys_and_boundaries
  - tests/python-unittests/test_experimental_server_logit_bias.py::test_normalize_logit_bias_rejects_too_many_entries
  - tests/python-unittests/test_experimental_server_logit_bias.py::test_normalize_logit_bias_rejects_non_integer_token_ids
  - tests/python-unittests/test_experimental_server_logit_bias.py::test_normalize_logit_bias_rejects_token_ids_outside_nonnegative_int32
  - tests/python-unittests/test_experimental_server_logit_bias.py::test_normalize_logit_bias_rejects_invalid_bias_values
  - tests/python-unittests/test_experimental_server_logit_bias.py::test_validate_logit_bias_spec_decode_accepts_compatible_states
  - tests/python-unittests/test_experimental_server_logit_bias.py::test_validate_logit_bias_spec_decode_rejects_active_spec_decode
  - tests/python-unittests/test_experimental_server_logit_bias.py::test_hlapi_generate_rejects_logit_bias_with_active_spec_decode
  - tests/python-unittests/test_experimental_server_logit_bias.py::test_api_rejects_logit_bias_with_active_spec_decode
  - tests/python-unittests/test_experimental_server_logit_bias.py::test_api_rejects_overflowing_logit_bias
