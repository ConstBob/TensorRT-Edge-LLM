# ==============================================================================
# SHARED TEMPLATES
# ==============================================================================

# Keep the public upstream URLs canonical in .gitmodules while CI fetches the
# same pinned commits from NVIDIA's internal mirrors.
.ci_internal_submodules:
  hooks:
    pre_get_sources_script:
      - git config --global url."https://gitlab-master.nvidia.com/ftp/GitHubSync/googletest-mirror.git".insteadOf "https://github.com/google/googletest.git"
      - git config --global url."https://gitlab-master.nvidia.com/ftp/GitHubSync/json-mirror.git".insteadOf "https://github.com/nlohmann/json.git"
      - git config --global url."https://gitlab-master.nvidia.com/ftp/GitHubSync/NVTX-mirror.git".insteadOf "https://github.com/NVIDIA/NVTX.git"
      - git config --global url."https://gitlab-master.nvidia.com/ftp/GitHubSync/xgrammar.git".insteadOf "https://github.com/mlc-ai/xgrammar.git"
      - git config --global url."https://gitlab-master.nvidia.com/ftp/GitHubSync/dlpack.git".insteadOf "https://github.com/dmlc/dlpack.git"
      - git config --global url."https://gitlab-master.nvidia.com/ftp/GitHubSync/cpptrace.git".insteadOf "https://github.com/jeremy-rifkin/cpptrace.git"
  variables:
    GIT_SUBMODULE_STRATEGY: recursive

.ci_test_submodules:
  extends: .ci_internal_submodules
  variables:
    GIT_SUBMODULE_PATHS: "3rdParty/googletest 3rdParty/nlohmannJson 3rdParty/xgrammar"

.cpu_runner_retry:
  retry:
    max: 2
    when:
      - api_failure
      - runner_system_failure
      - stuck_or_timeout_failure

# ==============================================================================
# RULE TEMPLATES
# ==============================================================================

.l0_rules:
  rules:
    - if: $L1 == "true"
      when: never
    # Stability must test TOT even when an MR requests [skip tests].
    - if: $CI_PIPELINE_SOURCE == "schedule" && $L0_STABILITY == "true"
      variables:
        L0_STORAGE_KIND: "stability"
        L0_ENVIRONMENT_NAME: "l0/stability_${CI_PIPELINE_ID}"
        L0_STORAGE_RESOURCE_GROUP: "l0-stability-${CI_PIPELINE_ID}"
        L0_STORAGE_RETENTION: "2 days"
        L0_ONNX_REUSE: "0"
        EDGE_LLM_ENGINE_CACHE_MODE: "refresh"
    - if: $EDGE_LLM_SKIP_TESTS == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        L0_STORAGE_KIND: "mr"
        L0_ENVIRONMENT_NAME: "l0/mr_${CI_MERGE_REQUEST_IID}"
        L0_STORAGE_RESOURCE_GROUP: "l0-mr-${CI_MERGE_REQUEST_IID}"
        L0_STORAGE_RETENTION: "30 days"
        L0_ONNX_REUSE: "1"
        EDGE_LLM_ENGINE_CACHE_MODE: "read-write"

.l1_environment:
  environment:
    name: l1_cache/pipeline_$CI_PIPELINE_ID
    on_stop: cleanup_l1_pipeline_cache
    auto_stop_in: 6 days

.l1_rules:
  rules:
    - if: $L1 == "true"

.mr_and_l1_rules:
  rules:
    # Explicit suites run even when an MR requests [skip tests].
    - if: $L1 == "true"
    - if: $CI_PIPELINE_SOURCE == "schedule" && $L0_STABILITY == "true"
    - if: $EDGE_LLM_SKIP_TESTS == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ==============================================================================
# SCRIPT TEMPLATES
# ==============================================================================

.l0_storage_paths:
  variables:
    L0_STORAGE_ENV_FILE: "$CI_PROJECT_DIR/.ci-l0-storage-${CI_JOB_ID}.env"
  before_script:
    - |
      python3 .gitlab/ci/scripts/ci_storage.py prepare-job \
        --environment-file "$L0_STORAGE_ENV_FILE"
      . "$L0_STORAGE_ENV_FILE"

.l0_onnx_exports_1:
  variables:
    L0_ONNX_CACHE_RELATIVE_PATH: "onnx_export_1/onnx"

.l0_onnx_exports_2:
  variables:
    L0_ONNX_CACHE_RELATIVE_PATH: "onnx_export_2/onnx"

.cleanup_engine_storage:
  # Add [retain engines] to the commit message to preserve engine output.
  after_script:
    - |
      set +e
      if [ -n "${L0_STORAGE_ENV_FILE:-}" ] && [ -f "$L0_STORAGE_ENV_FILE" ]; then
        . "$L0_STORAGE_ENV_FILE"
      fi
      if [ -n "${ENGINE_DIR:-}" ]; then
        if command -v python3 >/dev/null 2>&1; then
          python3 "$CI_PROJECT_DIR/.gitlab/ci/scripts/ci_engine_storage.py" || true
        else
          echo "WARNING: Cannot apply engine cleanup policy because python3 is unavailable" >&2
        fi
      fi

.l0_storage_lifecycle:
  extends: .cpu_runner_retry
  image:
    name: "$L0_STORAGE_IMAGE"
    entrypoint: [""]
  tags:
    - cpu-k8s
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache git
    - git init
    - git remote add origin "$CI_REPOSITORY_URL"
    - git fetch --depth=1 --no-tags origin "$CI_COMMIT_SHA"
    - git sparse-checkout set .gitlab/ci/scripts
    - git checkout --detach FETCH_HEAD

.record_runner_usage:
  after_script:
    - sh "$CI_PROJECT_DIR/.gitlab/ci/scripts/record_runner_usage.sh" || true

.report_compiler_cache:
  after_script:
    - sh "$CI_PROJECT_DIR/.gitlab/ci/scripts/ci_ccache.sh" report-from-env "${CI_CCACHE_ENV_FILE:-}" || true

.ci_ccache_setup:
  script:
    - source "$CI_PROJECT_DIR/.gitlab/ci/scripts/ci_ccache_setup.sh" native

.gitlab_junit_report:
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - .ci-reports/
      - .ci-telemetry-artifact/
    reports:
      junit: .ci-reports/*.xml

.sanity_python_check_template:
  script:
    - echo "Pipeline start time:$(date)"
    - 'echo "Node name: ${NODE_NAME:-$(hostname)}"'
    - export LLM_SDK_DIR=${LLM_SDK_DIR:-$(pwd)}
    - echo "Installing TensorRT Edge-LLM in editable mode for sanity check"
    - bash .gitlab/ci/scripts/ci_run.sh "$CI_PIP_INSTALL_TIMEOUT_SECONDS" "Install Edge LLM editable package" -- pip3 install -e .
    - echo "✅ TensorRT Edge-LLM installation successful!"
    - echo "Verifying installation..."
    - python3 -c 'import tensorrt_edgellm; print(tensorrt_edgellm.__version__)'
    - echo "Pipeline end time:$(date)"

.checkpoint_export_template:
  extends:
    - .ci_test_submodules
    - .gitlab_junit_report
  script:
    - |
      echo "Pipeline start time:$(date)"
      echo "Node name: ${NODE_NAME:-$(hostname)}"
      export LLM_SDK_DIR=${LLM_SDK_DIR:-$(pwd)}
      export JUNIT_REPORT="$CI_PROJECT_DIR/.ci-reports/test_report_$PRIORITY.xml"
      mkdir -p "$ONNX_DIR" "$TEST_LOG_DIR" "$CI_PROJECT_DIR/.ci-reports"
      rm -f "$JUNIT_REPORT"
    - |
      # ── Smart ONNX reuse decision ─────────────────────────────────────────
      # MR L0 jobs opt into reuse and share a cache throughout the MR lifecycle.
      # Scheduled stability and L1 exports leave reuse disabled so every run
      # exercises the exporter.
      # Re-export only when the ci:force-checkpoint-export MR label is present,
      # or exporter/cache contract inputs changed since the cached ONNX was produced.
      # Cache reuse intentionally follows source-branch history; target-only
      # changes do not invalidate the existing cache.
      NEED_EXPORT=1
      META="$ONNX_DIR/.export_meta"
      CACHE_COMMIT_SHA="${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA:-${CI_COMMIT_SHA:-}}"
      if [ "${ONNX_REUSE:-0}" != "1" ]; then
        echo "ONNX reuse disabled (ONNX_REUSE!=1) — exporting."
      elif [ "${CI_PIPELINE_SOURCE:-}" = "merge_request_event" ] \
          && printf '%s\n' "${CI_MERGE_REQUEST_LABELS:-}" \
            | grep -qE '(^|,)ci:force-checkpoint-export(,|$)'; then
        echo "ci:force-checkpoint-export MR label found — forcing checkpoint export."
      elif [ ! -s "$META" ] || [ -z "$(ls -A "$ONNX_DIR" 2>/dev/null | grep -v '^\.export_meta$')" ]; then
        echo "No usable cached ONNX (missing cache or metadata) — exporting."
      elif ! command -v git >/dev/null 2>&1; then
        echo "git unavailable — exporting."
      else
        PREV_SHA="$(cat "$META")"
        EXPORT_CACHE_INPUTS="tensorrt_edgellm tests/defs/config.py tests/defs/test_checkpoint_export.py tests/defs/utils/checkpoint_export_helpers.py tests/test_lists/${PRIORITY}.yml .gitlab/ci/l0-jobs.yml .gitlab/ci/templates.yml"
        if [ -z "$CACHE_COMMIT_SHA" ]; then
          echo "Current cache commit is unavailable — exporting."
        elif ! git cat-file -e "${PREV_SHA}^{commit}" 2>/dev/null; then
          echo "Cached export commit $PREV_SHA not reachable (shallow clone?) — exporting."
        elif ! git cat-file -e "${CACHE_COMMIT_SHA}^{commit}" 2>/dev/null; then
          echo "Current cache commit $CACHE_COMMIT_SHA not reachable (shallow clone?) — exporting."
        elif git diff --name-only "$PREV_SHA" "$CACHE_COMMIT_SHA" -- $EXPORT_CACHE_INPUTS | grep -qE '\.(py|ya?ml)$'; then
          echo "Checkpoint export cache inputs changed since cached export — exporting:"
          git diff --name-only "$PREV_SHA" "$CACHE_COMMIT_SHA" -- $EXPORT_CACHE_INPUTS | grep -E '\.(py|ya?ml)$' | sed 's/^/  changed: /'
        else
          echo "No checkpoint export cache input changes since cached export ($PREV_SHA) — REUSING cached ONNX."
          NEED_EXPORT=0
        fi
      fi
    - |
      if [ "$NEED_EXPORT" = "0" ]; then
        echo "Reusing cached ONNX at $ONNX_DIR:"
        ls -la "$ONNX_DIR"
        {
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>'
          printf '%s\n' \
            '<testsuites name="checkpoint export" tests="1" failures="0" errors="0" skipped="1">'
          printf '  <testsuite name="%s" tests="1" failures="0" errors="0" skipped="1" time="0">\n' \
            "$PRIORITY"
          printf '%s\n' '    <testcase classname="checkpoint_export" name="cache_reuse" time="0">'
          SKIP_REASON="Export tests were not executed; ONNX from source commit $PREV_SHA"
          SKIP_REASON="$SKIP_REASON was reused for source commit $CACHE_COMMIT_SHA."
          printf '      <skipped message="Cached ONNX reused">%s</skipped>\n' "$SKIP_REASON"
          printf '%s\n' '    </testcase>'
          printf '%s\n' '  </testsuite>'
          printf '%s\n' '</testsuites>'
        } > "$JUNIT_REPORT"
        echo "Recorded checkpoint export as skipped in $JUNIT_REPORT (cached source commit: $PREV_SHA)."
        echo "Pipeline end time:$(date)"
        exit 0
      fi
    - echo "Verifying CI image dependencies"
    - python3 --version
    - pip3 --version
    - git --version
    - curl --version
    - export LLM_SDK_DIR=${LLM_SDK_DIR:-$(pwd)}
    - echo "Installing package dependencies"
    - cd $LLM_SDK_DIR
    - bash .gitlab/ci/scripts/ci_run.sh "$CI_PIP_INSTALL_TIMEOUT_SECONDS" "Install Python build tooling" -- pip3 install build
    - >-
      bash .gitlab/ci/scripts/ci_run.sh "$CI_JOB_PHASE_TIMEOUT_SECONDS"
      "Build Edge LLM wheel" -- python3 -m build --wheel --outdir dist .
    - export EDGE_LLM_WHEEL=$(python3 -c 'import glob; print(glob.glob("dist/*.whl")[0])')
    - bash .gitlab/ci/scripts/ci_run.sh "$CI_PIP_INSTALL_TIMEOUT_SECONDS" "Install Edge LLM tool dependencies" -- pip3 install "${EDGE_LLM_WHEEL}[tools]"
    - python3 -c 'import torchvision; print(f"torchvision {torchvision.__version__}")'
    - echo "Installing pytest dependencies"
    - bash .gitlab/ci/scripts/ci_run.sh "$CI_PIP_INSTALL_TIMEOUT_SECONDS" "Install pytest dependencies" -- pip3 install -r tests/requirements.txt
    - echo "Checkpoint exporter dependencies are provided by the package wheel"
    - export PYTHONPATH=$LLM_SDK_DIR:$PYTHONPATH
    # Invalidate before mutating the cache so cancellation cannot publish partial output as reusable.
    - |
      if [ "${ONNX_REUSE:-0}" = "1" ]; then
        echo "Invalidating cached ONNX before re-export"
        find "$ONNX_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
        mkdir -p "$ONNX_DIR"
      fi
    - echo "Running checkpoint export tests with pytest. Time:$(date)"
    - |
      bash .gitlab/ci/scripts/ci_run.sh \
        "$CI_JOB_PHASE_TIMEOUT_SECONDS" "Run checkpoint export tests" -- \
        python3 -m pytest tests \
        --priority="$PRIORITY" \
        -v \
        --maxfail=1 \
        --color=yes \
        --html="$TEST_LOG_DIR/test_report_$PRIORITY.html" \
        --self-contained-html \
        --junitxml="$JUNIT_REPORT"
    - echo "HTML report saved to $TEST_LOG_DIR; JUnit report saved to $CI_PROJECT_DIR/.ci-reports"
    - echo "Models exported to cache directory $ONNX_DIR"
    - ls -la $ONNX_DIR
    # Publish cache validity only after the complete export succeeds.
    - |
      if [ "${ONNX_REUSE:-0}" = "1" ]; then
        printf '%s\n' "$CACHE_COMMIT_SHA" > "$META.tmp"
        mv -f "$META.tmp" "$META"
        echo "Recorded export source commit $CACHE_COMMIT_SHA in $META"
      fi
    - echo "Pipeline end time:$(date)"
  interruptible: true

.x86_test_template:
  extends:
    - .ci_test_submodules
    - .gitlab_junit_report
  variables:
    L0_JOB_WRITES_ENGINES: "1"
  script:
    - !reference [.ci_ccache_setup, script]
    - echo "Pipeline start time:$(date)"
    - 'echo "Node name: ${NODE_NAME:-$(hostname)}"'
    - mkdir -p $TEST_LOG_DIR $ENGINE_DIR "$CI_PROJECT_DIR/.ci-reports"
    - rm -rf $TEST_LOG_DIR/* $ENGINE_DIR/*
    - chmod -R 777 $TEST_LOG_DIR
    - echo "Verifying CI image dependencies"
    - python3 --version
    - pip3 --version
    - git --version
    - echo "Checking TRT x86_64 package"
    - if [ ! -d "$TRT_PACKAGE_DIR" ]; then echo "TensorRT x86_64 cache not found at $TRT_PACKAGE_DIR"; exit 1; fi
    - echo "Using TensorRT x86_64 package directly from cache"
    - export LLM_SDK_DIR=${LLM_SDK_DIR:-$(pwd)}
    - echo "Installing pytest dependencies"
    - bash .gitlab/ci/scripts/ci_run.sh "$CI_PIP_INSTALL_TIMEOUT_SECONDS" "Install pytest dependencies" -- pip3 install -r tests/requirements.txt
    - echo "Installing accuracy dependencies"
    - bash .gitlab/ci/scripts/ci_run.sh "$CI_PIP_INSTALL_TIMEOUT_SECONDS" "Install accuracy dependencies" -- pip3 install -r examples/accuracy/requirements.txt
    - echo "Installing TensorRT Python package from cache"
    - bash .gitlab/ci/scripts/ci_run.sh "$CI_PIP_INSTALL_TIMEOUT_SECONDS" "Install TensorRT Python package" -- pip3 install $TRT_PACKAGE_DIR/python/${TRT_WHEEL_GLOB}.whl
    - echo "Installing python cuda dependencies"
    - bash .gitlab/ci/scripts/ci_run.sh "$CI_PIP_INSTALL_TIMEOUT_SECONDS" "Install PyCUDA" -- pip3 install pycuda
    - export LD_LIBRARY_PATH=$TRT_PACKAGE_DIR/lib:$LD_LIBRARY_PATH
    - echo "Setting up test environment"
    - if [ -n "$BASELINE_CSV" ]; then mkdir -p "$(dirname "$BASELINE_CSV")"; fi
    - source .gitlab/ci/scripts/ci_engine_cache_mode.sh
    - echo "Running pipeline tests with pytest. Time:$(date)"
    - >-
      bash .gitlab/ci/scripts/ci_run.sh "$CI_JOB_PHASE_TIMEOUT_SECONDS"
      "Run pipeline tests" -- python3 -m pytest tests/ --priority=$PRIORITY
      -v --maxfail=1 --color=yes --html=$TEST_LOG_DIR/test_report_$PRIORITY.html
      --self-contained-html
      --junitxml="$CI_PROJECT_DIR/.ci-reports/test_report_$PRIORITY.xml"
    - echo "HTML report saved to $TEST_LOG_DIR; JUnit report saved to $CI_PROJECT_DIR/.ci-reports"
    - ls -la $TEST_LOG_DIR
    - echo "Pipeline end time:$(date)"

.nemo_eval_x86_template:
  extends:
    - .ci_test_submodules
  variables:
    L0_JOB_WRITES_ENGINES: "1"
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-artifacts/nemo-eval/nemo_eval.log
      - ci-artifacts/nemo-eval/edgellm_server.log
      - .ci-telemetry-artifact/
  script:
    - echo "Pipeline start time:$(date)"
    - 'echo "Node name: ${NODE_NAME:-$(hostname)}"'
    - |
      : "${TEST_LOG_DIR:?TEST_LOG_DIR must be set}"
      : "${ENGINE_DIR:?ENGINE_DIR must be set}"
    - echo "Checking TRT x86_64 package"
    - if [ ! -d "$TRT_PACKAGE_DIR" ]; then echo "TensorRT x86_64 cache not found at $TRT_PACKAGE_DIR"; exit 1; fi
    - echo "Using TensorRT x86_64 package directly from cache"
    - export LLM_SDK_DIR=${LLM_SDK_DIR:-$(pwd)}
    - echo "Installing pytest dependencies"
    - pip3 install -q -r tests/requirements.txt
    - echo "Installing TensorRT Python package from cache"
    - pip3 install -q $TRT_PACKAGE_DIR/python/tensorrt-$TRT_VERSION*-cp312*.whl
    - echo "Installing python cuda dependencies"
    - pip3 install -q pycuda
    - echo "Installing NeMo Evaluator in an isolated virtual environment"
    - python3 -m venv venv/nemo-eval
    - venv/nemo-eval/bin/pip install -q -r requirements-nemo-evaluator.txt
    - export TEST_PYTHON="$(command -v python3)"
    - export PATH="$LLM_SDK_DIR/venv/nemo-eval/bin:$PATH"
    - export LD_LIBRARY_PATH=$TRT_PACKAGE_DIR/lib:$LD_LIBRARY_PATH
    - echo "Setting up test environment"
    - echo "Running NeMo Evaluator pipeline tests with pytest. Time:$(date)"
    - |
      set +e
      "$TEST_PYTHON" -m pytest tests/ --priority=$PRIORITY -v --color=yes --html=$TEST_LOG_DIR/test_report_$PRIORITY.html --self-contained-html --junitxml=$TEST_LOG_DIR/test_report_$PRIORITY.xml
      pytest_status=$?

      artifact_dir="$CI_PROJECT_DIR/ci-artifacts/nemo-eval"
      artifact_log="$artifact_dir/nemo_eval.log"
      server_artifact_log="$artifact_dir/edgellm_server.log"
      mkdir -p "$artifact_dir"
      if compgen -G "$TEST_LOG_DIR/nemo_eval_*.log" >/dev/null; then
        for log in "$TEST_LOG_DIR"/nemo_eval_*.log; do
          echo "===== $(basename "$log") ====="
          cat "$log"
          echo
        done > "$artifact_log"
        echo "NeMo Evaluator log artifact written to $artifact_log"
      else
        echo "No NeMo Evaluator log found in $TEST_LOG_DIR" > "$artifact_log"
        echo "NeMo Evaluator log artifact placeholder written to $artifact_log"
      fi

      if compgen -G "$TEST_LOG_DIR/nemo-results/*/edgellm_server.log" >/dev/null; then
        for log in "$TEST_LOG_DIR"/nemo-results/*/edgellm_server.log; do
          echo "===== $(basename "$(dirname "$log")")/$(basename "$log") ====="
          cat "$log"
          echo
        done > "$server_artifact_log"
        echo "Edge-LLM server log artifact written to $server_artifact_log"
      else
        echo "No Edge-LLM server log found in $TEST_LOG_DIR/nemo-results" > "$server_artifact_log"
        echo "Edge-LLM server log artifact placeholder written to $server_artifact_log"
      fi

      echo "Command execution logs and pytest reports saved to $TEST_LOG_DIR"
      ls -la "$TEST_LOG_DIR"
      exit "$pytest_status"
    - echo "Pipeline end time:$(date)"

.python_unit_test_template:
  extends:
    - .ci_test_submodules
    - .gitlab_junit_report
  script:
    - !reference [.ci_ccache_setup, script]
    - echo "Pipeline start time:$(date)"
    - 'echo "Node name: ${NODE_NAME:-$(hostname)}"'
    - mkdir -p $TEST_LOG_DIR "$CI_PROJECT_DIR/.ci-reports"
    - rm -rf $TEST_LOG_DIR/*
    - chmod -R 777 $TEST_LOG_DIR
    - echo "Verifying CI image dependencies"
    - python3 --version
    - pip3 --version
    - git --version
    - echo "Checking TRT x86_64 package"
    - if [ ! -d "$TRT_PACKAGE_DIR" ]; then echo "TensorRT x86_64 cache not found at $TRT_PACKAGE_DIR"; exit 1; fi
    - echo "Using TensorRT x86_64 package directly from cache"
    - export LLM_SDK_DIR=${LLM_SDK_DIR:-$(pwd)}
    - bash .gitlab/ci/scripts/ci_run.sh "$CI_PIP_INSTALL_TIMEOUT_SECONDS" "Upgrade pip to 26.2.1" -- python3 -m pip install --upgrade "pip==26.2.1"
    - echo "Installing test dependencies"
    - bash .gitlab/ci/scripts/ci_run.sh "$CI_PIP_INSTALL_TIMEOUT_SECONDS" "Install unit-test dependencies" -- pip3 install -r tests/requirements.txt -r tests/requirements-ut.txt
    - echo "Installing TensorRT Python package from cache"
    - bash .gitlab/ci/scripts/ci_run.sh "$CI_PIP_INSTALL_TIMEOUT_SECONDS" "Install TensorRT Python package" -- pip3 install $TRT_PACKAGE_DIR/python/${TRT_WHEEL_GLOB}.whl
    - export LD_LIBRARY_PATH=$TRT_PACKAGE_DIR/lib:$LD_LIBRARY_PATH
    # test_build_project_with_pybind (l0_python_ut list) builds _edgellm_runtime.
    - export PYTHONPATH="$PWD/build/pybind${PYTHONPATH:+:$PYTHONPATH}"
    # Fail loudly if the runner env is broken (no torch/TRT/GPU); otherwise the
    # harness skips every test at the module level and the job goes green empty.
    - python3 -c "import tensorrt, torch; assert torch.cuda.is_available(), 'CUDA not available'"
    - echo "Running Python unit tests with pytest. Time:$(date)"
    # Test selection is driven by the tests/test_lists/$PRIORITY.yml list.
    - >-
      bash .gitlab/ci/scripts/ci_run.sh "$CI_JOB_PHASE_TIMEOUT_SECONDS"
      "Run Python unit tests" -- python3 -m pytest tests/ --priority=$PRIORITY -v
      --maxfail=1
      --color=yes --html=$TEST_LOG_DIR/test_report_$PRIORITY.html
      --self-contained-html
      --junitxml="$CI_PROJECT_DIR/.ci-reports/test_report_$PRIORITY.xml"
    - echo "HTML report saved to $TEST_LOG_DIR; JUnit report saved to $CI_PROJECT_DIR/.ci-reports"
    - ls -la $TEST_LOG_DIR
    - echo "Pipeline end time:$(date)"

.device_controller_environment:
  image: "$DEVICE_CONTROLLER_IMAGE"
  variables:
    # Prevent SSH from forwarding an unsupported locale to device boards.
    LANG: "C"
    LC_ALL: "C"

.device_test_template:
  extends:
    - .device_controller_environment
    - .ci_test_submodules
    - .gitlab_junit_report
  variables:
    REMOTE_WORKSPACE: "/home/${BOARD_USER}/tensorrt-edge-llm-${CI_JOB_ID}"
    ENGINE_DIR: "$TEST_CACHE_DIR/engines"
    L0_JOB_WRITES_ENGINES: "1"
    CI_APT_INSTALL_TIMEOUT_SECONDS: "1200"
    CI_PIP_INSTALL_TIMEOUT_SECONDS: "2400"
  script:
    - ': "${BOARD_USER:?Device jobs must define BOARD_USER}"'
    - echo "Pipeline start time:$(date)"
    - 'echo "Node name: ${NODE_NAME:-$(hostname)}"'
    - export BOARD_IP=${BOARD_IP:-192.168.55.1}
    - echo "Board IP:$BOARD_IP"
    - mkdir -p $TEST_LOG_DIR "$CI_PROJECT_DIR/.ci-reports"
    - rm -rf $TEST_LOG_DIR/*
    - chmod -R 777 $TEST_LOG_DIR
    - ': "${ENGINE_DIR:?Device pipeline jobs must define ENGINE_DIR}"'
    - |
      case "$REMOTE_WORKSPACE" in
        /home/$BOARD_USER/tensorrt-edge-llm*) ;;
        *) echo "Unsafe REMOTE_WORKSPACE=$REMOTE_WORKSPACE"; exit 1 ;;
      esac
    - export REMOTE_CI_SCRIPT_DIR="$REMOTE_WORKSPACE/.gitlab/ci/scripts"
    - echo "Creating isolated remote workspace $REMOTE_WORKSPACE"
    - sshpass -p "$BOARD_PASSWORD_NVKS" ssh -o StrictHostKeyChecking=no $BOARD_USER@$BOARD_IP "umask 0000 && rm -rf -- '$REMOTE_WORKSPACE' && mkdir -p '$REMOTE_CI_SCRIPT_DIR' '$ENGINE_DIR'"
    - sshpass -p "$BOARD_PASSWORD_NVKS" scp -o StrictHostKeyChecking=no .gitlab/ci/scripts/ci_apt.sh .gitlab/ci/scripts/ci_run.sh "$BOARD_USER@$BOARD_IP:$REMOTE_CI_SCRIPT_DIR/"
    - sshpass -p "$BOARD_PASSWORD_NVKS" ssh -o StrictHostKeyChecking=no $BOARD_USER@$BOARD_IP "chmod 755 '$REMOTE_CI_SCRIPT_DIR/ci_apt.sh' '$REMOTE_CI_SCRIPT_DIR/ci_run.sh'"
    - |
      {
        printf 'BOARD_PASSWORD=%q\nexport BOARD_PASSWORD\n' "$BOARD_PASSWORD_NVKS"
        cat .gitlab/ci/scripts/device_init.sh
      } | sshpass -p "$BOARD_PASSWORD_NVKS" ssh -o StrictHostKeyChecking=no \
        "$BOARD_USER@$BOARD_IP" \
        "REMOTE_WORKSPACE='$REMOTE_WORKSPACE' CI_APT_SCRIPT='$REMOTE_CI_SCRIPT_DIR/ci_apt.sh' bash -s"
    - if [ $? -ne 0 ]; then echo "Error occurred during initializing"; exit 1; fi
    - export LLM_SDK_DIR=${LLM_SDK_DIR:-$(pwd)}
    - echo "Syncing repo from host to $REMOTE_WORKSPACE"
    - sshpass -p "$BOARD_PASSWORD_NVKS" rsync -av -e "ssh -o StrictHostKeyChecking=no" $LLM_SDK_DIR/ $BOARD_USER@$BOARD_IP:$REMOTE_WORKSPACE/
    - echo "Setting file permissions to 755 to prevent permission issues"
    - sshpass -p "$BOARD_PASSWORD_NVKS" ssh -o StrictHostKeyChecking=no $BOARD_USER@$BOARD_IP "chmod -R 755 $REMOTE_WORKSPACE"
    - echo "Installing pytest dependencies in a virtual environment"
    - python3 -m venv venv && source venv/bin/activate
    - bash .gitlab/ci/scripts/ci_run.sh "$CI_PIP_INSTALL_TIMEOUT_SECONDS" "Install pytest dependencies" -- pip3 install -r tests/requirements.txt
    - echo "Installing accuracy dependencies"
    - bash .gitlab/ci/scripts/ci_run.sh "$CI_PIP_INSTALL_TIMEOUT_SECONDS" "Install accuracy dependencies" -- pip3 install -r examples/accuracy/requirements.txt
    - if [ -n "$BASELINE_CSV" ]; then mkdir -p "$(dirname "$BASELINE_CSV")"; fi
    - echo "Setup complete. Running pipeline tests on device with pytest. Time:$(date)"
    - >-
      bash .gitlab/ci/scripts/ci_run.sh "$CI_JOB_PHASE_TIMEOUT_SECONDS"
      "Run remote pipeline tests" -- python3 -m pytest tests/
      --priority=$PRIORITY --execution-mode=remote --remote-host=$BOARD_IP
      --remote-user=$BOARD_USER --remote-password="$BOARD_PASSWORD_NVKS"
      --remote-workspace=$REMOTE_WORKSPACE -v --maxfail=1 --color=yes
      --html=$TEST_LOG_DIR/test_report_$PRIORITY.html --self-contained-html
      --junitxml="$CI_PROJECT_DIR/.ci-reports/test_report_$PRIORITY.xml"
    - echo "HTML report saved to $TEST_LOG_DIR; JUnit report saved to $CI_PROJECT_DIR/.ci-reports"
    - ls -la $TEST_LOG_DIR
    - deactivate
    - echo "Pipeline end time:$(date)"
  after_script:
    - if [ -f "$L0_STORAGE_ENV_FILE" ]; then . "$L0_STORAGE_ENV_FILE"; fi
    - python3 .gitlab/ci/scripts/device_job_finalize.py || true
    - !reference [.cleanup_engine_storage, after_script]
    - !reference [.record_runner_usage, after_script]

# Native C++ unit tests, optionally followed by Python plugin tests, using the
# same full CuTe DSL build.
.cpp_unit_test_template:
  extends:
    - .ci_test_submodules
    - .gitlab_junit_report
  script:
    - echo "Pipeline start time:$(date)"
    - 'echo "Node name: ${NODE_NAME:-$(hostname)}"'
    - test -d "$TRT_PACKAGE_DIR"
    - >-
      bash .gitlab/ci/scripts/ci_run.sh "$CI_JOB_PHASE_TIMEOUT_SECONDS"
      "Build and run C++ unit tests" --
      bash .gitlab/ci/scripts/run_cpp_unit_tests.sh
    - |
      if [[ "${RUN_PYTHON_PLUGIN_TESTS:-0}" == "1" ]]; then
        REMOTE_WORKSPACE="$CI_PROJECT_DIR" \
        PRIORITY="${PYTHON_PLUGIN_PRIORITY:-l0_python_ut}" \
        JUNIT_PREFIX="$CI_JOB_NAME_SLUG" \
        PYTHON_PLUGIN_REPORT_DIR="$CI_PROJECT_DIR/.ci-reports" \
        PYTHON_PLUGIN_USE_SYSTEM_SITE_PACKAGES="${PYTHON_PLUGIN_USE_SYSTEM_SITE_PACKAGES:-0}" \
        bash .gitlab/ci/scripts/device_unit_tests.sh
      fi
    - echo "Pipeline end time:$(date)"

.device_cpp_unit_test_template:
  extends:
    - .device_controller_environment
    - .ci_test_submodules
    - .gitlab_junit_report
  variables:
    REMOTE_WORKSPACE: "/home/${BOARD_USER}/tensorrt-edge-llm-cpp-ut-${CI_JOB_ID}"
    CPP_UNIT_BUILD_JOBS: "16"
    CPP_UNIT_TEST_JOBS: "2"
    PYTHON_PLUGIN_PRIORITY: l0_python_ut
  script:
    - ': "${BOARD_USER:?Device jobs must define BOARD_USER}"'
    - ': "${EMBEDDED_TARGET:?Device C++ unit jobs must define EMBEDDED_TARGET}"'
    - echo "Pipeline start time:$(date)"
    - 'echo "Node name: ${NODE_NAME:-$(hostname)}"'
    - export BOARD_IP=${BOARD_IP:-192.168.55.1}
    - echo "Board IP:$BOARD_IP"
    - mkdir -p $TEST_LOG_DIR "$CI_PROJECT_DIR/.ci-reports"
    - rm -rf $TEST_LOG_DIR/*
    - chmod -R 777 $TEST_LOG_DIR
    - export LLM_SDK_DIR=${LLM_SDK_DIR:-$(pwd)}
    - |
      case "$REMOTE_WORKSPACE" in
        /home/$BOARD_USER/tensorrt-edge-llm*) ;;
        *) echo "Unsafe REMOTE_WORKSPACE=$REMOTE_WORKSPACE"; exit 1 ;;
      esac
    - export REMOTE_CI_SCRIPT_DIR="$REMOTE_WORKSPACE/.gitlab/ci/scripts"
    - >-
      sshpass -p "$BOARD_PASSWORD_NVKS" ssh -o StrictHostKeyChecking=no
      "$BOARD_USER@$BOARD_IP"
      "test ! -e '$REMOTE_WORKSPACE' && umask 0022 && mkdir -p '$REMOTE_CI_SCRIPT_DIR'"
    - sshpass -p "$BOARD_PASSWORD_NVKS" scp -o StrictHostKeyChecking=no .gitlab/ci/scripts/ci_apt.sh .gitlab/ci/scripts/ci_run.sh "$BOARD_USER@$BOARD_IP:$REMOTE_CI_SCRIPT_DIR/"
    - sshpass -p "$BOARD_PASSWORD_NVKS" ssh -o StrictHostKeyChecking=no "$BOARD_USER@$BOARD_IP" "chmod 755 '$REMOTE_CI_SCRIPT_DIR/ci_apt.sh' '$REMOTE_CI_SCRIPT_DIR/ci_run.sh'"
    - |
      {
        printf 'BOARD_PASSWORD=%q\nexport BOARD_PASSWORD\n' "$BOARD_PASSWORD_NVKS"
        cat .gitlab/ci/scripts/device_init.sh
      } | sshpass -p "$BOARD_PASSWORD_NVKS" ssh -o StrictHostKeyChecking=no \
        "$BOARD_USER@$BOARD_IP" \
        "REMOTE_WORKSPACE='$REMOTE_WORKSPACE' CI_APT_SCRIPT='$REMOTE_CI_SCRIPT_DIR/ci_apt.sh' bash -s"
    - echo "Syncing source and CuTe DSL artifacts to $REMOTE_WORKSPACE"
    - sshpass -p "$BOARD_PASSWORD_NVKS" rsync -a -e "ssh -o StrictHostKeyChecking=no" "$CI_PROJECT_DIR/" "$BOARD_USER@$BOARD_IP:$REMOTE_WORKSPACE/"
    - >-
      sshpass -p "$BOARD_PASSWORD_NVKS" ssh -o StrictHostKeyChecking=no
      "$BOARD_USER@$BOARD_IP"
      "TRT_PACKAGE_DIR='$TRT_PACKAGE_DIR'
      CUDA_CTK_VERSION='$CUDA_CTK_VERSION'
      EMBEDDED_TARGET='$EMBEDDED_TARGET'
      CPP_UNIT_BUILD_JOBS='$CPP_UNIT_BUILD_JOBS'
      CPP_UNIT_TEST_JOBS='$CPP_UNIT_TEST_JOBS'
      CPP_UNIT_REPORT_DIR='$REMOTE_WORKSPACE/logs'
      bash '$REMOTE_WORKSPACE/.gitlab/ci/scripts/run_cpp_unit_tests.sh'"
    - echo "Running Python plugin unit tests on $BOARD_IP"
    - |
      sshpass -p "$BOARD_PASSWORD_NVKS" \
        ssh -o StrictHostKeyChecking=no "$BOARD_USER@$BOARD_IP" \
        "REMOTE_WORKSPACE='$REMOTE_WORKSPACE' \
        TRT_PACKAGE_DIR='$TRT_PACKAGE_DIR' \
        TRT_LIBRARY_DIR='${TRT_LIBRARY_DIR:-}' \
        TRT_PYTHON_VERSION='${TRT_PYTHON_VERSION:-}' \
        PRIORITY='$PYTHON_PLUGIN_PRIORITY' \
        JUNIT_PREFIX='$CI_JOB_NAME_SLUG' \
        CI_JOB_ID='$CI_JOB_ID' \
        CI_PIP_INSTALL_TIMEOUT_SECONDS='$CI_PIP_INSTALL_TIMEOUT_SECONDS' \
        CI_JOB_PHASE_TIMEOUT_SECONDS='$CI_JOB_PHASE_TIMEOUT_SECONDS' \
        bash -s" \
        < .gitlab/ci/scripts/device_unit_tests.sh
  after_script:
    - if [ -f "$L0_STORAGE_ENV_FILE" ]; then . "$L0_STORAGE_ENV_FILE"; fi
    - python3 .gitlab/ci/scripts/device_job_finalize.py --fetch-reports || true
    - !reference [.cleanup_engine_storage, after_script]
    - !reference [.record_runner_usage, after_script]

.cross_build_template:
  extends:
    - .ci_internal_submodules
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-artifacts/lib-size/
      - .ci-telemetry-artifact/
    reports:
      metrics: ci-artifacts/lib-size/lib_size_metrics.txt
  script:
    - echo "Pipeline start time:$(date)"
    - 'echo "Node name: ${NODE_NAME:-$(hostname)}"'
    - echo "Starting cross-build for target platform"
    - echo "Checking TRT package"
    - if [ ! -d "$TRT_PACKAGE_DIR" ]; then echo "TensorRT package not found at $TRT_PACKAGE_DIR"; exit 1; fi
    - echo "Using TensorRT package from cache at $TRT_PACKAGE_DIR"
    - echo "Creating build directory"
    - mkdir -p build
    - cd build
    - echo "Running CMake configuration"
    - |
      bash "$CI_PROJECT_DIR/.gitlab/ci/scripts/ci_run.sh" \
        "$CI_JOB_PHASE_TIMEOUT_SECONDS" "Configure cross build" -- \
        cmake .. \
          -DTRT_PACKAGE_DIR=$TRT_PACKAGE_DIR \
          -DCMAKE_TOOLCHAIN_FILE=cmake/aarch64_linux_toolchain.cmake \
          -DEMBEDDED_TARGET=$EMBEDDED_TARGET \
          -DCUDA_CTK_VERSION=$CUDA_VERSION \
          -DENABLE_CUTE_DSL=${ENABLE_CUTE_DSL:-ALL}
    - echo "Building the project"
    - >-
      bash "$CI_PROJECT_DIR/.gitlab/ci/scripts/ci_run.sh"
      "$CI_JOB_PHASE_TIMEOUT_SECONDS" "Build cross target" -- make -j$(nproc)
    - echo "Cross-build completed successfully"
    - echo "Reporting library size"
    - python3 ../scripts/report_library_size.py
        --build-dir .
        --source-dir ..
        --label $EMBEDDED_TARGET
        --output-dir ../ci-artifacts/lib-size
        || echo "WARNING - library size report failed"
    - echo "Pipeline end time:$(date)"
