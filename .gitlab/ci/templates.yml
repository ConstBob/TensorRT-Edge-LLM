# ==============================================================================
# SHARED TEMPLATES
# ==============================================================================

# ==============================================================================
# RULE TEMPLATES
# ==============================================================================

.l0_rules:
  rules:
    - if: $L1 == "true"
      when: never
    - if: $CI_COMMIT_MESSAGE =~ /\[skip tests\]/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

.l0_environment:
  environment:
    name: l0_cache/mr_$CI_MERGE_REQUEST_IID
    on_stop: cleanup_l0_mr_cache
    auto_stop_in: 30 days

.l1_rules:
  rules:
    - if: $L1 == "true"

.setup_common_rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $L1 == "true"

# ==============================================================================
# SCRIPT TEMPLATES
# ==============================================================================

.sanity_python_check_template:
  script:
    - echo "Pipeline start time:$(date)"
    - 'echo "Node name: ${NODE_NAME:-$(hostname)}"'
    - export LLM_SDK_DIR=${LLM_SDK_DIR:-$(pwd)}
    - echo "Installing TensorRT Edge-LLM in editable mode for sanity check"
    - pip3 install -e .
    - echo "✅ TensorRT Edge-LLM installation successful!"
    - echo "Verifying installation..."
    - python3 -c 'import tensorrt_edgellm; print(tensorrt_edgellm.__version__)'
    - echo "Pipeline end time:$(date)"

.checkpoint_export_template:
  script:
    - echo "Pipeline start time:$(date)"
    - 'echo "Node name: ${NODE_NAME:-$(hostname)}"'
    - mkdir -p $ONNX_DIR $TEST_LOG_DIR
    - echo "Installing dependencies"
    - export DEBIAN_FRONTEND=noninteractive
    - apt update -qq >/dev/null 2>&1
    - apt install -y -qq python3 python3-pip git curl >/dev/null 2>&1
    - export LLM_SDK_DIR=${LLM_SDK_DIR:-$(pwd)}
    - echo "Installing package dependencies"
    - cd $LLM_SDK_DIR
    - pip3 install -q build
    - python3 -m build --wheel --outdir dist .
    - export EDGE_LLM_WHEEL=$(python3 -c 'import glob; print(glob.glob("dist/*.whl")[0])')
    - pip3 install "${EDGE_LLM_WHEEL}[tools]"
    - python3 -c 'import torchvision; print(f"torchvision {torchvision.__version__}")'
    - echo "Installing pytest dependencies"
    - pip3 install -q -r tests/requirements.txt
    - echo "Checkpoint exporter dependencies are provided by the package wheel"
    - export PYTHONPATH=$LLM_SDK_DIR:$PYTHONPATH
    - echo "Running checkpoint export tests with pytest. Time:$(date)"
    - python3 -m pytest tests --priority=$PRIORITY -v --color=yes --html=$TEST_LOG_DIR/test_report_$PRIORITY.html --self-contained-html --junitxml=$TEST_LOG_DIR/test_report_$PRIORITY.xml
    - echo "Models exported to cache directory $ONNX_DIR"
    - ls -la $ONNX_DIR
    - echo "Pipeline end time:$(date)"
  interruptible: true

.x86_test_template:
  script:
    - echo "Pipeline start time:$(date)"
    - 'echo "Node name: ${NODE_NAME:-$(hostname)}"'
    - mkdir -p $TEST_LOG_DIR $ENGINE_DIR
    - rm -rf $TEST_LOG_DIR/* $ENGINE_DIR/*
    - chmod -R 777 $TEST_LOG_DIR
    - echo "Installing dependencies"
    - export DEBIAN_FRONTEND=noninteractive
    - apt update -qq >/dev/null 2>&1
    - apt install -y -qq python3 python3-pip git >/dev/null 2>&1
    - echo "Checking TRT x86_64 package"
    - if [ ! -d "$TRT_PACKAGE_DIR" ]; then echo "TensorRT x86_64 cache not found at $TRT_PACKAGE_DIR"; exit 1; fi
    - echo "Using TensorRT x86_64 package directly from cache"
    - export LLM_SDK_DIR=${LLM_SDK_DIR:-$(pwd)}
    # clone googletest and nlohmannJson from internal mirror to avoid git submodule network issues
    - git clone https://gitlab-master.nvidia.com/ftp/GitHubSync/googletest-mirror.git 3rdParty/googletest
    - git clone https://gitlab-master.nvidia.com/ftp/GitHubSync/json-mirror.git 3rdParty/nlohmannJson
    - echo "Installing pytest dependencies"
    - pip3 install -q -r tests/requirements.txt
    - echo "Installing accuracy dependencies"
    - pip3 install -q -r examples/accuracy/requirements.txt
    - echo "Installing TensorRT Python package from cache"
    - pip3 install -q $TRT_PACKAGE_DIR/python/tensorrt-$TRT_VERSION*-cp312*.whl
    - echo "Installing python cuda dependencies"
    - pip3 install -q pycuda
    - export LD_LIBRARY_PATH=$TRT_PACKAGE_DIR/lib:$LD_LIBRARY_PATH
    - echo "Setting up test environment"
    - if [ -n "$BASELINE_CSV" ]; then mkdir -p "$(dirname "$BASELINE_CSV")"; fi
    - echo "Running pipeline tests with pytest. Time:$(date)"
    - python3 -m pytest tests/ --priority=$PRIORITY -v --color=yes --html=$TEST_LOG_DIR/test_report_$PRIORITY.html --self-contained-html --junitxml=$TEST_LOG_DIR/test_report_$PRIORITY.xml
    - echo "Command execution logs and pytest reports saved to $TEST_LOG_DIR"
    - ls -la $TEST_LOG_DIR
    - echo "Pipeline end time:$(date)"

.x86_unit_test_template:
  script:
    - echo "Pipeline start time:$(date)"
    - 'echo "Node name: ${NODE_NAME:-$(hostname)}"'
    - mkdir -p $TEST_LOG_DIR $ENGINE_DIR $ONNX_DIR
    - rm -rf $TEST_LOG_DIR/* $ENGINE_DIR/* $ONNX_DIR/*
    - chmod -R 777 $TEST_LOG_DIR
    - echo "Installing dependencies"
    - export DEBIAN_FRONTEND=noninteractive
    - apt update -qq >/dev/null 2>&1
    - apt install -y -qq python3 python3-pip git >/dev/null 2>&1
    - echo "Checking TRT x86_64 package"
    - if [ ! -d "$TRT_PACKAGE_DIR" ]; then echo "TensorRT x86_64 cache not found at $TRT_PACKAGE_DIR"; exit 1; fi
    - echo "Using TensorRT x86_64 package directly from cache"
    - export LLM_SDK_DIR=${LLM_SDK_DIR:-$(pwd)}
    # clone googletest and nlohmannJson from internal mirror to avoid git submodule network issues
    - git clone https://gitlab-master.nvidia.com/ftp/GitHubSync/googletest-mirror.git 3rdParty/googletest
    - git clone https://gitlab-master.nvidia.com/ftp/GitHubSync/json-mirror.git 3rdParty/nlohmannJson
    - echo "Installing unit test dependencies"
    - pip3 install -q pytest pytest-html pyyaml numpy
    - echo "Installing TensorRT Python package from cache"
    - pip3 install -q $TRT_PACKAGE_DIR/python/tensorrt-$TRT_VERSION*-cp312*.whl
    - echo "Installing python cuda dependencies"
    - pip3 install -q pycuda
    - export LD_LIBRARY_PATH=$TRT_PACKAGE_DIR/lib:$LD_LIBRARY_PATH
    - echo "Running unit tests with pytest. Time:$(date)"
    - python3 -m pytest tests/defs/test_common.py tests/python-unittests/test_attention_native.py tests/python-unittests/test_attention_plugin.py --priority=$PRIORITY -v --color=yes --html=$TEST_LOG_DIR/test_report_$PRIORITY.html --self-contained-html --junitxml=$TEST_LOG_DIR/test_report_$PRIORITY.xml
    - echo "Command execution logs and pytest reports saved to $TEST_LOG_DIR"
    - ls -la $TEST_LOG_DIR
    - echo "Pipeline end time:$(date)"
  
.device_test_template:
  script:
    - echo "Pipeline start time:$(date)"
    - 'echo "Node name: ${NODE_NAME:-$(hostname)}"'
    - export BOARD_IP=${BOARD_IP:-192.168.55.1}
    - echo "Board IP:$BOARD_IP"
    - mkdir -p $TEST_LOG_DIR
    - rm -rf $TEST_LOG_DIR/*
    - chmod -R 777 $TEST_LOG_DIR
    - echo "Installing dependencies"
    - export DEBIAN_FRONTEND=noninteractive
    - apt update -qq >/dev/null 2>&1
    - apt install -y -qq git openssh-client sshpass rsync python3 python3-pip python3-venv >/dev/null 2>&1
    - echo "Copying password to device scripts"
    - sed -i -e "s/{BOARDPASSWORD}/${BOARD_PASSWORD_NVKS}/g" .gitlab/ci/scripts/device_init.sh
    # clean up the packages in the board
    - sshpass -p "$BOARD_PASSWORD_NVKS" ssh -o StrictHostKeyChecking=no $BOARD_USER@$BOARD_IP 'bash -s' < .gitlab/ci/scripts/device_init.sh
    - if [ $? -ne 0 ]; then echo "Error occurred during initializing"; exit 1; fi
    - export LLM_SDK_DIR=${LLM_SDK_DIR:-$(pwd)}
    # clone googletest and nlohmannJson from internal mirror to avoid git submodule network issues
    - git clone https://gitlab-master.nvidia.com/ftp/GitHubSync/googletest-mirror.git 3rdParty/googletest
    - git clone https://gitlab-master.nvidia.com/ftp/GitHubSync/json-mirror.git 3rdParty/nlohmannJson
    - export REMOTE_WORKSPACE=${REMOTE_WORKSPACE:-/home/$BOARD_USER/tensorrt-edge-llm-${CI_JOB_ID:-manual}}
    - export ENGINE_DIR=${ENGINE_DIR:-$REMOTE_WORKSPACE/engines}
    - |
      case "$REMOTE_WORKSPACE" in
        /home/$BOARD_USER/tensorrt-edge-llm*) ;;
        *) echo "Unsafe REMOTE_WORKSPACE=$REMOTE_WORKSPACE"; exit 1 ;;
      esac
    - echo "Creating isolated remote workspace $REMOTE_WORKSPACE and syncing repo from host to board"
    - sshpass -p "$BOARD_PASSWORD_NVKS" ssh -o StrictHostKeyChecking=no $BOARD_USER@$BOARD_IP "rm -rf '$REMOTE_WORKSPACE' && mkdir -p '$REMOTE_WORKSPACE' '$ENGINE_DIR'"
    - sshpass -p "$BOARD_PASSWORD_NVKS" rsync -av -e "ssh -o StrictHostKeyChecking=no" $LLM_SDK_DIR/ $BOARD_USER@$BOARD_IP:$REMOTE_WORKSPACE/
    - echo "Setting file permissions to 755 to prevent permission issues"
    - sshpass -p "$BOARD_PASSWORD_NVKS" ssh -o StrictHostKeyChecking=no $BOARD_USER@$BOARD_IP "chmod -R 755 $REMOTE_WORKSPACE"
    - echo "Installing pytest dependencies in a virtual environment"
    - python3 -m venv venv && source venv/bin/activate
    - pip3 install -q -r tests/requirements.txt
    - echo "Installing accuracy dependencies"
    - pip3 install -q -r examples/accuracy/requirements.txt
    - if [ -n "$BASELINE_CSV" ]; then mkdir -p "$(dirname "$BASELINE_CSV")"; fi
    - echo "Setup complete. Running pipeline tests on device with pytest. Time:$(date)"
    - python3 -m pytest tests/ --priority=$PRIORITY --execution-mode=remote --remote-host=$BOARD_IP --remote-user=$BOARD_USER --remote-password="$BOARD_PASSWORD_NVKS" --remote-workspace=$REMOTE_WORKSPACE -v --color=yes --html=$TEST_LOG_DIR/test_report_$PRIORITY.html --self-contained-html --junitxml=$TEST_LOG_DIR/test_report_$PRIORITY.xml
    - if [ $? -ne 0 ]; then echo "Error occurred during testing"; exit 1; fi
    - echo "Command execution logs and pytest reports saved to $TEST_LOG_DIR. Cleaning up remote workspace."
    - sshpass -p "$BOARD_PASSWORD_NVKS" ssh -o StrictHostKeyChecking=no $BOARD_USER@$BOARD_IP "rm -rf $REMOTE_WORKSPACE"
    - ls -la $TEST_LOG_DIR
    - deactivate
    - echo "Pipeline end time:$(date)"

.cross_build_template:
  script:
    - echo "Pipeline start time:$(date)"
    - 'echo "Node name: ${NODE_NAME:-$(hostname)}"'
    - echo "Starting cross-build for target platform"
    - echo "Checking TRT package"
    - if [ ! -d "$TRT_PACKAGE_DIR" ]; then echo "TensorRT package not found at $TRT_PACKAGE_DIR"; exit 1; fi
    - echo "Using TensorRT package from cache at $TRT_PACKAGE_DIR"
    - echo "Updating git submodules"
    - git submodule update --init --recursive
    - echo "Creating build directory"
    - mkdir -p build
    - cd build
    - echo "Running CMake configuration"
    - cmake .. 
        -DTRT_PACKAGE_DIR=$TRT_PACKAGE_DIR 
        -DCMAKE_TOOLCHAIN_FILE=cmake/aarch64_linux_toolchain.cmake 
        -DEMBEDDED_TARGET=$EMBEDDED_TARGET
        -DCUDA_CTK_VERSION=$CUDA_VERSION
    - echo "Building the project"
    - make -j$(nproc)
    - echo "Cross-build completed successfully"
    - echo "Pipeline end time:$(date)"
