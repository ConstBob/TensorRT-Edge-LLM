# ==============================================================================
# SONARQUBE JOBS
# ==============================================================================

get-binaries:
  stage: get-binaries
  image: gcc
  
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"

  artifacts:
    paths:
      - sonar-scanner/
    expire_in: 1 hour
      
  script:
    # Download sonar-scanner
    - if [ ! -d sonar-scanner ]; then
        curl -sSLo ./sonar-scanner.zip 'https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.2.0.4584-linux-x64.zip' &&
        unzip -o sonar-scanner.zip &&
        mv sonar-scanner-6.2.0.4584-linux-x64 sonar-scanner;
      fi
    
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH =~ /^release/
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $L1 == "true"

build-coverage:
  stage: get-binaries
  timeout: 10 minutes
  variables:
    CUDA_VERSION: "13.0"
    TRT_CUDA_VERSION: "13.1"
    IMAGE: urm.nvidia.com/sw-tensorrt-docker/tensorrt-base:$TRT_BRANCH-native-x86_64-ubuntu24.04-cuda$CUDA_VERSION
    TRT_PACKAGE_DIR: "$EDGE_LLM_CACHE_DIR/trt_softwares/TensorRT-$TRT_VERSION/TensorRT-$TRT_VERSION.x86_64.cuda-$TRT_CUDA_VERSION"
  tags:
    - rtx5080-edgellm-nvks
  image: "$IMAGE"
  artifacts:
    paths:
      - build_coverage/sonarqube-coverage.xml
      - build_coverage/compile_commands.json
    expire_in: 1 hour
  script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt update -qq >/dev/null 2>&1
    - apt install -y -qq python3 python3-pip cmake git unzip >/dev/null 2>&1
    - git clone https://gitlab-master.nvidia.com/ftp/GitHubSync/googletest-mirror.git 3rdParty/googletest
    - git clone https://gitlab-master.nvidia.com/ftp/GitHubSync/json-mirror.git 3rdParty/nlohmannJson
    - pip3 install gcovr
    - scripts/run_coverage.sh --trt-package-dir "$TRT_PACKAGE_DIR" --cuda-version "$CUDA_VERSION"
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH =~ /^release/
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $L1 == "true"

build-sonar:
  stage: build-sonar
  timeout: 10 minutes
  variables:
    CUDA_VERSION: "13.0"
    IMAGE: urm.nvidia.com/sw-tensorrt-docker/tensorrt-base:$TRT_BRANCH-native-x86_64-ubuntu24.04-cuda$CUDA_VERSION
  image: "$IMAGE"
  needs:
    - get-binaries
    - job: build-coverage
      artifacts: true

  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update -qq && apt-get install -y -qq git g++ >/dev/null 2>&1

  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
      
  script: sonar-scanner/bin/sonar-scanner
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH =~ /^release/
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $L1 == "true"

sonarqube-vulnerability-report:
  stage: sonarqube-vulnerability-report
  image: gcc
  script:
    - 'curl -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/issues/gitlab_sast_export?projectKey=${SONARQUBE_PROJECT_KEY}&branch=${CI_COMMIT_BRANCH}&pullRequest=${CI_MERGE_REQUEST_IID}" -o gl-sast-sonar-report.json'
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH =~ /^release/
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $L1 == "true"
  artifacts:
    expire_in: 4 days
    reports:
      sast: gl-sast-sonar-report.json

