# ==============================================================================
# SONARQUBE JOBS
# ==============================================================================

.sonar_job:
  allow_failure: true
  rules:
    # Explicit L1 runs include Sonar even when the commit has [skip tests].
    - if: $L1 == "true"
    - if: $CI_COMMIT_MESSAGE =~ /\[skip tests\]/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /\[skip tests\]/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /(^|,)\[skip tests\](,|$)/
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH =~ /^release/
    - if: $CI_COMMIT_BRANCH == 'main'

.sonar_root_job:
  extends: .sonar_job
  needs:
    - job: pre_commit_checks
      artifacts: false
    - job: ci_script_tests
      artifacts: false

get-binaries:
  stage: sonar
  extends: .sonar_root_job
  image: gcc
  
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"

  artifacts:
    paths:
      - sonar-scanner/
    expire_in: 4 hours
      
  script:
    # Download sonar-scanner
    - |
      if [ ! -d sonar-scanner ]; then
        bash .gitlab/ci/scripts/ci_run.sh \
          "$CI_DOWNLOAD_TIMEOUT_SECONDS" "Download Sonar scanner" -- \
          curl --fail --location --show-error \
            --output ./sonar-scanner.zip \
            'https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-8.1.0.6389-linux-x64.zip'
        unzip -o sonar-scanner.zip
        mv sonar-scanner-8.1.0.6389-linux-x64 sonar-scanner
      fi
    
build-sonar:
  stage: sonar
  extends: .sonar_job
  timeout: 20 minutes
  needs:
    - job: pre_commit_checks
      artifacts: false
    - job: ci_script_tests
      artifacts: false
    - job: get-binaries
      artifacts: true
    - job: build_cutedsl_docker_matrix
      artifacts: true
  variables:
    CUDA_VERSION: "13.0"
    TRT_CUDA_VERSION: "13.2"
    CUTE_DSL_ARTIFACT_TAG: "sm_120"
    CI_APT_INSTALL_TIMEOUT_SECONDS: "300"
    CI_PIP_INSTALL_TIMEOUT_SECONDS: "300"
    CUTE_DSL_ARTIFACT_TAG: "sm_120"
    IMAGE: urm.nvidia.com/sw-tensorrt-docker/tensorrt-base:$TRT_BRANCH-native-x86_64-ubuntu24.04-cuda$CUDA_VERSION
    TRT_PACKAGE_DIR: "$EDGE_LLM_CACHE_DIR/trt_softwares/TensorRT-$TRT_VERSION/TensorRT-$TRT_VERSION.x86_64.cuda-$TRT_CUDA_VERSION"
  tags:
    - rtx5080-edgellm-nvks
  image: "$IMAGE"
  artifacts:
    paths:
      - build_coverage/sonarqube-coverage.xml
      - build_coverage/compile_commands.json
      - .scannerwork/report-task.txt
    expire_in: 4 hours
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
  script:
    - bash .gitlab/ci/scripts/ci_apt.sh install python3 python3-pip cmake git unzip
    - bash .gitlab/ci/scripts/ci_run.sh "$CI_GIT_TIMEOUT_SECONDS" "Clone GoogleTest" -- git clone https://gitlab-master.nvidia.com/ftp/GitHubSync/googletest-mirror.git 3rdParty/googletest
    - bash .gitlab/ci/scripts/ci_run.sh "$CI_GIT_TIMEOUT_SECONDS" "Clone nlohmann JSON" -- git clone https://gitlab-master.nvidia.com/ftp/GitHubSync/json-mirror.git 3rdParty/nlohmannJson
    - bash .gitlab/ci/scripts/ci_run.sh "$CI_PIP_INSTALL_TIMEOUT_SECONDS" "Install gcovr" -- pip3 install gcovr
    - scripts/run_coverage.sh --trt-package-dir "$TRT_PACKAGE_DIR" --cuda-version "$CUDA_VERSION"
    - sonar-scanner/bin/sonar-scanner

sonar-results:
  stage: sonar
  extends: .sonar_job
  image: python:3.12-slim-bookworm
  timeout: 10 minutes
  tags:
    - cpu-k8s
  needs:
    - job: build-sonar
      artifacts: true
  variables:
    SONAR_RESULTS_TIMEOUT_SECONDS: "300"
  script:
    - python3 .gitlab/ci/scripts/sonar_results.py --timeout-seconds "$SONAR_RESULTS_TIMEOUT_SECONDS"
  artifacts:
    when: always
    expire_in: 4 days
    reports:
      sast: gl-sast-sonar-report.json
