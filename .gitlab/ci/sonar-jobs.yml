# ==============================================================================
# SONARQUBE JOBS
# ==============================================================================

.sonar_job:
  allow_failure: false
  rules:
    - if: $CI_TELEMETRY_CLEANUP == "1"
      when: never
    # Explicit L1 runs include Sonar even when an MR requests [skip tests].
    - if: $L1 == "true"
    - if: $EDGE_LLM_SKIP_TESTS == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH =~ /^release/
    - if: $CI_COMMIT_BRANCH == 'main'

.sonar_root_job:
  extends: .sonar_job
  needs:
    - job: pre_commit_checks
      artifacts: false
    - job: ci_script_tests
      artifacts: false

get-sonar-scanner:
  stage: sonar
  extends:
    - .sonar_root_job
    - .cpu_runner_retry
  image:
    name: artifactory.nvidia.com/docker-remote/sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  tags:
    - cpu-k8s
  artifacts:
    when: always
    paths:
      - sonar-scanner/
      - sonar-jre/
      - sonar-scanner.status
      - .ci-telemetry-artifact/
    expire_in: 1 day

  script:
    - >-
      sh .gitlab/ci/scripts/ci_run.sh 0 "Prepare SonarScanner" --
      sh .gitlab/ci/scripts/prepare_sonar_scanner.sh


build-sonar:
  stage: sonar
  extends:
    - .ci_test_submodules
    - .sonar_job
  # Scanner acquisition and SonarQube outages use EX_TEMPFAIL.
  allow_failure:
    exit_codes: 75
  timeout: 45 minutes
  needs:
    - job: pre_commit_checks
      artifacts: false
    - job: ci_script_tests
      artifacts: false
    - job: get-sonar-scanner
      artifacts: true
    - job: build_cutedsl_docker_matrix
      artifacts: true
  variables:
    CUDA_VERSION: "13.0"
    TRT_CUDA_VERSION: "13.2"
    ENABLE_CUTE_DSL: ALL
    CUTE_DSL_ARTIFACT_TAG: "sm_80"
    CI_PIP_INSTALL_TIMEOUT_SECONDS: "300"
    IMAGE: artifactory.nvidia.com/sw-tensorrt-docker-local/tensorrt-base:$TRT_BRANCH-native-x86_64-ubuntu24.04-cuda$CUDA_VERSION
    TRT_PACKAGE_DIR: "$EDGE_LLM_CACHE_DIR/trt_softwares/TensorRT-$TRT_VERSION/TensorRT-$TRT_VERSION.x86_64.cuda-$TRT_CUDA_VERSION"
  tags:
    - a30-edgellm-nvks
  image: "$IMAGE"
  artifacts:
    when: always
    paths:
      - build_coverage/sonarqube-coverage.xml
      - build_coverage/compile_commands.json
      - .scannerwork/report-task.txt
      - .ci-telemetry-artifact/
    expire_in: 4 hours
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
  script:
    - !reference [.ci_ccache_setup, script]
    - bash .gitlab/ci/scripts/ci_run.sh "$CI_PIP_INSTALL_TIMEOUT_SECONDS" "Install gcovr" -- pip3 install gcovr
    - >-
      sh .gitlab/ci/scripts/ci_run.sh "$CI_JOB_PHASE_TIMEOUT_SECONDS"
      "Generate coverage" -- scripts/run_coverage.sh
      --trt-package-dir "$TRT_PACKAGE_DIR" --cuda-version "$CUDA_VERSION"
      --ctest-regex
      "^(unitTestCommon|unitTestRuntime|unitTestRuntimeState|unitTestContextCache|unitTestPlugins|unitTestExamples)$"
    - |
      if ! grep -qx ready sonar-scanner.status; then
        echo "WARNING: SonarScanner is unavailable; skipping source analysis"
        exit 75 # EX_TEMPFAIL
      fi
      export JAVA_HOME="$CI_PROJECT_DIR/sonar-jre"
      export PATH="$JAVA_HOME/bin:$PATH"
      sonar_server_url="$(sed -n 's/^sonar\.host\.url=//p' sonar-project.properties)"
      sh .gitlab/ci/scripts/ci_run.sh "$CI_JOB_PHASE_TIMEOUT_SECONDS" \
        "Run Sonar analysis" -- python3 .gitlab/ci/scripts/ci_sonar_scan.py \
        "$sonar_server_url" sonar-scanner/bin/sonar-scanner

sonar-results:
  stage: sonar
  extends:
    - .sonar_job
    - .cpu_runner_retry
  allow_failure: true
  image: python:3.12-slim-bookworm
  timeout: 10 minutes
  tags:
    - cpu-k8s
  needs:
    - job: build-sonar
      artifacts: true
  variables:
    SONAR_RESULTS_TIMEOUT_SECONDS: "300"
  script:
    - >-
      sh .gitlab/ci/scripts/ci_run.sh "$SONAR_RESULTS_TIMEOUT_SECONDS"
      "Collect Sonar results" -- python3 .gitlab/ci/scripts/sonar_results.py
      --timeout-seconds "$SONAR_RESULTS_TIMEOUT_SECONDS"
  artifacts:
    when: always
    expire_in: 4 days
    paths:
      - .ci-telemetry-artifact/
    reports:
      sast: gl-sast-sonar-report.json
