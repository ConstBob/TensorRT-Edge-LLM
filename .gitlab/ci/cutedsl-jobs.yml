# ==============================================================================
# CUTEDSL ARTIFACT JOBS
# ==============================================================================

.cutedsl_artifact_rules:
  rules:
    - if: $CI_TELEMETRY_CLEANUP == "1"
      when: never
    # Explicit suites need these artifacts even when an MR requests [skip tests].
    - if: $L1 == "true"
    - if: $CI_PIPELINE_SOURCE == "schedule" && $L0_STABILITY == "true"
    - if: $EDGE_LLM_SKIP_TESTS == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^release/
    - if: >-
        $CI_PIPELINE_SOURCE == "web" &&
        $CI_COMMIT_BRANCH =~ /^rehearsal\// &&
        $CI_COMMIT_REF_PROTECTED == "true" &&
        $EDGELLM_WHEEL_RELEASE_REHEARSAL == "true"

.cutedsl_builder_version:
  variables:
    # Developers bump the component version manually. The explicit prefix
    # scopes project-wide registry cleanup to these ephemeral images, while the
    # pipeline ID isolates concurrent pipelines.
    CUTE_DSL_BUILDER_VERSION: "4.7.0"
    CUTE_DSL_BUILDER_TAG: "cutedsl-$CUTE_DSL_BUILDER_VERSION-pipeline-$CI_PIPELINE_ID"
    CUTE_DSL_BUILDER_IMAGE: "$CI_REGISTRY_IMAGE/cutedsl-kernel-builder:$CUTE_DSL_BUILDER_TAG"
    CUTE_DSL_BUILDER_CACHE_IMAGE: "$CI_REGISTRY_IMAGE/cutedsl-kernel-builder-cache:buildkit"

.cutedsl_artifact_base:
  stage: setup
  extends:
    - .cutedsl_artifact_rules
  interruptible: true

build_cutedsl_docker_image:
  stage: setup
  extends:
    - .cutedsl_artifact_rules
    - .cpu_runner_retry
    - .cutedsl_builder_version
  tags:
    - cpu-k8s
  image:
    name: "moby/buildkit:rootless"
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: "--oci-worker-no-process-sandbox"
  script:
    - test "$CI_REGISTRY" = "gitlab-master.nvidia.com:5005"
    - test -n "$CI_REGISTRY_USER" && test -n "$CI_REGISTRY_PASSWORD"
    - |
      registry_auth="$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
      mkdir -p "$HOME/.docker"
      printf '{"auths":{"%s":{"auth":"%s"}}}' \
        "$CI_REGISTRY" "$registry_auth" > "$HOME/.docker/config.json"
    - |
      sh "$CI_PROJECT_DIR/.gitlab/ci/scripts/ci_run.sh" 0 \
        "Build and publish CuTeDSL image" -- buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local "context=$CI_PROJECT_DIR/kernelSrcs" \
        --local "dockerfile=$CI_PROJECT_DIR/kernelSrcs" \
        --opt "filename=Dockerfile.cutedsl" \
        --opt "build-arg:CUTE_DSL_BUILDER_VERSION=$CUTE_DSL_BUILDER_VERSION" \
        --import-cache "type=registry,ref=$CUTE_DSL_BUILDER_CACHE_IMAGE" \
        --export-cache "type=registry,ref=$CUTE_DSL_BUILDER_CACHE_IMAGE,mode=max" \
        --output "type=image,name=$CUTE_DSL_BUILDER_IMAGE,push=true"
  after_script:
    - !reference [.cleanup_engine_storage, after_script]
    - !reference [.record_runner_usage, after_script]
  interruptible: true

build_cutedsl_docker_matrix:
  extends:
    - .cutedsl_artifact_base
    - .cpu_runner_retry
    - .cutedsl_builder_version
  needs:
    - job: build_cutedsl_docker_image
  # AOT generation is GPU-free (explicit target archs + storage-free
  # descriptors), so the kernel matrix runs on a CPU runner.
  tags:
    - cpu-k8s
  image:
    name: "$CUTE_DSL_BUILDER_IMAGE"
    entrypoint: [""]
  variables:
    CUTE_DSL_OUTPUT_DIR: "$CI_PROJECT_DIR/cutedsl-out/artifacts"
    CUTE_DSL_PREBUILT_DIR: "$CI_PROJECT_DIR/kernelSrcs/cuteDSLPrebuilt"
    # Bound GPU-side AOT compilation below the A30 memory capacity.
    CUTE_DSL_JOBS: "32"
  script:
    - echo "Pipeline start time:$(date)"
    - 'echo "Runner node:${NODE_NAME:-$(hostname)}"'
    - echo "CuTe DSL AOT generation is GPU-free (explicit target archs + storage-free descriptors); no GPU runner required"
    - >-
      sh "$CI_PROJECT_DIR/.gitlab/ci/scripts/ci_run.sh" 0
      "Build CuTeDSL kernel matrix" --
      bash /workspace/kernelSrcs/build_cutedsl_tarballs.sh
    - compgen -G "$CUTE_DSL_PREBUILT_DIR/cutedsl_*.tar.gz" >/dev/null
    - (cd "$CUTE_DSL_PREBUILT_DIR" && sha256sum -c cutedsl_*.tar.gz.sha256)
    - ls -lh "$CUTE_DSL_PREBUILT_DIR"/cutedsl_*.tar.gz*
    - echo "Pipeline end time:$(date)"
  after_script:
    - !reference [.cleanup_engine_storage, after_script]
    - !reference [.record_runner_usage, after_script]
  artifacts:
    name: "cutedsl-matrix-${CI_COMMIT_SHORT_SHA}"
    expire_in: 30 days
    paths:
      - kernelSrcs/cuteDSLPrebuilt/*.tar.gz
      - kernelSrcs/cuteDSLPrebuilt/*.tar.gz.sha256
      - .ci-telemetry-artifact/

# Wheel kernels use a distinct output namespace; internal test kernels are unchanged.
build_oss_cutedsl_docker_matrix:
  extends: [build_cutedsl_docker_matrix, .wheel_rules]
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git
  script:
    - >-
      sh "$CI_PROJECT_DIR/.gitlab/ci/scripts/ci_run.sh" 0
      "Build OSS wheel CuTeDSL kernels" --
      python3 "$CI_PROJECT_DIR/packaging/wheel_cli.py" build-oss-cutedsl
      --output-dir "$CI_PROJECT_DIR/kernelSrcs/cuteDSLOssPrebuilt"
  artifacts:
    name: "cutedsl-oss-matrix-${CI_COMMIT_SHORT_SHA}"
    expire_in: 30 days
    paths:
      - kernelSrcs/cuteDSLOssPrebuilt/
      - .ci-telemetry-artifact/
