# ==============================================================================
# CUTEDSL ARTIFACT JOBS
# ==============================================================================

.cutedsl_artifact_rules:
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[skip tests\]/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /\[skip tests\]/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /(^|,)\[skip tests\](,|$)/
      when: never
    - if: $L1 == "true"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^release/

.cutedsl_builder_version:
  variables:
    # Developers bump the component version manually when needed. Each pipeline
    # appends its unique ID so concurrent pipelines cannot overwrite or consume
    # one another's builder image.
    CUTE_DSL_BUILDER_VERSION: "4.6.1"
    CUTE_DSL_BUILDER_TAG: "$CUTE_DSL_BUILDER_VERSION-$CI_PIPELINE_ID"
    CUTE_DSL_BUILDER_IMAGE: "$CI_REGISTRY_IMAGE/cutedsl-kernel-builder:$CUTE_DSL_BUILDER_TAG"

.cutedsl_artifact_base:
  stage: setup
  extends:
    - .cutedsl_artifact_rules
  interruptible: true

build_cutedsl_docker_image:
  stage: precheck
  extends:
    - .cutedsl_artifact_rules
    - .cutedsl_builder_version
  tags:
    - cpu-k8s
  image:
    name: "gcr.io/kaniko-project/executor:debug"
    entrypoint: [""]
  script:
    - test "$CI_REGISTRY" = "gitlab-master.nvidia.com:5005"
    - test -n "$CI_REGISTRY_USER" && test -n "$CI_REGISTRY_PASSWORD"
    - |
      registry_auth="$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
      mkdir -p /kaniko/.docker
      printf '{"auths":{"%s":{"auth":"%s"}}}' \
        "$CI_REGISTRY" "$registry_auth" > /kaniko/.docker/config.json
    - |
      /kaniko/executor \
        --context "$CI_PROJECT_DIR/kernelSrcs" \
        --dockerfile "$CI_PROJECT_DIR/kernelSrcs/Dockerfile.cutedsl" \
        --build-arg "CUTE_DSL_BUILDER_VERSION=$CUTE_DSL_BUILDER_VERSION" \
        --cache=false \
        --destination "$CUTE_DSL_BUILDER_IMAGE"
  after_script:
    - !reference [.record_runner_usage, after_script]
  interruptible: true

build_cutedsl_docker_matrix:
  extends:
    - .cutedsl_artifact_base
    - .cutedsl_builder_version
  needs:
    - job: build_cutedsl_docker_image
  tags:
    - rtx5090-edgellm-nvks
  image:
    name: "$CUTE_DSL_BUILDER_IMAGE"
    entrypoint: [""]
  variables:
    CUTE_DSL_OUTPUT_DIR: "$CI_PROJECT_DIR/cutedsl-out/artifacts"
    CUTE_DSL_PREBUILT_DIR: "$CI_PROJECT_DIR/kernelSrcs/cuteDSLPrebuilt"
  script:
    - echo "Pipeline start time:$(date)"
    - 'echo "Runner node:${NODE_NAME:-$(hostname)}"'
    - nvidia-smi
    - bash /workspace/kernelSrcs/build_cutedsl_tarballs.sh
    - compgen -G "$CUTE_DSL_PREBUILT_DIR/cutedsl_*.tar.gz" >/dev/null
    - (cd "$CUTE_DSL_PREBUILT_DIR" && sha256sum -c cutedsl_*.tar.gz.sha256)
    - ls -lh "$CUTE_DSL_PREBUILT_DIR"/cutedsl_*.tar.gz*
    - echo "Pipeline end time:$(date)"
  after_script:
    - !reference [.record_runner_usage, after_script]
  artifacts:
    name: "cutedsl-matrix-${CI_COMMIT_SHORT_SHA}"
    expire_in: 30 days
    paths:
      - kernelSrcs/cuteDSLPrebuilt/*.tar.gz
      - kernelSrcs/cuteDSLPrebuilt/*.tar.gz.sha256

cleanup_cutedsl_docker_image:
  stage: .post
  extends:
    - .cutedsl_artifact_rules
    - .cutedsl_builder_version
  needs:
    - job: build_cutedsl_docker_matrix
      artifacts: false
  tags:
    - cpu-k8s
  image:
    name: "gcr.io/go-containerregistry/crane:debug"
    entrypoint: [""]
  script:
    - test -n "$CI_REGISTRY_USER" && test -n "$CI_REGISTRY_PASSWORD"
    - crane auth login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password "$CI_REGISTRY_PASSWORD"
    - crane delete "$CUTE_DSL_BUILDER_IMAGE"
  when: always
  interruptible: false
