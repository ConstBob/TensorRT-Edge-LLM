publish_cutedsl_artifacts:
  stage: publish
  extends:
    - .cutedsl_artifact_rules
  tags:
    - a30-edgellm-nvks
  image: "ubuntu:24.04"
  dependencies:
    - build_cutedsl_gb10_artifact
    - build_cutedsl_sm110_artifact
    - build_cutedsl_x86_sm120_artifact
    - build_cutedsl_sm87_cuda13_artifact
  script:
    - echo "Pipeline start time:$(date)"
    - 'echo "Node name:${NODE_NAME:-$(hostname)}"'
    - |
      set -eu
      set -- cutedsl_*.tar.gz
      test -f "$1"
      test "$#" -eq 4

      artifact_root="${EDGE_LLM_CACHE_DIR}/cutedsl_artifacts"
      if [ -n "${CI_MERGE_REQUEST_IID:-}" ]; then
        publish_root="$artifact_root/MR_${CI_MERGE_REQUEST_IID}/${CI_PIPELINE_ID}"
        latest_root=""
      else
        branch_root="$artifact_root/${CI_COMMIT_REF_SLUG}"
        publish_root="$branch_root/${CI_COMMIT_SHORT_SHA}"
        latest_root="$branch_root/latest"
      fi

      publish_tmp="${publish_root}.tmp.${CI_PIPELINE_ID}"
      rm -rf "$publish_tmp"
      mkdir -p "$publish_tmp"

      for tarball in "$@"; do
        checksum="$tarball.sha256"
        tag="$(printf '%s\n' "$tarball" | sed -E 's/^cutedsl_.*_(sm_[0-9]+)_cuda[0-9]+\.tar\.gz$/\1/')"
        test "$tag" != "$tarball"
        test -f "$checksum"
        dest="$publish_tmp/$tag"
        mkdir -p "$dest"
        cp "$tarball" "$checksum" "$dest/"
        (cd "$dest" && sha256sum -c "$(basename "$checksum")")
      done

      printf '%s\n' "$CI_COMMIT_SHA" > "$publish_tmp/commit_sha"
      printf '%s\n' "$CI_PIPELINE_ID" > "$publish_tmp/pipeline_id"
      rm -rf "$publish_root"
      mv "$publish_tmp" "$publish_root"

      if [ -n "${latest_root:-}" ]; then
        latest_tmp="${latest_root}.tmp.${CI_PIPELINE_ID}"
        rm -rf "$latest_tmp"
        mkdir -p "$latest_tmp"
        cp -a "$publish_root/." "$latest_tmp/"
        rm -rf "$latest_root"
        mv "$latest_tmp" "$latest_root"
      fi

      echo "Published $# CuTeDSL package(s) under $publish_root"
      find "$publish_root" -maxdepth 2 -type f -print | sort
      if [ -n "${latest_root:-}" ]; then
        echo "Updated latest directory: $latest_root"
        find "$latest_root" -maxdepth 2 -type f -print | sort
      fi
    - echo "Pipeline end time:$(date)"
  interruptible: true
