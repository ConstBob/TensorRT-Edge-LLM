# ==============================================================================
# SETUP JOBS
# ==============================================================================

init_l0_storage:
  stage: setup
  script:
    - python3 .gitlab/ci/scripts/ci_storage.py prepare-storage
  resource_group: "$L0_STORAGE_RESOURCE_GROUP"
  environment:
    name: "$L0_ENVIRONMENT_NAME"
    action: start
    on_stop: delete_l0_storage
    auto_stop_in: "$L0_STORAGE_RETENTION"
  extends:
    - .l0_storage_lifecycle
    - .l0_rules

prune_l0_pipeline_workspaces:
  stage: setup
  script:
    - python3 .gitlab/ci/scripts/ci_storage.py prune-pipeline-workspaces
  resource_group: "${L0_STORAGE_RESOURCE_GROUP}-prune"
  extends:
    - .l0_storage_lifecycle
    - .l0_rules
  interruptible: true
  allow_failure: true

delete_l0_storage:
  stage: setup
  when: manual
  allow_failure: true
  interruptible: false
  dependencies: []
  script:
    - python3 .gitlab/ci/scripts/ci_storage.py delete-storage
  resource_group: "$L0_STORAGE_RESOURCE_GROUP"
  environment:
    name: "$L0_ENVIRONMENT_NAME"
    action: stop
  extends:
    - .l0_storage_lifecycle
    - .l0_rules

prune_github_pr_storage:
  stage: setup
  tags:
    - a30-edgellm-nvks
  script:
    - echo "Removing GitHub PR cache directories older than 3 days..."
    - find "$EDGE_LLM_CACHE_DIR/L0" -maxdepth 1 -type d -name "github_pr_*" -mtime +3 -exec rm -rf {} \; -print || true
  extends: .l0_rules
  interruptible: true
  allow_failure: true

# Cache cleanup for L1 directory
l1_cache_cleanup:
  stage: setup
  tags:
    - a30-edgellm-nvks
  script:
    - echo "Pipeline start time:$(date)"
    - 'echo "Node name: ${NODE_NAME:-$(hostname)}"'
    - echo "Starting cache cleanup for L1 directories older than 7 days in $EDGE_LLM_CACHE_DIR/L1"
    - echo "Current contents in $EDGE_LLM_CACHE_DIR/L1:"
    - ls -la "$EDGE_LLM_CACHE_DIR/L1" || echo "Directory is empty or inaccessible"
    - echo "Removing directories older than 7 days..."
    - find "$EDGE_LLM_CACHE_DIR/L1" -maxdepth 1 -type d -mtime +7 -not -path "$EDGE_LLM_CACHE_DIR/L1" -exec rm -rf {} \; -print
    - echo "Cleanup completed. Remaining contents in $EDGE_LLM_CACHE_DIR/L1:"
    - ls -la "$EDGE_LLM_CACHE_DIR/L1" || echo "Directory is empty or inaccessible"
    - echo "Pipeline end time:$(date)"
  extends: .l1_rules
  interruptible: true
