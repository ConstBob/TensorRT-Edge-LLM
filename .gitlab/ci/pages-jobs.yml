# ==============================================================================
# PAGES/DOCUMENTATION JOBS
# ==============================================================================

# Main pages job for main and release branches
pages:
  extends: .cpu_runner_retry
  image: 
    name: python:3.12-bookworm
    entrypoint: ['/bin/bash']
  stage: setup
  tags:
    - cpu-k8s
  before_script:
  - bash "$CI_PROJECT_DIR/.gitlab/ci/scripts/ci_run.sh" "$CI_DOWNLOAD_TIMEOUT_SECONDS" "Download Doxygen" -- wget https://www.doxygen.nl/files/doxygen-1.14.0.linux.bin.tar.gz
  - tar -xzf doxygen-1.14.0.linux.bin.tar.gz
  - cd doxygen-1.14.0
  - make install && cd ..
  script:
  - mkdir public
  - cd docs
  - bash "$CI_PROJECT_DIR/.gitlab/ci/scripts/ci_run.sh" "$CI_PIP_INSTALL_TIMEOUT_SECONDS" "Install documentation dependencies" -- pip install -r requirements.txt
  - doxygen
  - echo "Sphinx is building documentation now... "
  - sphinx-build -M html ./source/ ./build --silent > doc_build.log 2>&1
  - cp -r build/html/* ../public/
  variables:
    ENV_NAME: $CI_COMMIT_REF_NAME
    URL_SLUG: $CI_COMMIT_REF_SLUG
  rules:
    - if: $CI_TELEMETRY_CLEANUP == "1"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      variables:
        URL_SLUG: ""
    - if: $CI_COMMIT_BRANCH =~ /^release/
  artifacts:
    paths:
    - public
    - docs/doc_build.log
    - .ci-telemetry-artifact/
    name: TensorRT_EdgeLLM_API_Reference
    when: always
    expire_in: 3 days
  pages:
    path_prefix: ${URL_SLUG}
    expire_in: never
  environment:
    name: ${ENV_NAME}
    url: $CI_PAGES_URL/${URL_SLUG}
  allow_failure: true
  timeout: 3h

# Merge request pages preview (triggers downstream pipeline)
merge_request_pages_preview:
  stage: setup
  trigger:
    include:
      - local: .gitlab/ci/pages-merge-request.yml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
