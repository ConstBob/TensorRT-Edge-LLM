ci_telemetry_cleanup:
  stage: setup
  image:
    name: python:3.12-alpine
    entrypoint: [""]
  tags:
    - cpu-k8s
  variables:
    CI_TELEMETRY_ENABLED: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_TELEMETRY_CLEANUP == "1"
  resource_group: ci-telemetry-cleanup
  interruptible: false
  script:
    - >-
      python3 "$CI_PROJECT_DIR/.gitlab/ci/scripts/ci_telemetry_cleanup.py"
      --root "$RUNNER_USAGE_DIR" --max-age-days 30 --active-grace-hours 24

ci_telemetry_report:
  stage: report
  image:
    name: python:3.12-slim-bookworm
    entrypoint: [""]
  tags:
    - cpu-k8s
  rules:
    - if: $CI_TELEMETRY_CLEANUP == "1"
      when: never
    - if: $CI_TELEMETRY_ENABLED == "0"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $L1 == "true"
      when: always
    - if: $CI_PIPELINE_SOURCE == "schedule" && $L0_STABILITY == "true"
      when: always
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - if: $CI_COMMIT_BRANCH =~ /^release/
      when: always
  dependencies: []
  allow_failure: true
  interruptible: true
  script:
    - >-
      python3 .gitlab/ci/scripts/ci_telemetry_report.py
      --api-url "$CI_API_V4_URL"
      --project-id "$CI_PROJECT_ID"
      --pipeline-id "$CI_PIPELINE_ID"
      --runner-usage-root "$RUNNER_USAGE_DIR"
      --output-dir "$CI_PROJECT_DIR/ci-artifacts/telemetry/report"
      --exclude-job-id "$CI_JOB_ID"
  artifacts:
    when: always
    expire_in: 180 days
    expose_as: "CI telemetry report"
    paths:
      - ci-artifacts/telemetry/report/
    reports:
      metrics: ci-artifacts/telemetry/report/metrics.txt
