.wheel_rules:
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^release/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: &wheel_changes
        - .gitmodules
        - .gitlab/ci/wheel-jobs.yml
        - .gitlab/ci/wheel-generated.yml
        - .gitlab/ci/wheel-qualification.toml
        - .gitlab/ci/scripts/wheel_ci.py
        - .gitlab/ci/scripts/wheel_ci_lib/**/*
        - .gitlab/ci/scripts/wheel_ci.sh
        - packaging/**/*
        - tensorrt_edgellm/_native/**/*
        - tensorrt_edgellm/runtime.py
        - CMakeLists.txt
        - pyproject.toml
        - cpp/**/*
        - cmake/**/*
        - experimental/builder/**/*
        - experimental/pybind/**/*
        - examples/python/installed_wheel_build_and_infer.py
        - kernelSrcs/**/*

wheel_packaging_precheck:
  stage: precheck
  extends: [.wheel_rules]
  tags: [cpu-k8s]
  image: python:3.12-bookworm
  script:
    - sh .gitlab/ci/scripts/wheel_ci.sh ci-precheck
  artifacts:
    paths: [artifacts/provenance/source.json]
    expire_in: 30 days

wheel_python_base:
  stage: wheel-build
  extends: [.wheel_rules]
  tags: [cpu-k8s]
  parallel:
    matrix:
      - PYTHON_IMAGE: python:3.10-slim-bookworm
        PYTHON_ABI: cp310
      - PYTHON_IMAGE: python:3.11-slim-bookworm
        PYTHON_ABI: cp311
      - PYTHON_IMAGE: python:3.12-slim-bookworm
        PYTHON_ABI: cp312
  image: $PYTHON_IMAGE
  needs:
    - job: wheel_packaging_precheck
      artifacts: true
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git
    - python -m pip install "tomli==2.3.0; python_version < '3.11'"
  script:
    - sh .gitlab/ci/scripts/wheel_ci.sh ci-build-base
  artifacts:
    paths: [artifacts/base/]
    expire_in: 14 days

.wheel_payload_template:
  stage: wheel-build
  extends: [.wheel_rules]
  tags: [$BUILD_RUNNER_TAG]
  image: $BUILD_IMAGE
  needs:
    - job: wheel_packaging_precheck
      artifacts: true
    - job: build_cutedsl_docker_matrix
      artifacts: true
  script:
    - sh .gitlab/ci/scripts/wheel_ci.sh ci-build-payload
  timeout: 2h
  artifacts:
    paths: [artifacts/payloads/]
    expire_in: 14 days

wheel_assemble:
  stage: wheel-assemble
  extends: [.wheel_rules]
  tags: [cpu-general-k8s]
  image: $WHEEL_IMAGE_UBUNTU2404_CU13
  needs:
    - job: wheel_python_base
      artifacts: true
    - job: wheel_native_payloads
      artifacts: true
  script:
    - sh .gitlab/ci/scripts/wheel_ci.sh ci-assemble
  timeout: 2h
  artifacts:
    paths: [dist/]
    expire_in: 30 days

.wheel_integration_template:
  stage: l0_test
  extends: [.wheel_rules]
  tags: [$TEST_RUNNER_TAG]
  image: $TEST_IMAGE
  variables:
    LLM_MODELS_DIR: "$TORCH_DIR"
  needs:
    - job: wheel_assemble
      artifacts: true
  script:
    - sh .gitlab/ci/scripts/wheel_ci.sh ci-integration
  timeout: 4h
  interruptible: true
  artifacts:
    when: always
    paths: [artifacts/integration/]
    expire_in: 30 days

wheel_integration_gate:
  stage: l0_test
  extends: [.wheel_rules]
  tags: [cpu-k8s]
  image: python:3.12-bookworm
  needs:
    - job: wheel_assemble
      artifacts: true
    - job: wheel_integration
      artifacts: true
  script:
    - sh .gitlab/ci/scripts/wheel_ci.sh ci-integration-gate
  artifacts:
    paths: [artifacts/integration/gate.json]
    expire_in: 90 days
