.wheel_rules:
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^release/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: &wheel_changes
        - .gitmodules
        - .gitlab/ci/wheel-jobs.yml
        - .gitlab/ci/wheel-generated.yml
        - packaging/**/*
        - tensorrt_edgellm/_native/**/*
        - tensorrt_edgellm/runtime.py
        - CMakeLists.txt
        - pyproject.toml
        - cpp/**/*
        - cmake/**/*
        - experimental/builder/**/*
        - experimental/pybind/**/*
        - examples/python/installed_wheel_build_and_infer.py
        - kernelSrcs/**/*

wheel_packaging_precheck:
  stage: precheck
  extends: [.wheel_rules]
  tags: [cpu-k8s]
  image: python:3.12-bookworm
  script:
    - python packaging/wheel_cli.py ci-precheck
  artifacts:
    paths: [artifacts/provenance/source.json]
    expire_in: 30 days

wheel_python_base:
  stage: wheel-build
  extends: [.wheel_rules]
  tags: [cpu-k8s]
  parallel:
    matrix:
      - PYTHON_IMAGE: python:3.10-slim-bookworm
        PYTHON_ABI: cp310
      - PYTHON_IMAGE: python:3.11-slim-bookworm
        PYTHON_ABI: cp311
      - PYTHON_IMAGE: python:3.12-slim-bookworm
        PYTHON_ABI: cp312
  image: $PYTHON_IMAGE
  needs:
    - job: wheel_packaging_precheck
      artifacts: true
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git
  script:
    - python packaging/wheel_cli.py ci-build-base
  artifacts:
    paths: [artifacts/base/]
    expire_in: 14 days

.wheel_payload_template:
  stage: wheel-build
  extends: [.wheel_rules]
  tags: [$RUNNER_TAG]
  image: $BUILD_IMAGE
  needs:
    - job: wheel_packaging_precheck
      artifacts: true
    - job: build_cutedsl_docker_matrix
      artifacts: true
  script:
    - python packaging/wheel_cli.py ci-build-payload
  artifacts:
    paths: [artifacts/payloads/]
    expire_in: 14 days

wheel_assemble:
  stage: wheel-assemble
  extends: [.wheel_rules]
  tags: [cpu-k8s]
  image: python:3.12-bookworm
  needs:
    - job: wheel_python_base
      artifacts: true
    - job: wheel_native_payloads
      artifacts: true
  parallel:
    matrix:
      - CPU_ARCH: [x86_64, aarch64]
        PYTHON_ABI: [cp310, cp311, cp312]
  script:
    - python packaging/wheel_cli.py ci-assemble
  artifacts:
    paths: [dist/]
    expire_in: 30 days

.wheel_integration_template:
  stage: l0_test
  extends: [.wheel_rules]
  tags: [$RUNNER_TAG]
  image: $BUILD_IMAGE
  needs:
    - job: wheel_assemble
      artifacts: true
  script:
    - python packaging/wheel_cli.py ci-integration
  timeout: 3h
  interruptible: true
  artifacts:
    when: always
    paths: [artifacts/integration/]
    expire_in: 30 days

wheel_heterogeneous_boundary:
  stage: l0_test
  extends: [.wheel_rules]
  tags: [$WHEEL_HETEROGENEOUS_RUNNER]
  image: $WHEEL_IMAGE_UBUNTU2404_CU13
  needs:
    - job: wheel_assemble
      artifacts: true
  variables:
    WHEEL_HETEROGENEOUS_TRT_PACKAGE_DIR: $WHEEL_TRT10_X86_UBUNTU2404_CU13_DIR
  script:
    - python packaging/wheel_cli.py ci-heterogeneous-boundary
  artifacts:
    paths: [artifacts/integration/heterogeneous-boundary.json]
    expire_in: 30 days

wheel_integration_gate:
  stage: l0_test
  extends: [.wheel_rules]
  tags: [cpu-k8s]
  image: python:3.12-bookworm
  needs:
    - job: wheel_assemble
      artifacts: true
    - job: wheel_integration
      artifacts: true
    - job: wheel_heterogeneous_boundary
      artifacts: true
  script:
    - python packaging/wheel_cli.py ci-integration-gate
  artifacts:
    paths: [artifacts/integration/gate.json]
    expire_in: 90 days
