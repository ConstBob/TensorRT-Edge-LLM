.wheel_rules:
  rules:
    - if: $CI_TELEMETRY_CLEANUP == "1"
      when: never
    - if: $EDGE_LLM_SKIP_TESTS == "true"
      when: never
    - if: $CI_COMMIT_BRANCH =~ /^release/
    - if: >-
        $CI_PIPELINE_SOURCE == "web" &&
        $CI_COMMIT_BRANCH =~ /^rehearsal\// &&
        $CI_COMMIT_REF_PROTECTED == "true" &&
        $EDGELLM_WHEEL_RELEASE_REHEARSAL == "true"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: &wheel_changes
        - .gitmodules
        - .gitlab/ci/wheel-jobs.yml
        - .gitlab/ci/wheel-generated.yml
        - .gitlab/ci/wheel-qualification.toml
        - .gitlab/ci/scripts/wheel_ci.py
        - .gitlab/ci/scripts/wheel_ci_lib/**/*
        - .gitlab/ci/scripts/wheel_ci.sh
        - .gitlab/ci/wheel-release-jobs.yml
        - .gitlab/ci/tests/test_wheel_release.py
        - packaging/cmake/**/*
        - packaging/docker/**/*
        - packaging/wheellib/**/*
        - packaging/dependency_allowlist.toml
        - packaging/size_budget.toml
        - packaging/variants.toml
        - packaging/wheel-*-requirements.txt
        - packaging/wheel_cli.py
        - tensorrt_edgellm/_native/**/*
        - tensorrt_edgellm/runtime.py
        - CMakeLists.txt
        - pyproject.toml
        - cpp/**/*
        - cmake/**/*
        - experimental/builder/**/*
        - experimental/pybind/**/*
        - examples/python/installed_wheel_build_and_infer.py
        - kernelSrcs/**/*

wheel_packaging_precheck:
  stage: precheck
  extends: [.wheel_rules]
  tags: [cpu-k8s]
  image: python:3.12-bookworm
  interruptible: true
  script:
    - sh .gitlab/ci/scripts/wheel_ci.sh ci-precheck
  artifacts:
    paths: [artifacts/provenance/source.json, .ci-telemetry-artifact/]
    expire_in: 30 days

wheel_python_base:
  stage: wheel-build
  extends: [.wheel_rules]
  tags: [cpu-k8s]
  parallel:
    matrix:
      - PYTHON_IMAGE: python:3.10-slim-bookworm
        PYTHON_ABI: cp310
      - PYTHON_IMAGE: python:3.11-slim-bookworm
        PYTHON_ABI: cp311
      - PYTHON_IMAGE: python:3.12-slim-bookworm
        PYTHON_ABI: cp312
  image: $PYTHON_IMAGE
  interruptible: true
  needs:
    - job: wheel_packaging_precheck
      artifacts: true
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git
    - python -m pip install "tomli==2.3.0; python_version < '3.11'"
  script:
    - sh .gitlab/ci/scripts/wheel_ci.sh ci-build-base
  artifacts:
    paths: [artifacts/base/, .ci-telemetry-artifact/]
    expire_in: 14 days

.wheel_payload_template:
  stage: wheel-build
  extends: [.wheel_rules]
  tags: [$BUILD_RUNNER_TAG]
  image: $BUILD_IMAGE
  interruptible: true
  needs:
    - job: wheel_packaging_precheck
      artifacts: true
    - job: build_cutedsl_docker_matrix
      artifacts: true
  cache:
    policy: pull-push
    key: "wheel-compiler-$BUILD_GROUP"
    paths: [venv/wheel-compiler-cache/]
  script:
    - sh .gitlab/ci/scripts/wheel_ci.sh ci-build-payload
  timeout: 2h
  artifacts:
    paths: [artifacts/payloads/, .ci-telemetry-artifact/]
    expire_in: 14 days

.wheel_assemble_template:
  stage: wheel-assemble
  extends: [.wheel_rules]
  tags: [cpu-general-k8s]
  image: $WHEEL_IMAGE_UBUNTU2404_CU13
  interruptible: true
  script:
    - sh .gitlab/ci/scripts/wheel_ci.sh ci-assemble
  timeout: 2h
  artifacts:
    paths: [dist/, .ci-telemetry-artifact/]
    expire_in: 30 days

.wheel_integration_template:
  stage: l0_test
  extends: [.wheel_rules]
  tags: [$TEST_RUNNER_TAG]
  image: $TEST_IMAGE
  variables:
    LLM_MODELS_DIR: "$TORCH_DIR"
  script:
    - sh .gitlab/ci/scripts/wheel_ci.sh ci-integration
  timeout: 4h
  interruptible: true
  artifacts:
    when: always
    paths: [artifacts/integration/, .ci-telemetry-artifact/]
    expire_in: 30 days

wheel_integration_gate:
  stage: l0_test
  extends: [.wheel_rules]
  tags: [cpu-k8s]
  image: python:3.12-bookworm
  interruptible: true
  needs:
    - job: wheel_assemble_x86
      artifacts: true
    - job: wheel_assemble_aarch64
      artifacts: true
    - job: wheel_integration_x86
      artifacts: true
    - job: wheel_integration_aarch64
      artifacts: true
  script:
    - sh .gitlab/ci/scripts/wheel_ci.sh ci-integration-gate
  artifacts:
    paths: [artifacts/integration/gate.json, .ci-telemetry-artifact/]
    expire_in: 90 days
