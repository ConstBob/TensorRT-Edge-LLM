# ==============================================================================
# PRECHECK JOBS
# ==============================================================================

.precheck_rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $L0_STABILITY == "true"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $L1 == "true"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^release/
    - if: $GITHUB_PR && $GITHUB_REPO

pre_commit_checks:
  extends:
    - .precheck_rules
  image:
    name: "python:3.12-bookworm"
    entrypoint: [""]
  stage: precheck
  allow_failure: false
  variables:
    CUDA_VERSION: "12.9"
    PRE_COMMIT_HOME: "$CI_PROJECT_DIR/.cache/pre-commit"
  tags:
    - cpu-k8s
  cache:
    policy: pull-push
    key:
      files:
        - .pre-commit-config.yaml
      prefix: "pre-commit"
    paths:
      - .cache/pre-commit/
  script:
    - 'echo "Node name: ${NODE_NAME:-$(hostname)}"'
    - echo "Installing pre-commit"
    - python3 -m venv venv && source venv/bin/activate
    - |
      bash .gitlab/ci/scripts/ci_run.sh \
        "$CI_PIP_INSTALL_TIMEOUT_SECONDS" "Install pre-commit" -- \
        pip3 install pre-commit
    - bash .gitlab/ci/scripts/ci_pre_commit.sh
    - echo "✅ Pre-commit checks passed!"
    - deactivate
    - echo "Pipeline end time:$(date)"
  interruptible: true

ci_script_tests:
  extends:
    - .gitlab_junit_report
    - .precheck_rules
  image:
    name: "python:3.12-slim-bookworm"
    entrypoint: [""]
  stage: precheck
  allow_failure: false
  variables:
    CUDA_VERSION: "12.9"
  tags:
    - cpu-k8s
  script:
    - 'echo "Node name: ${NODE_NAME:-$(hostname)}"'
    - echo "Installing dependencies"
    - python3 -m venv venv && source venv/bin/activate
    - bash .gitlab/ci/scripts/ci_run.sh "$CI_PIP_INSTALL_TIMEOUT_SECONDS" "Install CI test dependencies" -- pip3 install -r .gitlab/ci/tests/requirements.txt
    - export LLM_SDK_DIR="$CI_PROJECT_DIR"
    - mkdir -p "$CI_PROJECT_DIR/.ci-reports"
    - python3 -m pytest .gitlab/ci/tests -v --color=yes --junitxml="$CI_PROJECT_DIR/.ci-reports/ci_script_tests.xml"
    - deactivate
    - echo "Pipeline end time:$(date)"
  interruptible: true
