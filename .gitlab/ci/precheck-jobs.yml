# ==============================================================================
# PRECHECK JOBS
# ==============================================================================

.precheck_rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $L0_STABILITY == "true"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $L1 == "true"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^release/

pre_commit_checks:
  extends:
    - .precheck_rules
  stage: precheck
  allow_failure: false
  variables:
    CUDA_VERSION: "12.9"
  tags:
    - cpu-k8s
  script:
    - 'echo "Node name: ${NODE_NAME:-$(hostname)}"'
    - echo "Installing dependencies"
    - export DEBIAN_FRONTEND=noninteractive
    - apt update -qq >/dev/null 2>&1
    - apt install -y -qq python3 python3-pip python3-venv git >/dev/null 2>&1
    - echo "Installing pre-commit hooks"
    - python3 -m venv venv && source venv/bin/activate
    - pip3 install -q pre-commit
    - pre-commit install
    - echo "Running pre-commit checks on all files"
    - pre-commit run --all-files --show-diff-on-failure || (echo "❌ Pre-commit checks failed!" && echo "💡 To fix this locally, run:" && echo "   pip install pre-commit" && echo "   pre-commit install" && echo "   pre-commit run --all-files" && exit 1)
    - echo "✅ Pre-commit checks passed!"
    - deactivate
    - echo "Pipeline end time:$(date)"
  interruptible: true

ci_script_tests:
  extends:
    - .gitlab_junit_report
    - .precheck_rules
  stage: precheck
  allow_failure: false
  variables:
    CUDA_VERSION: "12.9"
  tags:
    - cpu-k8s
  script:
    - 'echo "Node name: ${NODE_NAME:-$(hostname)}"'
    - echo "Installing dependencies"
    - export DEBIAN_FRONTEND=noninteractive
    - apt update -qq >/dev/null 2>&1
    - apt install -y -qq python3 python3-pip python3-venv >/dev/null 2>&1
    - python3 -m venv venv && source venv/bin/activate
    - pip3 install -q 'pytest>=7.0.0'
    - export LLM_SDK_DIR="$CI_PROJECT_DIR"
    - mkdir -p "$CI_PROJECT_DIR/.ci-reports"
    - python3 -m pytest .gitlab/ci/tests -v --color=yes --junitxml="$CI_PROJECT_DIR/.ci-reports/ci_script_tests.xml"
    - deactivate
    - echo "Pipeline end time:$(date)"
  interruptible: true
