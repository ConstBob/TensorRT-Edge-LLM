# ==============================================================================
# LOCAL BOARD JOBS - Native build and unit tests on physical boards
# Shell executor, triggered on MRs and L0_STABILITY=true schedules
# ==============================================================================

# ------------------------------------------------------------------------------
# DGX Spark (GB10) - CUDA 13.0, TRT 10.14.1 (system-installed)
# ------------------------------------------------------------------------------
l0_local_spark_build_and_test:
  stage: l0_test
  tags:
    - local-spark
  variables:
    TRT_PACKAGE_DIR: "/usr"
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-artifacts/lib-size/
      - .ci-telemetry-artifact/
    reports:
      metrics: ci-artifacts/lib-size/lib_size_metrics.txt
  script:
    - echo "Pipeline start time:$(date)"
    - echo "Node name:$(hostname)"
    - echo "CUDA version:$(nvcc --version | grep release)"
    - echo "TRT version:$(dpkg -l | grep tensorrt-libs | awk '{print $3}')"
    - export PATH=/usr/local/cuda/bin:$PATH
    - export LD_LIBRARY_PATH=/usr/lib/aarch64-linux-gnu:$LD_LIBRARY_PATH
    - echo "Generating CuteDSL kernel artifacts (venv)"
    - python3 -m venv venv/cutedsl
    - bash .gitlab/ci/scripts/ci_run.sh "$CI_PIP_INSTALL_TIMEOUT_SECONDS" "Install CuTeDSL dependencies" -- venv/cutedsl/bin/pip install 'nvidia-cutlass-dsl[cu13]==4.7.0' cupy-cuda13x==13.6.0
    - >-
      sh .gitlab/ci/scripts/ci_run.sh "$CI_JOB_PHASE_TIMEOUT_SECONDS"
      "Build local Spark CuTeDSL kernels" --
      venv/cutedsl/bin/python kernelSrcs/build_cutedsl.py --kernels ALL
    - echo "Building project with unit tests"
    - rm -rf build && mkdir build && cd build
    - >-
      sh "$CI_PROJECT_DIR/.gitlab/ci/scripts/ci_run.sh"
      "$CI_JOB_PHASE_TIMEOUT_SECONDS" "Configure local Spark build" --
      cmake .. -DTRT_PACKAGE_DIR=$TRT_PACKAGE_DIR -DBUILD_UNIT_TESTS=ON
      -DENABLE_CUTE_DSL=ALL
      -DCMAKE_TOOLCHAIN_FILE=cmake/aarch64_linux_toolchain.cmake
      -DEMBEDDED_TARGET=gb10 -DCUDA_CTK_VERSION=13.0
    - >-
      sh "$CI_PROJECT_DIR/.gitlab/ci/scripts/ci_run.sh"
      "$CI_JOB_PHASE_TIMEOUT_SECONDS" "Build local Spark targets" --
      make -j$(nproc)
    - echo "Reporting library size"
    - python3 ../scripts/report_library_size.py
        --build-dir .
        --source-dir ..
        --label gb10
        --output-dir ../ci-artifacts/lib-size
        || echo "WARNING - library size report failed"
    - echo "Build completed. Running unit tests"
    # Each group is its own executable; ctest runs them and reports per-group.
    # Serial on purpose: these boards have far less device memory than an x86
    # dev box, and concurrent groups would contend for it. Locally, add
    # --parallel $(nproc).
    - >-
      sh "$CI_PROJECT_DIR/.gitlab/ci/scripts/ci_run.sh"
      "$CI_JOB_PHASE_TIMEOUT_SECONDS" "Run local Spark unit tests" --
      ctest --output-on-failure
    - echo "Pipeline end time:$(date)"
  extends:
    - .ci_internal_submodules
    - .l0_rules
  interruptible: true

l0_super_thor:
  stage: l0_test
  needs:
    - job: l0_checkpoint_export
      artifacts: false
    - job: build_cutedsl_docker_matrix
      artifacts: true
  tags:
    - test_super_thor
  variables:
    TRT_VERSION: "10.16.0.72"
    TRT_CUDA_VERSION: "13.2"
    TRT_PACKAGE_DIR: "$EDGE_LLM_CACHE_DIR/trt_softwares/TensorRT-$TRT_VERSION/TensorRT-$TRT_VERSION.d7l.cuda-$TRT_CUDA_VERSION"
    PRIORITY: l0_pipeline_super_thor
    EDGELLM_NCCL_SO_PATH: "$EDGE_LLM_CACHE_DIR/nccl/tegra-thor/lib/libnccl.so.2.29.2"
    # test_build_and_run validates this before it runs. The quantized checkpoint
    # itself still resolves through EDGELLM_DATA_DIR.
    LLM_MODELS_DIR: "$EDGE_LLM_CACHE_DIR/models"
    L0_JOB_WRITES_ENGINES: "1"
    ENABLE_MULTI_DEVICE: "ON"
    ENABLE_MULTI_DEVICE_MPI: "ON"
    # The shell executor runs as root and OpenMPI refuses that by default, so the
    # mdmpi cases need its documented override.
    OMPI_ALLOW_RUN_AS_ROOT: "1"
    OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
    NCCL_CUMEM_ENABLE: "0"
    NCCL_IB_DISABLE: "1"
    NCCL_MNNVL_ENABLE: "0"
    NCCL_DMABUF_ENABLE: "0"
    NCCL_P2P_DISABLE: "1"
  script:
    - echo "Pipeline start time:$(date)"
    - 'echo "Node name: ${NODE_NAME:-$(hostname)}"'
    - echo "CUDA version:$(/usr/local/cuda/bin/nvcc --version | grep release)"
    - nvidia-smi -L
    - gpu_count=$(nvidia-smi -L | wc -l)
    - |
      if [ "${gpu_count:-0}" -lt 2 ]; then
        echo "Tensor-parallel tests need 2 GPUs, found ${gpu_count:-0}"
        exit 1
      fi
    - command -v mpirun >/dev/null || { echo "mpirun not found, required by the mdmpi cases"; exit 1; }
    - if [ ! -d "$TRT_PACKAGE_DIR" ]; then echo "TensorRT package not found at $TRT_PACKAGE_DIR"; exit 1; fi
    - if [ ! -f "$EDGELLM_NCCL_SO_PATH" ]; then echo "Thor NCCL not found at $EDGELLM_NCCL_SO_PATH"; exit 1; fi
    - export PATH=/usr/local/cuda/bin:$PATH
    - export LD_LIBRARY_PATH="$TRT_PACKAGE_DIR/lib:$(dirname "$EDGELLM_NCCL_SO_PATH"):${LD_LIBRARY_PATH:-}"
    - export LLM_SDK_DIR=${LLM_SDK_DIR:-$(pwd)}
    - mkdir -p "$TEST_LOG_DIR" "$ENGINE_DIR" "$CI_PROJECT_DIR/.ci-reports"
    - chmod -R 777 "$TEST_LOG_DIR"
    - python3 -m venv venv && source venv/bin/activate
    - bash .gitlab/ci/scripts/ci_run.sh "$CI_PIP_INSTALL_TIMEOUT_SECONDS" "Install pytest dependencies" -- pip3 install -r tests/requirements.txt
    - bash .gitlab/ci/scripts/ci_run.sh "$CI_PIP_INSTALL_TIMEOUT_SECONDS" "Install accuracy dependencies" -- pip3 install -r examples/accuracy/requirements.txt
    - bash .gitlab/ci/scripts/ci_run.sh "$CI_PIP_INSTALL_TIMEOUT_SECONDS" "Install TensorRT Python package" -- pip3 install $TRT_PACKAGE_DIR/python/${TRT_WHEEL_GLOB}.whl
    - echo "Running pipeline tests with pytest. Time:$(date)"
    - python3 -m pytest tests/ --priority=$PRIORITY -v --color=yes --html=$TEST_LOG_DIR/test_report_$PRIORITY.html --self-contained-html --junitxml="$CI_PROJECT_DIR/.ci-reports/test_report_$PRIORITY.xml"
    - echo "HTML report saved to $TEST_LOG_DIR; JUnit report saved to $CI_PROJECT_DIR/.ci-reports"
    - ls -la $TEST_LOG_DIR
    - deactivate
    - echo "Pipeline end time:$(date)"
  extends:
    - .l0_storage_paths
    - .l0_blackwell_exports
    - .ci_test_submodules
    - .gitlab_junit_report
    - .l0_rules
  interruptible: true
