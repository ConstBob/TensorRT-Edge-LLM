# ==============================================================================
# LOCAL BOARD JOBS - Native build and unit tests on physical boards
# Shell executor, triggered on MRs and L0_STABILITY=true schedules
# ==============================================================================

# ------------------------------------------------------------------------------
# DGX Spark (GB10) - CUDA 13.0, TRT 10.14.1 (system-installed)
# ------------------------------------------------------------------------------
l0_local_spark_build_and_test:
  stage: l0_test
  tags:
    - local-spark
  variables:
    TRT_PACKAGE_DIR: "/usr"
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-artifacts/lib-size/
      - .ci-telemetry-artifact/
    reports:
      metrics: ci-artifacts/lib-size/lib_size_metrics.txt
  script:
    - echo "Pipeline start time:$(date)"
    - echo "Node name:$(hostname)"
    - echo "CUDA version:$(nvcc --version | grep release)"
    - echo "TRT version:$(dpkg -l | grep tensorrt-libs | awk '{print $3}')"
    - export PATH=/usr/local/cuda/bin:$PATH
    - export LD_LIBRARY_PATH=/usr/lib/aarch64-linux-gnu:$LD_LIBRARY_PATH
    - echo "Generating CuteDSL kernel artifacts (venv)"
    - python3 -m venv venv/cutedsl
    - bash .gitlab/ci/scripts/ci_run.sh "$CI_PIP_INSTALL_TIMEOUT_SECONDS" "Install CuTeDSL dependencies" -- venv/cutedsl/bin/pip install 'nvidia-cutlass-dsl[cu13]==4.7.0' cupy-cuda13x==13.6.0
    - >-
      sh .gitlab/ci/scripts/ci_run.sh "$CI_JOB_PHASE_TIMEOUT_SECONDS"
      "Build local Spark CuTeDSL kernels" --
      venv/cutedsl/bin/python kernelSrcs/build_cutedsl.py --kernels ALL
    - echo "Building project with unit tests"
    - rm -rf build && mkdir build && cd build
    - >-
      sh "$CI_PROJECT_DIR/.gitlab/ci/scripts/ci_run.sh"
      "$CI_JOB_PHASE_TIMEOUT_SECONDS" "Configure local Spark build" --
      cmake .. -DTRT_PACKAGE_DIR=$TRT_PACKAGE_DIR -DBUILD_UNIT_TESTS=ON
      -DENABLE_CUTE_DSL=ALL
      -DCMAKE_TOOLCHAIN_FILE=cmake/aarch64_linux_toolchain.cmake
      -DEMBEDDED_TARGET=gb10 -DCUDA_CTK_VERSION=13.0
    - >-
      sh "$CI_PROJECT_DIR/.gitlab/ci/scripts/ci_run.sh"
      "$CI_JOB_PHASE_TIMEOUT_SECONDS" "Build local Spark targets" --
      make -j$(nproc)
    - echo "Reporting library size"
    - python3 ../scripts/report_library_size.py
        --build-dir .
        --source-dir ..
        --label gb10
        --output-dir ../ci-artifacts/lib-size
        || echo "WARNING - library size report failed"
    - echo "Build completed. Running unit tests"
    # Each group is its own executable; ctest runs them and reports per-group.
    # Serial on purpose: these boards have far less device memory than an x86
    # dev box, and concurrent groups would contend for it. Locally, add
    # --parallel $(nproc).
    - >-
      sh "$CI_PROJECT_DIR/.gitlab/ci/scripts/ci_run.sh"
      "$CI_JOB_PHASE_TIMEOUT_SECONDS" "Run local Spark unit tests" --
      ctest --output-on-failure
    - echo "Pipeline end time:$(date)"
  extends:
    - .ci_internal_submodules
    - .l0_rules
  interruptible: true
