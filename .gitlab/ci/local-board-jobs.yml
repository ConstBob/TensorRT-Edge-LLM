# ==============================================================================
# LOCAL BOARD JOBS - Native unit and runtime tests
# Shell executor, triggered on MRs and L0_STABILITY=true schedules
# ==============================================================================

l0_unit_test_spark:
  stage: l0_unit
  needs:
    - job: build_cutedsl_docker_matrix
      artifacts: true
  tags:
    - local-spark
  variables:
    TRT_PACKAGE_DIR: "/usr"
    TRT_LIBRARY_DIR: "/usr/lib/aarch64-linux-gnu"
    TRT_PYTHON_VERSION: "10.16.1.11"
    CUDA_CTK_VERSION: "13.0"
    EMBEDDED_TARGET: gb10
    CPP_UNIT_BUILD_JOBS: "16"
    CPP_UNIT_TEST_JOBS: "4"
    RUN_PYTHON_PLUGIN_TESTS: "1"
    PYTHON_PLUGIN_USE_SYSTEM_SITE_PACKAGES: "1"
  extends:
    - .cpp_unit_test_template
    - .l0_rules

l0_e2e_spark:
  stage: l0_test
  needs:
    - job: l0_onnx_export_2
      artifacts: false
    - job: build_cutedsl_docker_matrix
      artifacts: true
  tags:
    - local-spark
  variables:
    CUDA_VERSION: "13.0"
    TRT_PACKAGE_DIR: "/usr"
    TRT_LIBRARY_DIR: "/usr/lib/aarch64-linux-gnu"
    TRT_PYTHON_VERSION: "10.16.1.11"
    PRIORITY: l0_e2e_spark
    L0_JOB_WRITES_ENGINES: "1"
    BASELINE_CSV: "$EDGE_LLM_CACHE_DIR/baselines/spark.csv"
  script:
    - echo "Pipeline start time:$(date)"
    - echo "Node name:$(hostname)"
    - export PATH=/usr/local/cuda/bin:$PATH
    - export LD_LIBRARY_PATH="$TRT_LIBRARY_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
    - mkdir -p "$TEST_LOG_DIR" "$ENGINE_DIR" "$CI_PROJECT_DIR/.ci-reports"
    - rm -rf "$TEST_LOG_DIR"/* "$ENGINE_DIR"/* build venv/l0-spark
    - export LLM_SDK_DIR=${LLM_SDK_DIR:-$(pwd)}
    - python3 -m venv --system-site-packages venv/l0-spark
    - source venv/l0-spark/bin/activate
    - bash .gitlab/ci/scripts/ci_run.sh "$CI_PIP_INSTALL_TIMEOUT_SECONDS" "Install pytest dependencies" -- pip3 install -r tests/requirements.txt
    - bash .gitlab/ci/scripts/ci_run.sh "$CI_PIP_INSTALL_TIMEOUT_SECONDS" "Install accuracy dependencies" -- pip3 install -r examples/accuracy/requirements.txt
    - >-
      python3 -c 'import tensorrt' 2>/dev/null ||
      bash .gitlab/ci/scripts/ci_run.sh "$CI_PIP_INSTALL_TIMEOUT_SECONDS"
      "Install TensorRT Python bindings" -- pip3 install --no-deps
      "tensorrt_cu13==$TRT_PYTHON_VERSION"
      "tensorrt_cu13_bindings==$TRT_PYTHON_VERSION"
    - python3 -c 'import os, tensorrt; assert tensorrt.__version__ == os.environ["TRT_PYTHON_VERSION"]'
    - >-
      bash .gitlab/ci/scripts/ci_run.sh "$CI_JOB_PHASE_TIMEOUT_SECONDS"
      "Run DGX Spark model tests" -- python3 -m pytest tests/
      --priority=$PRIORITY -v --maxfail=1 --color=yes
      --html=$TEST_LOG_DIR/test_report_$PRIORITY.html --self-contained-html
      --junitxml="$CI_PROJECT_DIR/.ci-reports/test_report_$PRIORITY.xml"
    - deactivate
    - echo "Pipeline end time:$(date)"
  extends:
    - .l0_storage_paths
    - .l0_onnx_exports_2
    - .ci_test_submodules
    - .gitlab_junit_report
    - .l0_rules

l0_e2e_super_thor:
  stage: l0_test
  resource_group: super-thor
  needs:
    - job: l0_onnx_export_1
      artifacts: false
    - job: build_cutedsl_docker_matrix
      artifacts: true
  tags:
    - test_super_thor
  variables:
    TRT_VERSION: "10.16.0.72"
    TRT_CUDA_VERSION: "13.2"
    TRT_PACKAGE_DIR: "$EDGE_LLM_CACHE_DIR/trt_softwares/TensorRT-$TRT_VERSION/TensorRT-$TRT_VERSION.d7l.cuda-$TRT_CUDA_VERSION"
    PRIORITY: l0_e2e_super_thor
    EDGELLM_NCCL_SO_PATH: "$EDGE_LLM_CACHE_DIR/nccl/tegra-thor/lib/libnccl.so.2.29.2"
    LLM_MODELS_DIR: "$TORCH_DIR"
    L0_JOB_WRITES_ENGINES: "1"
    ENABLE_MULTI_DEVICE: "ON"
    ENABLE_MULTI_DEVICE_MPI: "ON"
    # The shell executor runs as root and OpenMPI refuses that by default, so the
    # mdmpi cases need its documented override.
    OMPI_ALLOW_RUN_AS_ROOT: "1"
    OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
    NCCL_CUMEM_ENABLE: "0"
    NCCL_IB_DISABLE: "1"
    NCCL_MNNVL_ENABLE: "0"
    NCCL_DMABUF_ENABLE: "0"
    NCCL_P2P_DISABLE: "1"
  script:
    - echo "Pipeline start time:$(date)"
    - 'echo "Node name: ${NODE_NAME:-$(hostname)}"'
    - echo "CUDA version:$(/usr/local/cuda/bin/nvcc --version | grep release)"
    - nvidia-smi -L
    - gpu_count=$(nvidia-smi -L | wc -l)
    - |
      if [ "${gpu_count:-0}" -lt 2 ]; then
        echo "Tensor-parallel tests need 2 GPUs, found ${gpu_count:-0}"
        exit 1
      fi
    - command -v mpirun >/dev/null || { echo "mpirun not found, required by the mdmpi cases"; exit 1; }
    - if [ ! -d "$TRT_PACKAGE_DIR" ]; then echo "TensorRT package not found at $TRT_PACKAGE_DIR"; exit 1; fi
    - if [ ! -f "$EDGELLM_NCCL_SO_PATH" ]; then echo "Thor NCCL not found at $EDGELLM_NCCL_SO_PATH"; exit 1; fi
    - export PATH=/usr/local/cuda/bin:$PATH
    - export LD_LIBRARY_PATH="$TRT_PACKAGE_DIR/lib:$(dirname "$EDGELLM_NCCL_SO_PATH"):${LD_LIBRARY_PATH:-}"
    - export LLM_SDK_DIR=${LLM_SDK_DIR:-$(pwd)}
    - mkdir -p "$TEST_LOG_DIR" "$ENGINE_DIR" "$CI_PROJECT_DIR/.ci-reports"
    - chmod -R 777 "$TEST_LOG_DIR"
    - python3 -m venv venv && source venv/bin/activate
    - bash .gitlab/ci/scripts/ci_run.sh "$CI_PIP_INSTALL_TIMEOUT_SECONDS" "Install pytest dependencies" -- pip3 install -r tests/requirements.txt
    - bash .gitlab/ci/scripts/ci_run.sh "$CI_PIP_INSTALL_TIMEOUT_SECONDS" "Install accuracy dependencies" -- pip3 install -r examples/accuracy/requirements.txt
    - bash .gitlab/ci/scripts/ci_run.sh "$CI_PIP_INSTALL_TIMEOUT_SECONDS" "Install TensorRT Python package" -- pip3 install $TRT_PACKAGE_DIR/python/${TRT_WHEEL_GLOB}.whl
    - echo "Running pipeline tests with pytest. Time:$(date)"
    - python3 -m pytest tests/ --priority=$PRIORITY -v --maxfail=1 --color=yes --html=$TEST_LOG_DIR/test_report_$PRIORITY.html --self-contained-html --junitxml="$CI_PROJECT_DIR/.ci-reports/test_report_$PRIORITY.xml"
    - echo "HTML report saved to $TEST_LOG_DIR; JUnit report saved to $CI_PROJECT_DIR/.ci-reports"
    - ls -la $TEST_LOG_DIR
    - deactivate
    - echo "Pipeline end time:$(date)"
  extends:
    - .l0_storage_paths
    - .l0_onnx_exports_1
    - .ci_test_submodules
    - .gitlab_junit_report
    - .l0_rules
  interruptible: true
