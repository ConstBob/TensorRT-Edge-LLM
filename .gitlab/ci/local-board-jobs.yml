# ==============================================================================
# LOCAL BOARD JOBS - Native build and unit tests on physical boards
# Shell executor (no container), triggered on MRs
# ==============================================================================

# ------------------------------------------------------------------------------
# DGX Spark (GB10) - CUDA 13.0, TRT 10.14.1 (system-installed)
# ------------------------------------------------------------------------------
l0_local_spark_build_and_test:
  stage: l0_test
  tags:
    - local-spark
  variables:
    TRT_PACKAGE_DIR: "/usr"
  script:
    - echo "Pipeline start time:$(date)"
    - echo "Node name:$(hostname)"
    - echo "CUDA version:$(nvcc --version | grep release)"
    - echo "TRT version:$(dpkg -l | grep tensorrt-libs | awk '{print $3}')"
    - export PATH=/usr/local/cuda/bin:$PATH
    - export LD_LIBRARY_PATH=/usr/lib/aarch64-linux-gnu:$LD_LIBRARY_PATH
    - echo "Initializing git submodules"
    - git submodule update --init --recursive
    - echo "Building project with unit tests"
    - rm -rf build && mkdir build && cd build
    - cmake ..
        -DTRT_PACKAGE_DIR=$TRT_PACKAGE_DIR
        -DBUILD_UNIT_TESTS=ON
        -DCMAKE_TOOLCHAIN_FILE=cmake/aarch64_linux_toolchain.cmake
        -DEMBEDDED_TARGET=gb10
        -DCUDA_CTK_VERSION=13.0
    - make -j$(nproc)
    - echo "Build completed. Running unit tests"
    - ./unitTest
    - echo "Pipeline end time:$(date)"
  extends:
    - .l0_rules
  interruptible: true

# ------------------------------------------------------------------------------
# Orin NX 16GB - CUDA 11.4, TRT 10.13.3 (from NFS cache, d6l build)
# ------------------------------------------------------------------------------
l0_local_orin_114_build_and_test:
  stage: l0_test
  tags:
    - local-orin-11.4
  variables:
    TRT_VERSION: "10.13.3.9"
    TRT_PACKAGE_DIR: "/scratch.edge_llm_cache/trt_softwares/TensorRT-10.13.3.9/TensorRT-10.13.3.9.d6l.cuda-11.4"
  script:
    - echo "Pipeline start time:$(date)"
    - echo "Node name:$(hostname)"
    - export PATH=/usr/local/cuda/bin:$PATH
    - echo "CUDA version:$(nvcc --version | grep release)"
    - if [ ! -d "$TRT_PACKAGE_DIR" ]; then echo "TensorRT package not found at $TRT_PACKAGE_DIR"; exit 1; fi
    - export LD_LIBRARY_PATH=$TRT_PACKAGE_DIR/lib:$LD_LIBRARY_PATH
    - echo "Initializing git submodules"
    - git submodule update --init --recursive
    - echo "Building project with unit tests"
    - rm -rf build && mkdir build && cd build
    - cmake ..
        -DTRT_PACKAGE_DIR=$TRT_PACKAGE_DIR
        -DBUILD_UNIT_TESTS=ON
        -DCMAKE_TOOLCHAIN_FILE=cmake/aarch64_linux_toolchain.cmake
        -DEMBEDDED_TARGET=jetson-orin
        -DCUDA_CTK_VERSION=11.4
    - make -j$(nproc)
    - echo "Build completed. Running unit tests"
    # Exclude cubin-based tests incompatible with CUDA 11.4 driver (CUDA_ERROR_INVALID_IMAGE)
    - ./unitTest --gtest_filter=-XQAAttentionDecodingTest.*:XQATreeAttentionDecodingTest.*:ContextAttentionTest.*:BatchEvictKernels.CompactKVCacheMultipleEvictions
    - echo "Pipeline end time:$(date)"
  extends:
    - .l0_rules
  interruptible: true
