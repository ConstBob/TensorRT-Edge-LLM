# ==============================================================================
# EXPERIMENTAL DOCKER JOBS
# ==============================================================================

l0_experimental_docker_jedha:
  stage: l0_test
  extends:
    - .device_controller_environment
    - .ci_internal_submodules
  needs:
    - job: build_cutedsl_docker_matrix
      artifacts: true
  tags:
    - jedha-edgellm-nvks
  variables:
    BOARD_USER: "tensorrt_user"
    BOARD_IP: "192.168.55.1"
    REMOTE_WORKSPACE: "/home/tensorrt_user/tensorrt-edge-llm-docker-${CI_PIPELINE_ID}-${CI_JOB_ID}"
    EXPERIMENTAL_DOCKER_IMAGE: "tensorrt-edge-llm:experimental-${CI_COMMIT_SHORT_SHA}"
  script:
    - echo "Pipeline start time:$(date)"
    - 'echo "Node name: ${NODE_NAME:-$(hostname)}"'
    - >-
      sh .gitlab/ci/scripts/ci_run.sh "$CI_JOB_PHASE_TIMEOUT_SECONDS"
      "Run experimental Docker workflow" --
      bash .gitlab/ci/scripts/experimental_docker_board.sh run
  after_script:
    - >-
      sh .gitlab/ci/scripts/ci_run.sh "$CI_JOB_PHASE_TIMEOUT_SECONDS"
      "Clean experimental Docker workflow" --
      bash .gitlab/ci/scripts/experimental_docker_board.sh cleanup || true
    - echo "Pipeline end time:$(date)"
    - !reference [.cleanup_engine_storage, after_script]
    - !reference [.record_runner_usage, after_script]
  rules:
    - if: $L1 == "true"
      when: never
    # Stability must test TOT even when an MR requests [skip tests].
    - if: $CI_PIPELINE_SOURCE == "schedule" && $L0_STABILITY == "true"
    - if: $EDGE_LLM_SKIP_TESTS == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .dockerignore
        - .gitlab-ci.yml
        - .gitlab/ci/experimental-docker-jobs.yml
        - .gitlab/ci/scripts/experimental_docker_board.sh
        - experimental/server/**/*
        - experimental/docker/**/*
        - pyproject.toml
        - requirements.txt
        - requirements-server.txt
        - tensorrt_edgellm/**/*
  interruptible: true
