# ==============================================================================
# EXPERIMENTAL DOCKER JOBS
# ==============================================================================

l0_experimental_docker_jedha:
  stage: l0_test
  tags:
    - jedha-edgellm-nvks
  image: "ubuntu:24.04"
  variables:
    DOCKER_BUILDKIT: "1"
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_DEPTH: "1"
    EXPERIMENTAL_DOCKER_IMAGE: "tensorrt-edge-llm:experimental-${CI_COMMIT_SHORT_SHA}"
  script:
    - echo "Pipeline start time:$(date)"
    - 'echo "Node name: ${NODE_NAME:-$(hostname)}"'
    - docker version
    - docker build --network=host --shm-size=8g -f experimental/docker/Dockerfile -t "$EXPERIMENTAL_DOCKER_IMAGE" .
    - docker run --runtime nvidia --rm --network host --shm-size=8g "$EXPERIMENTAL_DOCKER_IMAGE" python3 -m experimental.server --help
    - docker run --runtime nvidia --rm --network host --shm-size=8g "$EXPERIMENTAL_DOCKER_IMAGE" python3 -c 'from experimental.server.engine import _import_runtime; print(_import_runtime().__name__)'
  after_script:
    - docker ps -aq --filter "ancestor=$EXPERIMENTAL_DOCKER_IMAGE" | xargs -r docker rm -f || true
    - docker rmi "$EXPERIMENTAL_DOCKER_IMAGE" || true
    - echo "Pipeline end time:$(date)"
  rules:
    - if: $L1 == "true"
      when: never
    - if: $CI_COMMIT_MESSAGE =~ /\[skip tests\]/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .dockerignore
        - .gitlab-ci.yml
        - .gitlab/ci/experimental-docker-jobs.yml
        - experimental/docker/**/*
  interruptible: true
