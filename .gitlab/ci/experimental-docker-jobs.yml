# ==============================================================================
# EXPERIMENTAL DOCKER JOBS
# ==============================================================================

l0_experimental_docker_jedha:
  stage: l0_test
  needs:
    - job: build_cutedsl_sm110_artifact
      artifacts: true
  tags:
    - jedha-edgellm-nvks
  image: "ubuntu:24.04"
  variables:
    BOARD_USER: "tensorrt_user"
    BOARD_IP: "192.168.55.1"
    REMOTE_WORKSPACE: "/home/tensorrt_user/tensorrt-edge-llm-docker-${CI_PIPELINE_ID}-${CI_JOB_ID}"
    EXPERIMENTAL_DOCKER_IMAGE: "tensorrt-edge-llm:experimental-${CI_COMMIT_SHORT_SHA}"
    CUTE_DSL_ARTIFACT_NAME: "cutedsl_aarch64_sm_110_cuda13.tar.gz"
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends openssh-client sshpass rsync
  script:
    - echo "Pipeline start time:$(date)"
    - 'echo "Node name: ${NODE_NAME:-$(hostname)}"'
    - bash .gitlab/ci/scripts/experimental_docker_board.sh run
  after_script:
    - bash .gitlab/ci/scripts/experimental_docker_board.sh cleanup || true
    - echo "Pipeline end time:$(date)"
  rules:
    - if: $L1 == "true"
      when: never
    - if: $CI_COMMIT_MESSAGE =~ /\[skip tests\]/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .dockerignore
        - .gitlab-ci.yml
        - .gitlab/ci/experimental-docker-jobs.yml
        - .gitlab/ci/scripts/experimental_docker_board.sh
        - experimental/docker/**/*
  interruptible: true
