# ==============================================================================
# CLEANUP — Triggered when L1 pipeline environment is stopped
# (auto-stop after 6 days per .l1_environment, or manually from GitLab UI).
# Mirrors the L0 cleanup pattern in cleanup_l0_mr_cache.
# ==============================================================================

cleanup_l1_pipeline_cache:
  stage: .post
  dependencies: []
  variables:
    GIT_STRATEGY: none
  tags:
    - a30-edgellm-nvks
  script:
    - echo "Cleaning up L1 cache for pipeline ${CI_PIPELINE_ID}"
    # Safety check: CI_PIPELINE_ID must be set
    - |
      if [ -z "$CI_PIPELINE_ID" ]; then
        echo "ERROR: CI_PIPELINE_ID is not set!"
        exit 1
      fi
    - PIPELINE_CACHE_DIR="${EDGE_LLM_CACHE_DIR}/L1/${CI_PIPELINE_ID}"
    - |
      if [ -d "$PIPELINE_CACHE_DIR" ]; then
        echo "Found L1 pipeline cache: $PIPELINE_CACHE_DIR"
        echo "Disk usage before cleanup:"
        du -sh "$PIPELINE_CACHE_DIR" || true
        echo "Removing $PIPELINE_CACHE_DIR..."
        rm -rf "$PIPELINE_CACHE_DIR"
        echo "✅ Cleanup completed for pipeline ${CI_PIPELINE_ID}"
      else
        echo "ℹ️  No cache directory at $PIPELINE_CACHE_DIR (already cleaned or never created)"
      fi
  environment:
    name: l1_cache/pipeline_$CI_PIPELINE_ID
    action: stop
  when: manual
  allow_failure: true
