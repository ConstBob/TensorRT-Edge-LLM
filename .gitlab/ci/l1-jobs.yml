l1_spark:
  stage: l1_test
  needs:
    - l1_blackwell_export_large
    - l1_blackwell_export_moe
    - l1_dataset_prep
    - job: build_cutedsl_docker_matrix
      artifacts: true
  variables:
    CUDA_VERSION: "13.0"
    L1_CACHE_DIR: "$EDGE_LLM_CACHE_DIR/L1/$CI_PIPELINE_ID"
    LLM_MODELS_DIR: "$TORCH_DIR"
    EDGELLM_DATA_DIR: "$L1_CACHE_DIR"
    TEST_CACHE_DIR: "$CI_PROJECT_DIR/l1_spark_cache"
    PRIORITY: l1_pipeline_spark
    ONNX_DIR: "$L1_CACHE_DIR/l1_blackwell_exports/onnx"
    TEST_LOG_DIR: "$TEST_CACHE_DIR/logs"
    ENGINE_DIR: "$TEST_CACHE_DIR/engines"
    TRT_PACKAGE_DIR: "/usr"
    BASELINE_CSV: "$EDGE_LLM_CACHE_DIR/baselines/l1_spark.csv"
  tags:
    - local-spark
  script:
    - echo "Pipeline start time:$(date)"
    - echo "Node name:$(hostname)"
    - export PATH=/usr/local/cuda/bin:$PATH
    - export LD_LIBRARY_PATH=/usr/lib/aarch64-linux-gnu:$LD_LIBRARY_PATH
    - echo "CUDA version:$(nvcc --version | grep release)"
    - echo "TRT version:$(dpkg -l | grep tensorrt-libs | awk '{print $3}')"
    - mkdir -p "$TEST_LOG_DIR" "$ENGINE_DIR"
    - rm -rf "$TEST_LOG_DIR"/* "$ENGINE_DIR"/*
    - export LLM_SDK_DIR=${LLM_SDK_DIR:-$(pwd)}
    - rm -rf 3rdParty/googletest 3rdParty/nlohmannJson venv/l1-spark
    - git clone https://gitlab-master.nvidia.com/ftp/GitHubSync/googletest-mirror.git 3rdParty/googletest
    - git clone https://gitlab-master.nvidia.com/ftp/GitHubSync/json-mirror.git 3rdParty/nlohmannJson
    - python3 -m venv --system-site-packages venv/l1-spark
    - source venv/l1-spark/bin/activate
    - pip3 install -q -r tests/requirements.txt
    - pip3 install -q -r examples/accuracy/requirements.txt
    - if [ -n "$BASELINE_CSV" ]; then mkdir -p "$(dirname "$BASELINE_CSV")"; fi
    - python3 -m pytest tests/ --priority=$PRIORITY -v --color=yes --html=$TEST_LOG_DIR/test_report_$PRIORITY.html --self-contained-html --junitxml=$TEST_LOG_DIR/test_report_$PRIORITY.xml
    - ls -la "$TEST_LOG_DIR"
    - deactivate
    - echo "Pipeline end time:$(date)"
  extends:
    - .l1_rules
    - .l1_environment
  interruptible: false

