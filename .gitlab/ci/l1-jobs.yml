# VLMEvalKit checkout used by b100 jobs. Cloned into the L1 cache so it
# survives across pipelines; commit is pinned for reproducibility.
#
# OPENAI_API_KEY must be defined as a masked + protected GitLab CI variable
# on the project (do NOT commit the secret here). Without it, the LLM
# judge call fails and VLMEvalKit silently scores open-ended MMMU near 0%.
.l1_vlmevalkit_setup:
  variables:
    VLMEVALKIT_JUDGE_MODEL: "gpt-4-0125"
    LOCAL_LLM: "openai/openai/gpt-5.1"
    OPENAI_API_BASE: "https://inference-api.nvidia.com/v1/chat/completions"
  before_script:
    - |
      if [ ! -d "$VLMEVALKIT_DIR/.git" ]; then
        echo "Cloning VLMEvalKit into $VLMEVALKIT_DIR"
        mkdir -p "$(dirname "$VLMEVALKIT_DIR")"
        git clone https://gitlab-master.nvidia.com/ftp/GitHubSync/VLMEvalKit-mirror.git "$VLMEVALKIT_DIR" \
          || git clone https://github.com/open-compass/VLMEvalKit.git "$VLMEVALKIT_DIR"
      fi
    - cd "$VLMEVALKIT_DIR" && git fetch --all -q && git checkout "$VLMEVALKIT_COMMIT" && cd -
    - pip3 install -q -r "$VLMEVALKIT_DIR/requirements.txt"

