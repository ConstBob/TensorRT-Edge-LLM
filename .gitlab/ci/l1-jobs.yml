# ==============================================================================
# L1 TESTS - Manual Trigger (L1=true)
# Cache Directory: /scratch.edge_llm_cache/L1/
# Run weekly or manually from GitLab UI:
#   Pipelines -> Run pipeline -> Add variable L1=true
# ==============================================================================

include:
  - local: '.gitlab/ci/templates.yml'

# ==============================================================================
# DATASET PREP — runs once per L1 pipeline on a30; output cached for all
# downstream pipeline jobs via $EDGELLM_DATA_DIR.
# ==============================================================================

l1_dataset_prep:
  stage: l1_test
  variables:
    CUDA_VERSION: "13.2"
    IMAGE: urm.nvidia.com/sw-tensorrt-docker/tensorrt-base:$TRT_BRANCH-native-x86_64-ubuntu24.04-cuda$CUDA_VERSION
    L1_CACHE_DIR: "$EDGE_LLM_CACHE_DIR/L1/$CI_PIPELINE_ID"
    EDGELLM_DATA_DIR: "$L1_CACHE_DIR"
    TEST_LOG_DIR: "$L1_CACHE_DIR/dataset_prep/logs"
  tags:
    - a30-edgellm-nvks
  image: "$IMAGE"
  extends:
    - .l1_rules
    - .l1_environment
  interruptible: false
  script:
    - set -o pipefail
    # $EDGELLM_DATA_DIR is a per-pipeline writable cache under
    # $L1_CACHE_DIR (keyed by $CI_PIPELINE_ID); the GitLab environment
    # `l1_cache/pipeline_$CI_PIPELINE_ID` (see .l1_environment template)
    # auto-stops after 6 days and triggers `cleanup_l1_pipeline_cache`
    # to remove the cache directory. We never write to the QA-hub mount.
    - export DATA="$EDGELLM_DATA_DIR/updated_datasets"
    - mkdir -p "$DATA" "$TEST_LOG_DIR"
    - cd $LLM_SDK_DIR
    - pip install -r tests/requirements.txt
    - pip install -r examples/accuracy/requirements.txt
    - cd examples/accuracy/scripts
    # Text / multiple choice (LLM accuracy)
    - python prepare_dataset.py --dataset MMLU --output_dir "$DATA/MMLU_five_shot" --num_shot 5 2>&1 | tee "$TEST_LOG_DIR/mmlu_5.log"
    - python prepare_dataset.py --dataset MMLU --output_dir "$DATA/MMLU_zero_shot" --num_shot 0 2>&1 | tee "$TEST_LOG_DIR/mmlu_0.log"
    - python prepare_dataset.py --dataset MMLU_Pro --output_dir "$DATA/MMLU_Pro" --num_shot 5 2>&1 | tee "$TEST_LOG_DIR/mmlu_pro.log"
    - python prepare_dataset.py --dataset MTBench --output_dir "$DATA/updated_MTBench" 2>&1 | tee "$TEST_LOG_DIR/mtbench.log"
    - cp "$DATA/updated_MTBench/mtbench_dataset.json" "$DATA/updated_MTBench/mtbench_eagle3.json"
    # Reasoning / coding / math (fills budget headroom — already supported by prepare_dataset)
    - python prepare_dataset.py --dataset GSM8K --output_dir "$DATA/GSM8K" 2>&1 | tee "$TEST_LOG_DIR/gsm8k.log"
    - python prepare_dataset.py --dataset HumanEval --output_dir "$DATA/HumanEval" 2>&1 | tee "$TEST_LOG_DIR/humaneval.log"
    - python prepare_dataset.py --dataset AIME --output_dir "$DATA/AIME" 2>&1 | tee "$TEST_LOG_DIR/aime.log"
    - python prepare_dataset.py --dataset MATH500 --output_dir "$DATA/MATH500" 2>&1 | tee "$TEST_LOG_DIR/math500.log"
    - python prepare_dataset.py --dataset MMStar --output_dir "$DATA/MMStar" 2>&1 | tee "$TEST_LOG_DIR/mmstar.log"
    # VLM
    - python prepare_dataset.py --dataset MMMU --output_dir "$DATA/mmmu" 2>&1 | tee "$TEST_LOG_DIR/mmmu.log"
    - python prepare_dataset.py --dataset MMMU_VLMEvalkit --output_dir "$DATA/MMMU_VLMEvalKit" 2>&1 | tee "$TEST_LOG_DIR/mmmu_vlmevalkit.log"
    - cp "$EDGE_LLM_CACHE_DIR/updated_datasets/MMMU_VLMEvalKit/mmmu_dataset.tsv" "$DATA/MMMU_VLMEvalKit/mmmu_dataset.tsv"
    - python prepare_dataset.py --dataset MMMU_Pro --output_dir "$DATA/MMMU_Pro_vision" --subset vision 2>&1 | tee "$TEST_LOG_DIR/mmmu_pro_vision.log"
    - python prepare_dataset.py --dataset MMMU_Pro --output_dir "$DATA/MMMU_Pro_4" --subset "standard (4 options)" 2>&1 | tee "$TEST_LOG_DIR/mmmu_pro_4.log"
    - python prepare_dataset.py --dataset COCO --output_dir "$DATA/coco" 2>&1 | tee "$TEST_LOG_DIR/coco.log"
    # Audio / Omni
    - python prepare_dataset.py --dataset LibriSpeech --output_dir "$DATA/librispeech_clean_test" 2>&1 | tee "$TEST_LOG_DIR/librispeech.log"
    - python prepare_dataset.py --dataset OmniBench --output_dir "$DATA/OmniBench" 2>&1 | tee "$TEST_LOG_DIR/omnibench.log"
    # TTS multilingual (auto-downloads from HF)
    - python prepare_dataset.py --dataset MiniMaxMultilingual --output_dir "$DATA/MiniMaxMultilingual" --language en 2>&1 | tee "$TEST_LOG_DIR/minimax_en.log"
    - ls -la "$DATA"
    - du -sh "$DATA"/*

# ==============================================================================
# EXPORT JOBS
# ==============================================================================

l1_ampere_export:
  stage: l1_test
  variables:
    CUDA_VERSION: "13.2"
    IMAGE: urm.nvidia.com/sw-tensorrt-docker/tensorrt-base:$TRT_BRANCH-native-x86_64-ubuntu24.04-cuda$CUDA_VERSION
    L1_CACHE_DIR: "$EDGE_LLM_CACHE_DIR/L1/$CI_PIPELINE_ID"
    # QA-hub pre-quantized HF checkpoints (GPTQ / NVFP4 suffix-named models)
    # let `is_prequantized()` short-circuit and skip the local quant step.
    LLM_MODELS_DIR: "$TORCH_DIR"
    EDGELLM_DATA_DIR: "$QUANT_CHECKPOINT_DIR"
    TEST_CACHE_DIR: "$L1_CACHE_DIR/l1_ampere_export"
    PRIORITY: l1_export_ampere
    ONNX_DIR: "$L1_CACHE_DIR/l1_ampere_exports/onnx"
    TEST_LOG_DIR: "$TEST_CACHE_DIR/logs"
  tags:
    - a30-edgellm-nvks
  image: "$IMAGE"
  extends:
    - .checkpoint_export_template
    - .l1_rules
    - .l1_environment
  interruptible: false

