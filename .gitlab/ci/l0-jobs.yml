# Building and testing with Jetson Orin
l0_jetson_orin:
  stage: l0_test
  needs:
    - l0_checkpoint_export_ampere
    - job: build_cutedsl_docker_matrix
      artifacts: true
  variables:
    BOARD_USER: "tensorrt_user"
    CUDA_VERSION: "13.2"
    TRT_CUDA_VERSION: "13.2"
    L0_CACHE_DIR: "$EDGE_LLM_CACHE_DIR/L0/MR_${CI_MERGE_REQUEST_IID}/${CI_PIPELINE_ID}"
    TEST_CACHE_DIR: "$L0_CACHE_DIR/jetson_orin"
    TRT_PACKAGE_DIR: "$EDGE_LLM_CACHE_DIR/trt_softwares/TensorRT-$TRT_VERSION/TensorRT-$TRT_VERSION.aarch64.cuda-$TRT_CUDA_VERSION"
    PRIORITY: l0_pipeline_orin
    ONNX_DIR: "$EDGE_LLM_CACHE_DIR/L0/MR_${CI_MERGE_REQUEST_IID}/onnx_cache/checkpoint_export_ampere/onnx"
    TEST_LOG_DIR: "$TEST_CACHE_DIR/logs"
    BASELINE_CSV: "$EDGE_LLM_CACHE_DIR/baselines/jetson_orin.csv"
  tags:
    - p3730-k8s
  image: "ubuntu:24.04"
  extends:
    - .device_test_template
    - .l0_rules
    - .l0_environment
  interruptible: true

