    - jedha-edgellm-nvks
  image: "ubuntu:24.04"
  before_script:
    - mkdir -p kernelSrcs/cuteDSLPrebuilt
    - mv -f cutedsl_aarch64_sm_110_cuda13.tar.gz cutedsl_aarch64_sm_110_cuda13.tar.gz.sha256 kernelSrcs/cuteDSLPrebuilt/ || true
  extends:
    - .device_test_template
    - .l0_rules
    - .l0_environment
  interruptible: true

# Cross-build for Drive Orin (D6L)
l0_cross_build_d6l:
  stage: l0_test
  variables:
    CUDA_VERSION: "11.4"
    TRT_VERSION: "10.13.3.9" # The d6l build is missing in edgellm cache for the latest TensorRT
    IMAGE: urm.nvidia.com/sw-tensorrt-docker/tensorrt-base:rel-10.15-cross-aarch64-d6l-cuda$CUDA_VERSION
    TRT_PACKAGE_DIR: "$EDGE_LLM_CACHE_DIR/trt_softwares/TensorRT-$TRT_VERSION/TensorRT-$TRT_VERSION.d6l.cuda-$CUDA_VERSION"
    EMBEDDED_TARGET: jetson-orin
  tags:
    - a30-edgellm-nvks
  image: "$IMAGE"
  extends:
    - .cross_build_template
    - .l0_rules
    - .l0_environment
  interruptible: true

# Cleanup job - Triggered when MR environment is stopped (merged/closed)
cleanup_l0_mr_cache:
  stage: .post
  dependencies: []
  variables:
    GIT_STRATEGY: none
  tags:
    - a30-edgellm-nvks
  script:
    - echo "Cleaning up L0 cache for MR ${CI_MERGE_REQUEST_IID}"
    # Safety check: ensure CI_MERGE_REQUEST_IID is set
    - |
      if [ -z "$CI_MERGE_REQUEST_IID" ]; then
        echo "ERROR: CI_MERGE_REQUEST_IID is not set!"
        echo "This cleanup job requires a merge request context."
        exit 1
      fi
    - MR_CACHE_DIR="${EDGE_LLM_CACHE_DIR}/L0/MR_${CI_MERGE_REQUEST_IID}"
    - |
      if [ -d "$MR_CACHE_DIR" ]; then
        echo "Found MR cache directory: $MR_CACHE_DIR"
        echo "Disk usage before cleanup:"
        du -sh "$MR_CACHE_DIR" || true
        echo "Removing $MR_CACHE_DIR..."
        rm -rf "$MR_CACHE_DIR"
        echo "✅ Cleanup completed successfully for MR ${CI_MERGE_REQUEST_IID}"
      else
        echo "ℹ️  No cache directory found at $MR_CACHE_DIR (already cleaned or no cache created)"
      fi
  environment:
    name: l0_cache/mr_$CI_MERGE_REQUEST_IID
    action: stop
  when: manual
  allow_failure: true
