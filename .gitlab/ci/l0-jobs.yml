    TRT_PACKAGE_DIR: "$EDGE_LLM_CACHE_DIR/trt_softwares/TensorRT-$TRT_VERSION/TensorRT-$TRT_VERSION.x86_64.cuda-$TRT_CUDA_VERSION"
    BASELINE_CSV: "$EDGE_LLM_CACHE_DIR/baselines/a30.csv"
