# Building and testing with RTX5080 Linux
l0_rtx5080:
    stage: l0_test
    needs:
      - l0_checkpoint_export
      - job: build_cutedsl_docker_matrix
        artifacts: true
    variables:
      # There's a known issue that CUDA TILE breaks myelin compilation on 5080, it has been fixed in TRT 10.15 while it is not picked to TRT main branch yet. Use 10.13.3.9 with CUDA 12.9 for now.
      CUDA_VERSION: "12.9"
      TRT_CUDA_VERSION: "12.9"
      TRT_VERSION: "10.13.3.9"
      IMAGE: urm.nvidia.com/sw-tensorrt-docker/tensorrt-base:$TRT_BRANCH-native-x86_64-ubuntu24.04-cuda$CUDA_VERSION
