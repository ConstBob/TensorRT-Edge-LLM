# ==============================================================================
# L0 TESTS - Merge requests and tagged stability schedules
#
# Merge request storage:
#   Workspace: /scratch.edge_llm_cache/L0/MR_<iid>/workspace/pipeline_<id>/
#   ONNX:      /scratch.edge_llm_cache/L0/MR_<iid>/onnx_cache/
#   ONNX exports are reused unless [reexport] is requested or exporter inputs
#   change.
#
# Stability storage (scheduled with L0_STABILITY=true):
#   Root: /scratch.edge_llm_cache/L0/STABILITY/
#         <UTC-created-at>_pipeline_<id>/
#   Jobs write directly beneath workspace/ because each stability root belongs
#   to exactly one pipeline.
#   ONNX exports are regenerated for every stability pipeline.
#   Each root is deleted by its environment lifecycle after two days.
#
# Every non-exempt job receives an isolated job_<id>_<slug> directory beneath
# its pipeline workspace. Initialization gates storage users, while an
# independent best-effort job prunes superseded MR pipeline workspaces.
# ==============================================================================

include:
  - local: '.gitlab/ci/templates.yml'

# Checkpoint export for Blackwell pre-quantized models
l0_checkpoint_export:
  stage: l0_test
  resource_group: "${L0_STORAGE_RESOURCE_GROUP}-onnx-blackwell"
  needs:
    - job: init_l0_storage
      artifacts: false
  variables:
    CUDA_VERSION: "13.2"
    IMAGE: artifactory.nvidia.com/sw-tensorrt-docker-local/tensorrt-base:$TRT_BRANCH-native-x86_64-ubuntu24.04-cuda$CUDA_VERSION
    PRIORITY: l0_checkpoint_export
    ONNX_REUSE: "$L0_ONNX_REUSE"
  tags:
    - a30-edgellm-nvks
  image: "$IMAGE"
  extends:
    - .l0_storage_paths
    - .l0_blackwell_exports
    - .checkpoint_export_template
    - .l0_rules

# Checkpoint export for Ampere pre-quantized models
l0_checkpoint_export_ampere:
  stage: l0_test
  resource_group: "${L0_STORAGE_RESOURCE_GROUP}-onnx-ampere"
  needs:
    - job: init_l0_storage
      artifacts: false
  variables:
    CUDA_VERSION: "13.2"
    IMAGE: artifactory.nvidia.com/sw-tensorrt-docker-local/tensorrt-base:$TRT_BRANCH-native-x86_64-ubuntu24.04-cuda$CUDA_VERSION
    PRIORITY: l0_checkpoint_export_ampere
    ONNX_REUSE: "$L0_ONNX_REUSE"
  tags:
    - a30-edgellm-nvks
  image: "$IMAGE"
  extends:
    - .l0_storage_paths
    - .l0_ampere_exports
    - .checkpoint_export_template
    - .l0_rules

# Checkpoint export for the TRT-RTX A30 pipeline. Exports Qwen3.5-0.8B int4_awq
# with the AWQ Int4GroupwiseGemmPlugin (V1); the TRT-RTX ONNX parser does not
# import the default cuteDSL V2 op, so this ONNX is TRT-RTX-specific and kept in
# its own cache rather than shared with l0_checkpoint_export_ampere.
l0_checkpoint_export_a30_trtrtx:
  stage: l0_test
  resource_group: "${L0_STORAGE_RESOURCE_GROUP}-onnx-a30-trtrtx"
  needs:
    - job: init_l0_storage
      artifacts: false
  variables:
    CUDA_VERSION: "13.2"
    IMAGE: artifactory.nvidia.com/sw-tensorrt-docker-local/tensorrt-base:$TRT_BRANCH-native-x86_64-ubuntu24.04-cuda$CUDA_VERSION
    PRIORITY: l0_checkpoint_export_a30_trtrtx
    ONNX_REUSE: "$L0_ONNX_REUSE"
  tags:
    - a30-edgellm-nvks
  image: "$IMAGE"
  extends:
    - .l0_storage_paths
    - .l0_a30_trtrtx_exports
    - .checkpoint_export_template
    - .l0_rules

