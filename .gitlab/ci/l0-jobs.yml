# ==============================================================================
# L0 TESTS - Merge Request Triggered
# Per-pipeline cache:  /scratch.edge_llm_cache/L0/MR_${CI_MERGE_REQUEST_IID}/${CI_PIPELINE_ID}/
#                      (engines, logs, per-runner caches; pruned by l0_cache_cleanup,
#                       which keeps only the newest NUMERIC pipeline dir per MR.)
# Reusable ONNX cache: /scratch.edge_llm_cache/L0/MR_${CI_MERGE_REQUEST_IID}/onnx_cache/
#                      Deliberately NON-numeric so it survives the pipeline-dir cleanup,
#                      letting later pipelines of the same MR reuse exported ONNX. The
#                      export jobs set ONNX_REUSE=1 and skip re-export unless the commit
#                      has [Reexport] or changes tensorrt_edgellm Python (see templates.yml).
# ==============================================================================

include:
  - local: '.gitlab/ci/templates.yml'

# Checkpoint export for Blackwell pre-quantized models
l0_checkpoint_export:
  stage: l0_test
  variables:
    CUDA_VERSION: "13.2"
    IMAGE: urm.nvidia.com/sw-tensorrt-docker/tensorrt-base:$TRT_BRANCH-native-x86_64-ubuntu24.04-cuda$CUDA_VERSION
    L0_CACHE_DIR: "$EDGE_LLM_CACHE_DIR/L0/MR_${CI_MERGE_REQUEST_IID}/${CI_PIPELINE_ID}"
    TEST_CACHE_DIR: "$L0_CACHE_DIR/checkpoint_export"
    PRIORITY: l0_checkpoint_export
    ONNX_REUSE: "1"
    ONNX_DIR: "$EDGE_LLM_CACHE_DIR/L0/MR_${CI_MERGE_REQUEST_IID}/onnx_cache/checkpoint_export/onnx"
    TEST_LOG_DIR: "$TEST_CACHE_DIR/logs"
  tags:
    - a30-edgellm-nvks
  image: "$IMAGE"
  extends:
    - .checkpoint_export_template
    - .l0_rules
    - .l0_environment

# Checkpoint export for Ampere pre-quantized models
l0_checkpoint_export_ampere:
