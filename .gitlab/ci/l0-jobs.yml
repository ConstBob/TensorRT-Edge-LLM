# Cleanup job - Triggered when an L0 environment is stopped
cleanup_l0_cache:
  stage: .post
  when: manual
  dependencies: []
  variables:
    GIT_STRATEGY: none
  tags:
    - a30-edgellm-nvks
  script:
    - |
      if [ -n "$CI_MERGE_REQUEST_IID" ]; then
        CACHE_ROOT="${EDGE_LLM_CACHE_DIR}/L0/MR_${CI_MERGE_REQUEST_IID}"
      elif [ "$CI_PIPELINE_SOURCE" = "schedule" ]; then
        CACHE_ROOT="${EDGE_LLM_CACHE_DIR}/L0/STABILITY/${CI_PIPELINE_ID}"
      else
        echo "ERROR: L0 cleanup requires a merge request or schedule context"
        exit 1
      fi
      echo "Cleaning up L0 cache at $CACHE_ROOT"
      if [ -d "$CACHE_ROOT" ]; then
        echo "Found L0 cache directory: $CACHE_ROOT"
        echo "Disk usage before cleanup:"
        du -sh "$CACHE_ROOT" || true
        echo "Removing $CACHE_ROOT..."
        rm -rf "$CACHE_ROOT"
        echo "✅ Cleanup completed successfully"
      else
        echo "ℹ️  No cache directory found at $CACHE_ROOT (already cleaned or no cache created)"
      fi
  environment:
    name: $L0_ENVIRONMENT_NAME
    action: stop
  extends: .l0_rules
  allow_failure: true
