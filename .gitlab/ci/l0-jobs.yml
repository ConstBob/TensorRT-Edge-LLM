# ==============================================================================
# L0 TESTS - Merge Request Triggered
# Cache Directory: /scratch.edge_llm_cache/L0/MR_${CI_MERGE_REQUEST_IID}/${CI_PIPELINE_ID}/
# ==============================================================================

include:
  - local: '.gitlab/ci/templates.yml'

# Model export for Ampere (fp16 or int4)
l0_ampere_model_export:
  stage: l0_test
  variables:
    CUDA_VERSION: "13.0"
    IMAGE: urm.nvidia.com/sw-tensorrt-docker/tensorrt-base:$TRT_BRANCH-native-x86_64-ubuntu24.04-cuda$CUDA_VERSION
    L0_CACHE_DIR: "$EDGE_LLM_CACHE_DIR/L0/MR_${CI_MERGE_REQUEST_IID}/${CI_PIPELINE_ID}"
    TEST_CACHE_DIR: "$L0_CACHE_DIR/ampere_model_export"
    PRIORITY: l0_export_ampere
    ONNX_DIR: "$TEST_CACHE_DIR/onnx"
    TEST_LOG_DIR: "$TEST_CACHE_DIR/logs"
  tags:
    - a30-edgellm-nvks
  image: "$IMAGE"
  extends:
    - .export_onnx_template
    - .l0_rules
    - .l0_environment
  interruptible: true

# Model export for Blackwell/Thor (fp8 or fp4)
l0_blackwell_model_export:
  stage: l0_test
  variables:
    CUDA_VERSION: "13.0"
    IMAGE: urm.nvidia.com/sw-tensorrt-docker/tensorrt-base:$TRT_BRANCH-native-x86_64-ubuntu24.04-cuda$CUDA_VERSION
    L0_CACHE_DIR: "$EDGE_LLM_CACHE_DIR/L0/MR_${CI_MERGE_REQUEST_IID}/${CI_PIPELINE_ID}"
    TEST_CACHE_DIR: "$L0_CACHE_DIR/blackwell_model_export"
    PRIORITY: l0_export_blackwell
    ONNX_DIR: "$TEST_CACHE_DIR/onnx"
    TEST_LOG_DIR: "$TEST_CACHE_DIR/logs"
  tags:
    - a30-edgellm-nvks
  image: "$IMAGE"
  extends:
    - .export_onnx_template
    - .l0_rules
    - .l0_environment
  interruptible: true

l0_blackwell_eagle_model_export:
  stage: l0_test
  variables:
    CUDA_VERSION: "13.0"
    IMAGE: urm.nvidia.com/sw-tensorrt-docker/tensorrt-base:$TRT_BRANCH-native-x86_64-ubuntu24.04-cuda$CUDA_VERSION
    L0_CACHE_DIR: "$EDGE_LLM_CACHE_DIR/L0/MR_${CI_MERGE_REQUEST_IID}/${CI_PIPELINE_ID}"
    TEST_CACHE_DIR: "$L0_CACHE_DIR/blackwell_model_export"
    PRIORITY: l0_eagle_export_blackwell
    ONNX_DIR: "$TEST_CACHE_DIR/onnx"
    TEST_LOG_DIR: "$TEST_CACHE_DIR/logs"
  tags:
    - a30-edgellm-nvks
  image: "$IMAGE"
  extends:
    - .export_onnx_template
    - .l0_rules
    - .l0_environment
  interruptible: true

# Building and testing with A30 Linux
l0_a30:
  stage: l0_test
  needs:
    - l0_ampere_model_export
  variables:
    CUDA_VERSION: "13.0"
    TRT_CUDA_VERSION: "13.1"
    IMAGE: urm.nvidia.com/sw-tensorrt-docker/tensorrt-base:$TRT_BRANCH-native-x86_64-ubuntu24.04-cuda$CUDA_VERSION
    L0_CACHE_DIR: "$EDGE_LLM_CACHE_DIR/L0/MR_${CI_MERGE_REQUEST_IID}/${CI_PIPELINE_ID}"
    TEST_CACHE_DIR: "$L0_CACHE_DIR/a30"
    PRIORITY: l0_pipeline_a30
    ONNX_DIR: "$L0_CACHE_DIR/ampere_model_export/onnx"
    TEST_LOG_DIR: "$TEST_CACHE_DIR/logs"
    ENGINE_DIR: "$TEST_CACHE_DIR/engines"
    TRT_PACKAGE_DIR: "$EDGE_LLM_CACHE_DIR/trt_softwares/TensorRT-$TRT_VERSION/TensorRT-$TRT_VERSION.x86_64.cuda-$TRT_CUDA_VERSION"
    BASELINE_CSV: "$EDGE_LLM_CACHE_DIR/baselines/a30.csv"
  tags:
    - a30-edgellm-nvks
  image: "$IMAGE"
  extends:
    - .x86_test_template
    - .l0_rules
    - .l0_environment
  interruptible: true

# Building and testing with RTX5080 Linux
l0_rtx5080:
    stage: l0_test
    needs:
      - l0_blackwell_model_export
    variables:
      # There's a known issue that CUDA TILE breaks myelin compilation on 5080, it has been fixed in TRT 10.15 while it is not picked to TRT main branch yet. Use 10.13.3.9 with CUDA 12.9 for now.
      CUDA_VERSION: "12.9"
      TRT_CUDA_VERSION: "12.9"
      TRT_VERSION: "10.13.3.9"
      IMAGE: urm.nvidia.com/sw-tensorrt-docker/tensorrt-base:$TRT_BRANCH-native-x86_64-ubuntu24.04-cuda$CUDA_VERSION
      L0_CACHE_DIR: "$EDGE_LLM_CACHE_DIR/L0/MR_${CI_MERGE_REQUEST_IID}/${CI_PIPELINE_ID}"
      TEST_CACHE_DIR: "$L0_CACHE_DIR/rtx5080"
      PRIORITY: l0_pipeline_rtx5080
      ONNX_DIR: "$L0_CACHE_DIR/blackwell_model_export/onnx"
      TEST_LOG_DIR: "$TEST_CACHE_DIR/logs"
      ENGINE_DIR: "$TEST_CACHE_DIR/engines"
      TRT_PACKAGE_DIR: "$EDGE_LLM_CACHE_DIR/trt_softwares/TensorRT-$TRT_VERSION/TensorRT-$TRT_VERSION.x86_64.cuda-$TRT_CUDA_VERSION"
      BASELINE_CSV: "$EDGE_LLM_CACHE_DIR/baselines/rtx5080.csv"
    tags:
      - rtx5080-edgellm-nvks
    image: "$IMAGE"
    extends:
      - .x86_test_template
      - .l0_rules
      - .l0_environment
    interruptible: true

# Building and testing with B100 Linux
l0_b100:
    stage: l0_test
    needs:
      - l0_blackwell_model_export
      - l0_blackwell_eagle_model_export
    variables:
      CUDA_VERSION: "13.0"
      TRT_CUDA_VERSION: "13.1"
      IMAGE: urm.nvidia.com/sw-tensorrt-docker/tensorrt-base:$TRT_BRANCH-native-x86_64-ubuntu24.04-cuda$CUDA_VERSION
      L0_CACHE_DIR: "$EDGE_LLM_CACHE_DIR/L0/MR_${CI_MERGE_REQUEST_IID}/${CI_PIPELINE_ID}"
      TEST_CACHE_DIR: "$L0_CACHE_DIR/b100"
      PRIORITY: l0_pipeline_b100
      ONNX_DIR: "$L0_CACHE_DIR/blackwell_model_export/onnx"
      TEST_LOG_DIR: "$TEST_CACHE_DIR/logs"
      ENGINE_DIR: "$TEST_CACHE_DIR/engines"
      TRT_PACKAGE_DIR: "$EDGE_LLM_CACHE_DIR/trt_softwares/TensorRT-$TRT_VERSION/TensorRT-$TRT_VERSION.x86_64.cuda-$TRT_CUDA_VERSION"
      BASELINE_CSV: "$EDGE_LLM_CACHE_DIR/baselines/b100.csv"
    tags:
      - b100-edgellm-nvks
    image: "$IMAGE"
    extends:
      - .x86_test_template
      - .l0_rules
      - .l0_environment
    interruptible: true

# Unit tests for low-level components (attention kernels, etc.)
l0_unit_tests_x86:
  stage: l0_test
  variables:
    CUDA_VERSION: "13.0"
    IMAGE: urm.nvidia.com/sw-tensorrt-docker/tensorrt-base:$TRT_BRANCH-native-x86_64-ubuntu24.04-cuda$CUDA_VERSION
    TEST_CACHE_DIR: "$PIPELINE_CACHE_DIR/unit_tests_x86"
    PRIORITY: l0_python_ut
    TEST_LOG_DIR: "$TEST_CACHE_DIR/logs"
    ENGINE_DIR: "$TEST_CACHE_DIR/engines"
    ONNX_DIR: "$TEST_CACHE_DIR/onnx"
    TRT_CUDA_VERSION: "13.1"
    TRT_PACKAGE_DIR: "$EDGE_LLM_CACHE_DIR/trt_softwares/TensorRT-$TRT_VERSION/TensorRT-$TRT_VERSION.x86_64.cuda-$TRT_CUDA_VERSION"
  parallel:
    matrix:
      - RUNNER_TAG: a30-edgellm-nvks
      - RUNNER_TAG: rtx5080-edgellm-nvks
      - RUNNER_TAG: b100-edgellm-nvks
  tags:
    - ${RUNNER_TAG}
  image: "$IMAGE"
  extends:
    - .x86_test_template
    - .l0_rules
    - .l0_environment
  interruptible: true

# Building and testing with Jetson Orin
l0_jetson_orin:
  stage: l0_test
  needs:
    - l0_ampere_model_export
  variables:
    BOARD_USER: "tensorrt_user"
    CUDA_VERSION: "12.9"
    L0_CACHE_DIR: "$EDGE_LLM_CACHE_DIR/L0/MR_${CI_MERGE_REQUEST_IID}/${CI_PIPELINE_ID}"
    TEST_CACHE_DIR: "$L0_CACHE_DIR/jetson_orin"
    TRT_PACKAGE_DIR: "$EDGE_LLM_CACHE_DIR/trt_softwares/TensorRT-$TRT_VERSION/TensorRT-$TRT_VERSION.jp6.cuda-$CUDA_VERSION"
    PRIORITY: l0_pipeline_orin
    ONNX_DIR: "$L0_CACHE_DIR/ampere_model_export/onnx"
    TEST_LOG_DIR: "$TEST_CACHE_DIR/logs"
    BASELINE_CSV: "$EDGE_LLM_CACHE_DIR/baselines/jetson_orin.csv"
  tags:
    - p3730-k8s
  image: "ubuntu:24.04"
  extends:
    - .device_test_template
    - .l0_rules
    - .l0_environment
  interruptible: true

# Building and testing with Drive Thor
l0_drive_thor_ferrix:
  stage: l0_test
  needs:
    - l0_blackwell_model_export
  variables:
    BOARD_USER: "tensorrt_user"
    TRT_VERSION: "10.13.3.9" # Thor board is running on cuda 12.8 which is not supported by the latest TensorRT
    CUDA_VERSION: "12.8"
    L0_CACHE_DIR: "$EDGE_LLM_CACHE_DIR/L0/MR_${CI_MERGE_REQUEST_IID}/${CI_PIPELINE_ID}"
    TEST_CACHE_DIR: "$L0_CACHE_DIR/drive_thor_ferrix"
    TRT_PACKAGE_DIR: "$EDGE_LLM_CACHE_DIR/trt_softwares/TensorRT-$TRT_VERSION/TensorRT-$TRT_VERSION.d7l.cuda-$CUDA_VERSION"
    PRIORITY: l0_pipeline_thor_ferrix
    ONNX_DIR: "$L0_CACHE_DIR/blackwell_model_export/onnx"
    TEST_LOG_DIR: "$TEST_CACHE_DIR/logs"
    BASELINE_CSV: "$EDGE_LLM_CACHE_DIR/baselines/drive_thor_ferrix.csv"
  tags:
    - thor_drive-nvks
  image: "ubuntu:24.04"
  extends:
    - .device_test_template
    - .l0_rules
    - .l0_environment
  interruptible: true

# Cross-build for Drive Orin (D6L)
l0_cross_build_d6l:
  stage: l0_test
  variables:
    CUDA_VERSION: "11.4"
    TRT_VERSION: "10.13.3.9" # The d6l build is missing in edgellm cache for the latest TensorRT
    IMAGE: urm.nvidia.com/sw-tensorrt-docker/tensorrt-base:rel-10.15-cross-aarch64-d6l-cuda$CUDA_VERSION
    TRT_PACKAGE_DIR: "$EDGE_LLM_CACHE_DIR/trt_softwares/TensorRT-$TRT_VERSION/TensorRT-$TRT_VERSION.d6l.cuda-$CUDA_VERSION"
    EMBEDDED_TARGET: jetson-orin
  tags:
    - a30-edgellm-nvks
  image: "$IMAGE"
  extends:
    - .cross_build_template
    - .l0_rules
    - .l0_environment
  interruptible: true

# Cleanup job - Triggered when MR environment is stopped (merged/closed)
cleanup_l0_mr_cache:
  stage: .post
  dependencies: []
  variables:
    GIT_STRATEGY: none
  tags:
    - a30-edgellm-nvks
  script:
    - echo "Cleaning up L0 cache for MR ${CI_MERGE_REQUEST_IID}"
    # Safety check: ensure CI_MERGE_REQUEST_IID is set
    - |
      if [ -z "$CI_MERGE_REQUEST_IID" ]; then
        echo "ERROR: CI_MERGE_REQUEST_IID is not set!"
        echo "This cleanup job requires a merge request context."
        exit 1
      fi
    - MR_CACHE_DIR="${EDGE_LLM_CACHE_DIR}/L0/MR_${CI_MERGE_REQUEST_IID}"
    - |
      if [ -d "$MR_CACHE_DIR" ]; then
        echo "Found MR cache directory: $MR_CACHE_DIR"
        echo "Disk usage before cleanup:"
        du -sh "$MR_CACHE_DIR" || true
        echo "Removing $MR_CACHE_DIR..."
        rm -rf "$MR_CACHE_DIR"
        echo "✅ Cleanup completed successfully for MR ${CI_MERGE_REQUEST_IID}"
      else
        echo "ℹ️  No cache directory found at $MR_CACHE_DIR (already cleaned or no cache created)"
      fi
  environment:
    name: l0_cache/mr_$CI_MERGE_REQUEST_IID
    action: stop
  when: manual
  allow_failure: true
