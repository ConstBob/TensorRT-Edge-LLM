    CUDA_VERSION: "13.2"
    TRT_CUDA_VERSION: "13.2"
    IMAGE: urm.nvidia.com/sw-tensorrt-docker/tensorrt-base:$TRT_BRANCH-native-x86_64-ubuntu24.04-cuda$CUDA_VERSION
    L0_CACHE_DIR: "$EDGE_LLM_CACHE_DIR/L0/MR_${CI_MERGE_REQUEST_IID}/${CI_PIPELINE_ID}"
    TEST_CACHE_DIR: "$L0_CACHE_DIR/a30"
    PRIORITY: l0_pipeline_a30
    ONNX_DIR: "$EDGE_LLM_CACHE_DIR/L0/MR_${CI_MERGE_REQUEST_IID}/onnx_cache/checkpoint_export_ampere/onnx"
    TEST_LOG_DIR: "$TEST_CACHE_DIR/logs"
    ENGINE_DIR: "$TEST_CACHE_DIR/engines"
    TRT_PACKAGE_DIR: "$EDGE_LLM_CACHE_DIR/trt_softwares/TensorRT-$TRT_VERSION/TensorRT-$TRT_VERSION.x86_64.cuda-$TRT_CUDA_VERSION"
    BASELINE_CSV: "$EDGE_LLM_CACHE_DIR/baselines/a30.csv"
  tags:
    - a30-edgellm-nvks
  image: "$IMAGE"
  extends:
    - .x86_test_template
    - .l0_rules
    - .l0_environment
  interruptible: true

l0_nemo_eval_a30:
  stage: l0_test
  needs:
    - l0_checkpoint_export_ampere
    - job: build_cutedsl_docker_matrix
      artifacts: true
  variables:
    CUDA_VERSION: "13.2"
    TRT_CUDA_VERSION: "13.2"
    IMAGE: urm.nvidia.com/sw-tensorrt-docker/tensorrt-base:$TRT_BRANCH-native-x86_64-ubuntu24.04-cuda$CUDA_VERSION
    L0_CACHE_DIR: "$EDGE_LLM_CACHE_DIR/L0/MR_${CI_MERGE_REQUEST_IID}/${CI_PIPELINE_ID}"
    TEST_CACHE_DIR: "$L0_CACHE_DIR/nemo_eval_a30"
    PRIORITY: l0_nemo_eval_qwen2_5_0_5b
    NEMO_EVAL_ONNX_CACHE_NAME: checkpoint_export_ampere
    TEST_LOG_DIR: "$TEST_CACHE_DIR/logs"
    ENGINE_DIR: "$TEST_CACHE_DIR/engines"
    TRT_PACKAGE_DIR: "$EDGE_LLM_CACHE_DIR/trt_softwares/TensorRT-$TRT_VERSION/TensorRT-$TRT_VERSION.x86_64.cuda-$TRT_CUDA_VERSION"
  tags:
    - a30-edgellm-nvks
  image: "$IMAGE"
  extends:
    - .nemo_eval_x86_template
    - .l0_environment
  rules:
    - if: $L1 == "true"
      when: never
    - if: $CI_COMMIT_MESSAGE =~ /\[skip tests\]/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /\[skip tests\]/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /(^|,)\[skip tests\](,|$)/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  allow_failure: true
  interruptible: true

