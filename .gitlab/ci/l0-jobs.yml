# Building and testing with Drive Thor 1 (SM110 Blackwell)
l0_drive_thor_1:
  stage: l0_test
  needs:
    - l0_checkpoint_export
    - job: build_cutedsl_sm110_artifact
      artifacts: true
  variables:
    BOARD_USER: "tensorrt_user"
    CUDA_VERSION: "13.0"
    TRT_VERSION: "10.16.0.72"
    TRT_CUDA_VERSION: "13.2"
    L0_CACHE_DIR: "$EDGE_LLM_CACHE_DIR/L0/MR_${CI_MERGE_REQUEST_IID}/${CI_PIPELINE_ID}"
    TEST_CACHE_DIR: "$L0_CACHE_DIR/drive_thor_1"
    TRT_PACKAGE_DIR: "$EDGE_LLM_CACHE_DIR/trt_softwares/TensorRT-$TRT_VERSION/TensorRT-$TRT_VERSION.d7l.cuda-$TRT_CUDA_VERSION"
    PRIORITY: l0_pipeline_thor_1
    ONNX_DIR: "$L0_CACHE_DIR/checkpoint_export/onnx"
    TEST_LOG_DIR: "$TEST_CACHE_DIR/logs"
    BASELINE_CSV: "$EDGE_LLM_CACHE_DIR/baselines/drive_thor_1.csv"
    BOARD_IP: "192.168.55.1"
  before_script:
    # CuTeDSL tarball comes from build_cutedsl_sm110_artifact (stage: setup);
    # GitLab fetches it into $CI_PROJECT_DIR. Move it where cmake/CuteDsl.cmake:244
    # expects it. `|| true` so a producer failure (allow_failure: true) lets us reach
    # the cmake step which will then FATAL_ERROR with a clear "run build_cutedsl.py" hint.
    - mkdir -p kernelSrcs/cuteDSLPrebuilt
    - mv -f cutedsl_aarch64_sm_110_cuda13.tar.gz cutedsl_aarch64_sm_110_cuda13.tar.gz.sha256 kernelSrcs/cuteDSLPrebuilt/ || true
  tags:
    - thor_drive-nvks
  image: "ubuntu:24.04"
  extends:
    - .device_test_template
    - .l0_rules
    - .l0_environment
  interruptible: true

