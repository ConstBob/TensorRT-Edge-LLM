include:
  - local: '.gitlab/ci/templates.yml'

l0_unit_test_a30:
  stage: l0_unit
  needs:
    - job: init_l0_storage
      artifacts: false
    - job: build_cutedsl_docker_matrix
      artifacts: true
  variables:
    CUDA_VERSION: "13.2"
    TRT_CUDA_VERSION: "13.2"
    IMAGE: "$CI_DEPENDENCY_PIPELINE_IMAGE"
    PRIORITY: l0_python_ut
    TRT_PACKAGE_DIR: "$EDGE_LLM_CACHE_DIR/trt_softwares/TensorRT-$TRT_VERSION/TensorRT-$TRT_VERSION.x86_64.cuda-$TRT_CUDA_VERSION"
  tags:
    - a30-edgellm-nvks
  image: "$IMAGE"
  extends:
    - .l0_storage_paths
    - .python_unit_test_template
    - .l0_rules

.l0_cpp_unit_device:
  stage: l0_unit
  needs:
    - job: init_l0_storage
      artifacts: false
    - job: build_cutedsl_docker_matrix
      artifacts: true
  variables:
    BOARD_USER: "tensorrt_user"
  tags:
    - $RUNNER_TAG
  extends:
    - .l0_storage_paths
    - .device_cpp_unit_test_template
    - .l0_rules

l0_unit_test_orin:
  variables:
    RUNNER_TAG: p3730-k8s
    EMBEDDED_TARGET: jetson-orin
    CUDA_CTK_VERSION: "13.2"
    TRT_PACKAGE_DIR: "$EDGE_LLM_CACHE_DIR/trt_softwares/TensorRT-$TRT_VERSION/TensorRT-$TRT_VERSION.aarch64.cuda-13.2"
    CPP_UNIT_BUILD_JOBS: "8"
    CPP_UNIT_TEST_JOBS: "2"
  extends: .l0_cpp_unit_device

l0_unit_test_thor:
  variables:
    RUNNER_TAG: thor_drive-nvks
    BOARD_IP: "192.168.55.1"
    EMBEDDED_TARGET: auto-thor
    CUDA_CTK_VERSION: "13.0"
    TRT_VERSION: "10.16.0.72"
    TRT_CUDA_VERSION: "13.2"
    TRT_PACKAGE_DIR: "$EDGE_LLM_CACHE_DIR/trt_softwares/TensorRT-$TRT_VERSION/TensorRT-$TRT_VERSION.d7l.cuda-$TRT_CUDA_VERSION"
    CPP_UNIT_TEST_JOBS: "4"
  extends: .l0_cpp_unit_device

"l0_cross_build_d6l_cuda11.4":
  stage: l0_unit
  needs:
    - job: build_cutedsl_docker_matrix
      artifacts: true
  variables:
    CUDA_VERSION: "11.4"
    TRT_VERSION: "10.13.3.9"
    TRT_CUDA_VERSION: "11.4"
    IMAGE: "artifactory.nvidia.com/sw-tensorrt-docker-local/tensorrt-base:rel-10.10-cross-aarch64-d6l-cuda11.4"
    TRT_PACKAGE_DIR: "$EDGE_LLM_CACHE_DIR/trt_softwares/TensorRT-$TRT_VERSION/TensorRT-$TRT_VERSION.d6l.cuda-$TRT_CUDA_VERSION"
    EMBEDDED_TARGET: jetson-orin
    ENABLE_CUTE_DSL: "ALL"
    CUTEDSL_PREBUILT_VERSION: "1.7.0-sm87-cuda11"
  tags:
    - a30-edgellm-nvks
  image: "$IMAGE"
  before_script:
    - mkdir -p kernelSrcs/cuteDSLPrebuilt
    - |
      base="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/cutedsl-prebuilt/$CUTEDSL_PREBUILT_VERSION"
      tarball="kernelSrcs/cuteDSLPrebuilt/cutedsl_aarch64_sm_87_cuda11.tar.gz"
      curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "$base/cutedsl_aarch64_sm_87_cuda11.tar.gz" -o "$tarball"
      curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "$base/cutedsl_aarch64_sm_87_cuda11.tar.gz.sha256" -o "$tarball.sha256"
      (cd kernelSrcs/cuteDSLPrebuilt && sha256sum -c cutedsl_aarch64_sm_87_cuda11.tar.gz.sha256)
  extends:
    - .cross_build_template
    - .l0_rules

