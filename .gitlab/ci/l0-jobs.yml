# ==============================================================================
# L0 TESTS - Merge requests and tagged stability schedules
#
# Merge request caches:
#   Per-pipeline: /scratch.edge_llm_cache/L0/MR_<iid>/<pipeline_id>/
#   Reusable ONNX: /scratch.edge_llm_cache/L0/MR_<iid>/onnx_cache/
#   l0_cache_cleanup keeps the newest numeric pipeline directory per MR. The
#   non-numeric ONNX cache survives so later pipelines can reuse exports unless
#   [Reexport] is requested or exporter inputs change.
#
# Stability caches (scheduled with L0_STABILITY=true):
#   Per-pipeline: /scratch.edge_llm_cache/L0/STABILITY/<pipeline_id>/
#   ONNX exports stay inside the pipeline cache and are regenerated every run.
#   l0_cache_cleanup removes stability pipeline caches older than three days.
#
# .l0_rules selects the context and supplies its cache/environment variables.
# cleanup_l0_cache removes that context when its environment is stopped.
# ==============================================================================

include:
  - local: '.gitlab/ci/templates.yml'

# Checkpoint export for Blackwell pre-quantized models
l0_checkpoint_export:
  stage: l0_test
  variables:
    CUDA_VERSION: "13.2"
    IMAGE: urm.nvidia.com/sw-tensorrt-docker/tensorrt-base:$TRT_BRANCH-native-x86_64-ubuntu24.04-cuda$CUDA_VERSION
    TEST_CACHE_DIR: "$L0_CACHE_DIR/checkpoint_export"
    PRIORITY: l0_checkpoint_export
    ONNX_REUSE: "$L0_ONNX_REUSE"
    ONNX_DIR: "$L0_ONNX_CACHE_DIR/checkpoint_export/onnx"
    TEST_LOG_DIR: "$TEST_CACHE_DIR/logs"
  tags:
    - a30-edgellm-nvks
  image: "$IMAGE"
  extends:
    - .checkpoint_export_template
    - .l0_rules
    - .l0_environment

